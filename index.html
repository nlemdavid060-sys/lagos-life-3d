
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>LAGOS LIFE 3D</title>

<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial;background:#111}
#title{position:absolute;top:12px;width:100%;text-align:center;color:white;font-size:24px;font-weight:bold;text-shadow:2px 2px 5px black;pointer-events:none}
#speed,#money{position:absolute;left:12px;color:white;background:#111c;padding:10px;border-radius:10px;font-weight:bold}
#speed{top:55px}
#money{top:105px;color:#00ff85;font-size:18px}
button{border:2px solid white;border-radius:14px;background:#111d;color:white;font-size:18px;font-weight:bold;touch-action:none}
#phoneButton,#mapButton,#houseButton{position:absolute;right:15px;width:65px;height:48px}
#phoneButton{top:15px}
#mapButton{top:72px;background:#087b35}
#houseButton{top:129px;background:#87511b;font-size:14px}
.controls{position:absolute;bottom:20px;width:100%;display:flex;justify-content:space-between;padding:0 15px}
.group{display:flex;gap:10px;align-items:end}
.controls button{width:60px;height:60px}
#gas{width:75px;height:75px;background:#087b35}
#nitro{background:#0758bd}
.panel{display:none;position:absolute;z-index:20;top:50%;left:50%;transform:translate(-50%,-50%);width:290px;padding:20px;border:5px solid #555;border-radius:25px;background:#17221c;color:white;text-align:center;box-shadow:0 0 25px black}
.panel button{width:100%;height:45px;margin-top:12px;background:#087b35}
#phoneScreen h1{color:#00ff85}
#mapCanvas{width:250px;height:250px;background:#397d35;border:2px solid white;border-radius:10px}
#houseScreen{background:#d6c19c;color:#222}
</style>
</head>

<body>

<div id="title">LAGOS LIFE 3D</div>
<div id="speed">SPEED: 0 KM/H</div>
<div id="money">MONEY: ₦50,000</div>

<button id="phoneButton" onclick="openPhone()">📱</button>
<button id="mapButton" onclick="openMap()">🗺️ MAP</button>
<button id="houseButton" onclick="enterHouse()">🏠 HOUSE</button>

<div id="phoneScreen" class="panel">
<h2>📱 MY PHONE</h2>
<p>LAGOS LIFE MOBILE</p>
<hr>
<h3>🏦 MY WALLET</h3>
<h1 id="wallet">₦50,000</h1>
<p>Welcome to Lagos!</p>
<button onclick="closePhone()">CLOSE PHONE</button>
</div>

<div id="mapScreen" class="panel">
<h3>🗺️ LAGOS CITY MAP</h3>
<canvas id="mapCanvas" width="250" height="250"></canvas>
<button onclick="closeMap()">CLOSE MAP</button>
</div>

<div id="houseScreen" class="panel">
<h2>🏠 MY LAGOS HOUSE</h2>
<p>Welcome home!</p>
<p>Living Room</p>
<p>Bedroom</p>
<p>Kitchen</p>
<button onclick="leaveHouse()">EXIT HOUSE</button>
</div>

<div class="controls">
<div class="group">
<button id="left">◀</button>
<button id="right">▶</button>
</div>
<div class="group">
<button id="nitro">N₂</button>
<button id="gas">GO</button>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,40,180);

const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x555555,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-20,40,20);
scene.add(sun);

// GROUND
const ground=new THREE.Mesh(
new THREE.PlaneGeometry(300,500),
new THREE.MeshLambertMaterial({color:0x397d35}));
ground.rotation.x=-Math.PI/2;
ground.position.y=-0.1;
scene.add(ground);

// ROAD
const road=new THREE.Mesh(
new THREE.PlaneGeometry(14,500),
new THREE.MeshLambertMaterial({color:0x292929}));
road.rotation.x=-Math.PI/2;
scene.add(road);

for(let z=-240;z<250;z+=12){
const line=new THREE.Mesh(
new THREE.BoxGeometry(0.25,0.04,5),
new THREE.MeshBasicMaterial({color:0xffffff}));
line.position.set(0,0.04,z);
scene.add(line);
}

// CITY BUILDINGS
for(let i=0;i<55;i++){
const side=i%2===0?-1:1;
const height=8+Math.random()*22;
const width=5+Math.random()*5;
const building=new THREE.Mesh(
new THREE.BoxGeometry(width,height,7),
new THREE.MeshLambertMaterial({color:[0xd6b58b,0xb5b5b5,0xd4d4d4,0x9eacb5][i%4]}));
building.position.set(side*(12+Math.random()*9),height/2,-240+i*9);
scene.add(building);
}

// LAGOS HOUSES
const houses=[];
function createHouse(x,z){
const house=new THREE.Group();

const wall=new THREE.Mesh(
new THREE.BoxGeometry(9,5,8),
new THREE.MeshLambertMaterial({color:0xe5d1ad}));
wall.position.y=2.5;
house.add(wall);

const roof=new THREE.Mesh(
new THREE.ConeGeometry(7,3,4),
new THREE.MeshLambertMaterial({color:0x9c2929}));
roof.rotation.y=Math.PI/4;
roof.position.y=6.5;
house.add(roof);

const door=new THREE.Mesh(
new THREE.BoxGeometry(1.5,2.8,0.15),
new THREE.MeshLambertMaterial({color:0x55301c}));
door.position.set(0,1.4,4.05);
house.add(door);

for(const wx of [-2.7,2.7]){
const win=new THREE.Mesh(
new THREE.BoxGeometry(1.5,1.5,0.15),
new THREE.MeshBasicMaterial({color:0x55bbee}));
win.position.set(wx,3.1,4.05);
house.add(win);
}

house.position.set(x,0,z);
scene.add(house);
houses.push(house);
}

for(let i=0;i<12;i++){
createHouse(-30,-220+i*18);
createHouse(30,-220+i*18);
}

// BUGATTI
const car=new THREE.Group();
scene.add(car);

const blue=new THREE.MeshStandardMaterial({color:0x0649ff,metalness:0.7,roughness:0.25});
const black=new THREE.MeshStandardMaterial({color:0x111111});
const glass=new THREE.MeshStandardMaterial({color:0x111e35,metalness:0.5,roughness:0.2});

const body=new THREE.Mesh(new THREE.BoxGeometry(2.3,0.65,4.5),blue);
body.position.y=0.8;
car.add(body);

const roofCar=new THREE.Mesh(new THREE.BoxGeometry(1.8,0.65,2),glass);
roofCar.position.set(0,1.35,0.15);
car.add(roofCar);

const hood=new THREE.Mesh(new THREE.BoxGeometry(2.1,0.25,1.3),blue);
hood.position.set(0,1.05,-1.5);
car.add(hood);

const wheels=[];
for(const x of [-1.15,1.15]){
for(const z of [-1.4,1.4]){
const wheel=new THREE.Mesh(new THREE.CylinderGeometry(0.43,0.43,0.3,24),black);
wheel.rotation.z=Math.PI/2;
wheel.position.set(x,0.45,z);
car.add(wheel);
wheels.push(wheel);
}
}

for(const x of [-0.75,0.75]){
const light=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.18,0.08),new THREE.MeshBasicMaterial({color:0xffffff}));
light.position.set(x,1.02,-2.27);
car.add(light);
}

car.position.set(0,0,0);

// MONEY
let gameMoney=50000;
function updateMoney(){
const amount="₦"+gameMoney.toLocaleString("en-NG");
document.getElementById("money").innerText="MONEY: "+amount;
document.getElementById("wallet").innerText=amount;
}

// PHONE
function openPhone(){
document.getElementById("phoneScreen").style.display="block";
}
function closePhone(){
document.getElementById("phoneScreen").style.display="none";
}

// MAP
function openMap(){
document.getElementById("mapScreen").style.display="block";
drawMap();
}
function closeMap(){
document.getElementById("mapScreen").style.display="none";
}

function drawMap(){
const canvas=document.getElementById("mapCanvas");
const ctx=canvas.getContext("2d");
ctx.fillStyle="#397d35";
ctx.fillRect(0,0,250,250);

ctx.fillStyle="#333";
ctx.fillRect(110,0,30,250);
ctx.fillRect(0,110,250,30);

ctx.fillStyle="#e5c18a";
for(let i=0;i<5;i++){
ctx.fillRect(35,15+i*45,22,18);
ctx.fillRect(190,15+i*45,22,18);
}

ctx.fillStyle="#ff3333";
ctx.beginPath();
ctx.arc(125+car.position.x*5,125,7,0,Math.PI*2);
ctx.fill();

ctx.fillStyle="white";
ctx.font="12px Arial";
ctx.fillText("YOUR CAR",140,125);
}

// HOUSE INTERIOR
let insideHouse=false;

function enterHouse(){
if(insideHouse)return;
if(speed>0.1){
alert("Stop your car before entering!");
return;
}
if(Math.abs(car.position.x)>5){
alert("Drive closer to the house first!");
return;
}

insideHouse=true;
car.visible=false;
document.getElementById("houseScreen").style.display="block";
scene.background=new THREE.Color(0x20202a);
}

function leaveHouse(){
insideHouse=false;
car.visible=true;
document.getElementById("houseScreen").style.display="none";
scene.background=new THREE.Color(0x87ceeb);
}

// CONTROLS
const keys={left:false,right:false,gas:false,nitro:false};

function holdButton(id,key){
const button=document.getElementById(id);
button.addEventListener("pointerdown",e=>{
e.preventDefault();
keys[key]=true;
});
const release=()=>keys[key]=false;
button.addEventListener("pointerup",release);
button.addEventListener("pointerleave",release);
button.addEventListener("pointercancel",release);
}

holdButton("left","left");
holdButton("right","right");
holdButton("gas","gas");
holdButton("nitro","nitro");

window.addEventListener("keydown",e=>{
if(e.key==="ArrowLeft")keys.left=true;
if(e.key==="ArrowRight")keys.right=true;
if(e.key==="ArrowUp")keys.gas=true;
if(e.key==="Shift")keys.nitro=true;
});

window.addEventListener("keyup",e=>{
if(e.key==="ArrowLeft")keys.left=false;
if(e.key==="ArrowRight")keys.right=false;
if(e.key==="ArrowUp")keys.gas=false;
if(e.key==="Shift")keys.nitro=false;
});

let speed=0;

function animate(){
requestAnimationFrame(animate);

if(!insideHouse){
const maximum=keys.nitro?2.2:1.1;

if(keys.gas)speed=Math.min(speed+0.025,maximum);
else speed=Math.max(speed-0.015,0);

if(keys.left)car.position.x-=0.08;
if(keys.right)car.position.x+=0.08;

car.position.x=Math.max(-5,Math.min(5,car.position.x));
car.position.z-=speed;

if(car.position.z < -100)car.position.z=0;

wheels.forEach(w=>w.rotation.x-=speed*0.15);

camera.position.set(car.position.x,5.5,car.position.z+10);
camera.lookAt(car.position.x,1,car.position.z-5);

document.getElementById("speed").innerText="SPEED: "+Math.round(speed*100)+" KM/H";
}

renderer.render(scene,camera);
}

camera.position.set(0,5,10);
updateMoney();
animate();

window.addEventListener("resize",()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>

</body>
</html>
