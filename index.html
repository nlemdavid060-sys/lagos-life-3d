
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1,user-scalable=no">
<title>LAGOS LIFE 3D - MEGA EDITION</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#77baff;font-family:Arial;color:white}
canvas{display:block}
#loading{position:fixed;inset:0;background:#101d35;z-index:10;display:grid;place-items:center;text-align:center}
#loading h1{color:#54dfff}
#loading p{color:#dceeff}
#ui{position:fixed;inset:0;pointer-events:none}
.panel{background:#101827ed;border:1px solid #ffffff40;border-radius:12px;padding:10px;pointer-events:auto}
#top{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-start}
#logo{font-size:15px;font-weight:900;color:#50dcff}
#stats{text-align:right;font-size:12px;line-height:1.6}
#menu{position:absolute;right:8px;top:100px;display:flex;flex-direction:column;gap:6px}
button{border:0;border-radius:9px;background:#087ddd;color:white;padding:10px;font-weight:bold;font-size:11px;pointer-events:auto}
button:active{background:#00baff}
#controls{position:absolute;bottom:18px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-end}
#pad{display:grid;grid-template-columns:46px 46px 46px;grid-template-rows:46px 46px;gap:4px}
#pad button{font-size:20px;padding:0;background:#142b48dd}
#up{grid-column:2}
#left{grid-column:1;grid-row:2}
#down{grid-column:2;grid-row:2}
#right{grid-column:3;grid-row:2}
#actions{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
#actions button{min-width:92px}
#popup{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:90%;max-width:390px;max-height:75vh;overflow:auto;text-align:center}
#popup h2{color:#55dcff}
#popup button{margin:3px}
#hint{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);font-size:10px;text-shadow:0 1px 4px black;white-space:nowrap}
</style>
</head>
<body>
<div id="loading"><div><h1>LAGOS LIFE 3D</h1><p id="loadText">Building your city...</p><p>Please wait</p></div></div>
<div id="ui">
 <div id="top">
  <div class="panel"><div id="logo">LAGOS LIFE 3D</div><small id="place">LAGOS, NIGERIA</small></div>
  <div class="panel" id="stats">
   💰 ₦<span id="money">1000000000000</span><br>
   🚘 <span id="mode">WALKING</span><br>
   🌞 <span id="clock">DAY</span>
  </div>
 </div>
 <div id="menu">
  <button onclick="openMenu('phone')">📱 PHONE</button>
  <button onclick="openMenu('map')">🗺️ DESTINATIONS</button>
  <button onclick="openMenu('garage')">🚘 GARAGE</button>
  <button onclick="openMenu('clothes')">👕 CLOTHES</button>
  <button onclick="openMenu('bank')">🏦 BANK</button>
  <button onclick="openMenu('missions')">🎯 MISSIONS</button>
  <button onclick="toggleNight()">🌙 DAY/NIGHT</button>
 </div>
 <div id="controls">
  <div id="pad">
   <button id="up">⬆</button><button id="left">⬅</button>
   <button id="down">⬇</button><button id="right">➡</button>
  </div>
  <div id="actions">
   <button onclick="enterCar()">🚗 ENTER / EXIT</button>
   <button onclick="run=!run">🏃 RUN</button>
   <button onclick="interact()">🏡 INTERACT</button>
  </div>
 </div>
 <div id="popup" class="panel"></div>
 <div id="hint">Use the arrows to explore Lagos</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const loading=document.getElementById('loading');
const loadText=document.getElementById('loadText');
let failed=false;
const failTimer=setTimeout(()=>{
 if(!window.THREE){
  failed=true;
  loadText.innerHTML='3D engine did not load.<br>Check your internet and refresh.';
 }
},12000);

if(!window.THREE)return;

try{
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x80c8ff);
scene.fog=new THREE.Fog(0x80c8ff,100,260);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,800);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.insertBefore(renderer.domElement,document.getElementById('ui'));

scene.add(new THREE.HemisphereLight(0xd9efff,0x46552d,1.5));
const sun=new THREE.DirectionalLight(0xffedc5,2);
sun.position.set(-35,60,30);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

const material=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.8});
const grass=material(0x398b43);
const road=material(0x30343b);
const yellow=material(0xffd329);
const glass=material(0x5eafce);
function cube(w,h,d,m,x,y,z){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
 o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;
 scene.add(o);return o;
}
cube(400,1,400,grass,0,-.7,0);
cube(400,.15,14,road,0,0,0);
cube(14,.15,400,road,0,0,0);
for(let i=-190;i<190;i+=12){
 cube(5,.025,.22,yellow,i,.1,0);
 cube(.22,.025,5,yellow,0,.1,i);
}
const buildingColors=[0xe2c7a9,0xc5d4dc,0xd5b5a0,0xb6c6ce,0xf1e3cc];
function makeBuilding(x,z,w,h,d){
 cube(w,h,d,material(buildingColors[Math.floor(Math.random()*buildingColors.length)]),x,h/2,z);
 for(let y=2;y<h-1;y+=3){
  for(let xx=-w/2+1;xx<w/2;xx+=2.5){
   cube(1,1.3,.12,glass,x+xx,y,z-d/2-.08);
  }
 }
}
for(let x=-85;x<=85;x+=18){
 for(let z=-85;z<=85;z+=18){
  if(Math.abs(x)<16||Math.abs(z)<16)continue;
  makeBuilding(x+Math.random()*4,z+Math.random()*4,9+Math.random()*5,9+Math.random()*23,9+Math.random()*5);
 }
}
function palm(x,z){
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.2,.35,5,8),material(0x79502c));
 trunk.position.set(x,2.5,z);scene.add(trunk);
 for(let i=0;i<7;i++){
  const leaf=new THREE.Mesh(new THREE.BoxGeometry(.4,.15,4),material(0x167b35));
  leaf.position.set(x,5,z);leaf.rotation.y=i*.9;leaf.rotation.x=.2;scene.add(leaf);
 }
}
for(let i=-90;i<=90;i+=12){palm(i,-13);palm(i,13);}

function makeCar(color){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.BoxGeometry(3,1,5),material(color));
 body.position.y=1;g.add(body);
 const roof=new THREE.Mesh(new THREE.BoxGeometry(2.2,.8,2.3),material(0x192d40));
 roof.position.set(0,1.8,-.2);g.add(roof);
 for(const x of [-1.55,1.55])for(const z of [-1.6,1.6]){
  const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,.35,16),material(0x111111));
  wheel.rotation.z=Math.PI/2;wheel.position.set(x,.55,z);g.add(wheel);
 }
 return g;
}
const carColors=[0x075dff,0x111111,0xcc2020,0xe9e9e9];
let selectedCar=0;
let car=makeCar(carColors[0]);car.position.set(5,0,8);scene.add(car);

const player=new THREE.Group();
const person=new THREE.Mesh(new THREE.CylinderGeometry(.4,.48,1.4,12),material(0x147bff));
person.position.y=1;player.add(person);
const head=new THREE.Mesh(new THREE.SphereGeometry(.35,16,16),material(0x925b3d));
head.position.y=2;player.add(head);
const hair=new THREE.Mesh(new THREE.SphereGeometry(.36,12,8),material(0x17120e));
hair.scale.y=.45;hair.position.y=2.23;player.add(hair);
player.position.set(0,0,25);scene.add(player);

function makeDanfo(x,z){
 const g=new THREE.Group();
 const b=new THREE.Mesh(new THREE.BoxGeometry(2.6,2.4,4),material(0xffd322));
 b.position.y=1.3;g.add(b);
 const win=new THREE.Mesh(new THREE.BoxGeometry(2.2,.8,.1),glass);
 win.position.set(0,1.7,-2.05);g.add(win);
 g.position.set(x,0,z);scene.add(g);return g;
}
const buses=[makeDanfo(-30,0),makeDanfo(30,0),makeDanfo(-60,0)];

function buildingLabel(text,x,z){
 const sign=cube(9,1,.3,material(0x123e61),x,4,z);
 return sign;
}
// Mansion compound
cube(27,.4,25,material(0x777777),-48,.1,-45);
cube(15,8,12,material(0xe9d8bd),-48,4,-47);
cube(16,.7,13,material(0x75452e),-48,8.2,-47);
cube(2,.4,12,material(0xf5e6cf),-48,8.7,-47);
for(let x of [-53,-48,-43])cube(1,6,.7,material(0xffffff),x,4,-40.8);
cube(7,.2,5,material(0x20a7cf),-35,.3,-45);
cube(27,2,.3,material(0xd5d5d5),-48,1,-32);
buildingLabel('MANSION',-48,-32);

// Mansion interior room display
const mansionRoom=new THREE.Group();
mansionRoom.position.set(-48,0,-47);
scene.add(mansionRoom);
cube(12,.3,10,material(0xe9d6bd),-48,.3,-47);
cube(12,5,.3,material(0xf0e5d1),-48,2.8,-42);
cube(2,1,.3,material(0x70452c),-45,1,-44);
cube(3,.4,2,material(0x603a24),-48,1,-49);

// Hotel and pool
cube(20,.4,18,material(0x777777),45,.1,-45);
cube(13,17,11,material(0xd7e2ed),45,8.5,-46);
cube(14,.7,12,material(0x263e58),45,17.2,-46);
cube(10,.2,7,material(0x16bce2),59,.3,-43);
buildingLabel('HOTEL',45,-36);

// Airport and aeroplane
cube(32,.3,18,material(0x858585),-48,.1,48);
cube(20,8,12,material(0xd5e0e7),-48,4,48);
cube(22,.5,13,material(0x273c56),-48,8.2,48);
const plane=new THREE.Group();
const fuselage=new THREE.Mesh(new THREE.BoxGeometry(2,1,9),material(0xffffff));
plane.add(fuselage);
const wing=new THREE.Mesh(new THREE.BoxGeometry(12,.25,2),material(0xffffff));
plane.add(wing);
const tail=new THREE.Mesh(new THREE.BoxGeometry(4,.2,1),material(0xe51c2a));
tail.position.set(0,1,-4);plane.add(tail);
plane.position.set(-48,4,65);scene.add(plane);
buildingLabel('AIRPORT',-48,59);

let money=1000000000000;
let saved=null;
try{saved=JSON.parse(localStorage.getItem('lagosMegaSave')||'null')}catch(e){}
if(saved&&saved.v===4){
 if(Number.isFinite(saved.money))money=saved.money;
 if(Number.isInteger(saved.clothes))person.material=material(saved.clothes);
}
let inCar=false,night=false,run=false,inside=false,place='LAGOS';
let keys={},held={},completed={};
const popup=document.getElementById('popup');
function update(){
 document.getElementById('money').textContent=money.toLocaleString('en-NG');
 document.getElementById('mode').textContent=inCar?'DRIVING':inside?'MANSION':'WALKING';
 document.getElementById('clock').textContent=night?'NIGHT':'DAY';
 document.getElementById('place').textContent=place+', NIGERIA';
}
function save(){
 try{localStorage.setItem('lagosMegaSave',JSON.stringify({v:4,money:money,clothes:person.material.color.getHex(),completed:completed}))}catch(e){}
 update();
}
function show(title,body){
 popup.innerHTML='<h2>'+title+'</h2>'+body+'<p><button onclick="closeMenu()" style="background:#b83249">CLOSE</button></p>';
 popup.style.display='block';
}
window.closeMenu=()=>popup.style.display='none';
window.openMenu=function(type){
 let body='';
 if(type==='phone')body='<p>Welcome to your Lagos Life phone.</p><button onclick="openMenu(\\'map\\')">DESTINATIONS</button><button onclick="openMenu(\\'bank\\')">BANK</button>';
 if(type==='map')body='<p>Choose a destination</p>'+['Lagos','Ogun','Oyo','Rivers','Kano','Enugu','Delta','Kaduna','Abuja FCT'].map(s=>'<button onclick="travel(\\''+s+'\\')">'+s+'</button>').join('');
 if(type==='garage')body='<p>Choose your car</p>'+['Bugatti','Lamborghini','Ferrari','Mercedes'].map((s,i)=>'<button onclick="chooseCar('+i+')">'+s+'</button>').join('');
 if(type==='clothes')body='<p>Choose your outfit colour</p>'+[['Blue',0x147bff],['Red',0xd42c37],['White',0xffffff],['Green',0x16a45b],['Purple',0x8738cc]].map(a=>'<button onclick="changeClothes('+a[1]+')">'+a[0]+'</button>').join('');
 if(type==='bank')body='<p>Virtual balance: ₦'+money.toLocaleString('en-NG')+'</p><p>Virtual investments. Returns are instant in this demo.</p>'+[['Small business',10000000,12000000],['Shopping mall',50000000,60000000],['Hotel business',100000000,125000000],['Factory',200000000,250000000]].map(a=>'<p>'+a[0]+' — ₦'+a[1].toLocaleString('en-NG')+' <button onclick="invest('+a[1]+','+a[2]+')">INVEST</button></p>').join('');
 if(type==='missions')body='<p>Complete these city missions:</p>'+[['Visit mansion', 'mansion'],['Visit hotel','hotel'],['Visit airport','airport'],['Drive a car','car']].map(a=>'<p>'+a[0]+' '+(completed[a[1]]?'✅':'')+'</p>').join('')+'<p>Each mission reward: ₦500,000</p>';
 show(type.toUpperCase(),body);
};
window.travel=function(s){place=s;player.position.set(0,0,25);inside=false;closeMenu();update();};
window.chooseCar=function(i){
 selectedCar=i;
 scene.remove(car);car=makeCar(carColors[i]);car.position.copy(player.position);car.position.y=0;scene.add(car);
 closeMenu();alert(['Bugatti','Lamborghini','Ferrari','Mercedes'][i]+' selected!');
};
window.changeClothes=function(c){person.material=material(c);save();closeMenu();};
window.invest=function(cost,ret){
 if(money<cost){alert('Not enough virtual money');return;}
 money=money-cost+ret;save();alert('Virtual investment completed!');openMenu('bank');
};
window.toggleNight=function(){
 night=!night;
 scene.background=new THREE.Color(night?0x08152d:0x80c8ff);
 scene.fog.color.set(night?0x08152d:0x80c8ff);
 sun.intensity=night?.15:2;update();
};
window.enterCar=function(){
 if(inside){alert('Exit the mansion first.');return;}
 inCar=!inCar;
 if(inCar){car.position.copy(player.position);car.position.y=0;}
 update();
};
window.interact=function(){
 const p=player.position;
 const near=(x,z)=>Math.hypot(p.x-x,p.z-z)<17;
 if(near(-48,-47)){
  inside=!inside;
  if(inside){player.position.set(-48,0,-47);show('YOUR MANSION','<p>Welcome home!</p><p>Bedroom, living room and family lounge.</p><p>Explore the mansion compound outside. This is a demo interior.</p>');}
  else{player.position.set(-48,0,-28);closeMenu();}
  update();return;
 }
 if(near(45,-45)){openMenu('hotel');return;}
 if(near(-48,48)){show('LAGOS AIRPORT','<p>Welcome to the airport.</p><p>Your destinations are ready.</p><button onclick="openMenu(\\'map\\')">CHOOSE DESTINATION</button>');return;}
 alert('Explore the city to find the mansion, hotel and airport!');
};
window.buyHotel=function(){
 if(money<2000000){alert('Not enough money');return;}
 money-=2000000;save();alert('Hotel room booked!');
};
window.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
['up','down','left','right'].forEach(id=>{
 const b=document.getElementById(id);
 b.addEventListener('pointerdown',e=>{e.preventDefault();held[id]=true;});
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>held[id]=false));
});
function move(){
 if(inside||popup.style.display==='block')return;
 let f=keys.w||keys.arrowup||held.up;
 let b=keys.s||keys.arrowdown||held.down;
 let l=keys.a||keys.arrowleft||held.left;
 let r=keys.d||keys.arrowright||held.right;
 const step=inCar?.65:(run?.32:.15);
 let obj=inCar?car:player;
 if(f)obj.position.z-=step;
 if(b)obj.position.z+=step;
 if(l)obj.position.x-=step;
 if(r)obj.position.x+=step;
 if(inCar){player.position.x=car.position.x;player.position.z=car.position.z;}
 obj.position.x=Math.max(-185,Math.min(185,obj.position.x));
 obj.position.z=Math.max(-185,Math.min(185,obj.position.z));
}
function animate(){
 requestAnimationFrame(animate);
 move();
 buses.forEach((b,i)=>{b.position.x+=.07+i*.025;if(b.position.x>110)b.position.x=-110;});
 plane.position.x+=.09;
 if(plane.position.x>100)plane.position.x=-100;
 const target=inCar?car.position:player.position;
 const cameraTarget=inside?new THREE.Vector3(-36,7,-36):new THREE.Vector3(target.x+12,10,target.z+17);
 camera.position.lerp(cameraTarget,.08);
 camera.lookAt(inside?new THREE.Vector3(-48,2,-47):new THREE.Vector3(target.x,1.3,target.z));
 renderer.render(scene,camera);
}
window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
save();
clearTimeout(failTimer);
loading.style.display='none';
animate();
}catch(e){
 clearTimeout(failTimer);
 loadText.textContent='Game error: '+e.message+'. Please refresh and send a screenshot.';
 console.error(e);
}
})();
</script>
</body>
</html>
