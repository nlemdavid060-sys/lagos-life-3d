
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lagos Life 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#111;font-family:Arial,sans-serif;color:white}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{
  background:rgba(10,15,22,.86);
  border:1px solid rgba(255,255,255,.2);
  border-radius:13px;padding:10px;
  backdrop-filter:blur(8px)
}
#top{position:absolute;top:12px;left:12px;display:flex;gap:8px;align-items:flex-start}
#money{font-weight:bold;color:#6cff91}
#location{font-size:12px;color:#ddd;margin-top:4px}
#phoneBtn{position:absolute;right:15px;top:15px;pointer-events:auto}
#phone{
 display:none;position:absolute;right:12px;top:65px;width:220px;
 pointer-events:auto
}
#phone h3{margin:4px 0 12px}
.app{
 width:100%;padding:11px;margin:5px 0;border:0;border-radius:9px;
 color:white;background:#26374b;text-align:left;font-size:14px
}
#message{
 position:absolute;top:90px;left:50%;transform:translateX(-50%);
 background:rgba(0,0,0,.7);padding:9px 14px;border-radius:20px;
 font-size:13px;display:none;white-space:nowrap
}
#controls{position:absolute;bottom:18px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:end}
#stick{
 width:125px;height:125px;border-radius:50%;
 background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.4);
 position:relative;pointer-events:auto;touch-action:none
}
#knob{
 width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.7);
 position:absolute;left:36px;top:36px
}
#actions{display:flex;flex-direction:column;gap:9px;align-items:end;pointer-events:auto}
.action{
 border:1px solid rgba(255,255,255,.4);background:rgba(10,20,30,.8);
 color:white;border-radius:50%;width:62px;height:62px;font-weight:bold;
 font-size:11px;touch-action:none
}
.action:active{background:#168c68}
#driveControls{display:none;gap:8px;pointer-events:auto}
.driveBtn{
 width:62px;height:62px;border-radius:50%;border:1px solid #fff8;
 background:#172b3ddd;color:white;font-weight:bold;touch-action:none
}
#help{
 position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
 font-size:10px;color:#ddd;text-align:center;white-space:nowrap
}
#overlay{
 display:none;position:absolute;inset:0;background:#0009;
 align-items:center;justify-content:center;pointer-events:auto
}
#box{width:min(330px,90vw);max-height:80vh;overflow:auto}
#box h2{margin-top:0}
.menuBtn{
 display:block;width:100%;padding:12px;margin:7px 0;border:0;
 border-radius:9px;background:#235b50;color:white;font-size:14px
}
#close{background:#663b3b}
@media(max-width:600px){
 #top{top:8px;left:8px}
 #stick{width:112px;height:112px}
 #knob{left:31px;top:31px}
 .action,.driveBtn{width:56px;height:56px}
}
</style>
</head>
<body>
<div id="hud">
 <div id="top">
  <div class="panel">
   <div>🌆 <b>LAGOS LIFE 3D</b></div>
   <div id="money">₦5,000,000</div>
   <div id="location">Lagos Island</div>
  </div>
 </div>

 <button id="phoneBtn" class="action">📱 PHONE</button>
 <div id="phone" class="panel">
  <h3>My Phone</h3>
  <button class="app" onclick="openApp('Map','Explore Lagos and discover new places.')">🗺️ Map</button>
  <button class="app" onclick="openApp('Bank','Your virtual bank balance is displayed at the top.')">🏦 Bank</button>
  <button class="app" onclick="openApp('Car Dealership','Visit the dealership to buy a car.')">🚘 Car Dealership</button>
  <button class="app" onclick="openApp('Properties','Explore houses and property opportunities.')">🏠 Properties</button>
  <button class="app" onclick="openApp('Investments','Invest virtual money in your city.')">📈 Investments</button>
  <button class="app" onclick="openApp('Airport','Travel to other Nigerian states in a future expansion.')">✈️ Airport</button>
 </div>

 <div id="message"></div>

 <div id="controls">
  <div id="stick"><div id="knob"></div></div>
  <div id="actions">
   <button id="enterBtn" class="action">ENTER<br>CAR</button>
   <button id="jumpBtn" class="action">JUMP</button>
   <div id="driveControls">
    <button id="brakeBtn" class="driveBtn">BRAKE</button>
    <button id="gasBtn" class="driveBtn">GAS</button>
   </div>
  </div>
 </div>
 <div id="help">Move: joystick · Enter/exit car: E · Jump: Space · Drive: joystick + GAS</div>

 <div id="overlay">
  <div id="box" class="panel">
   <h2 id="boxTitle">Lagos Life</h2>
   <div id="boxText">Welcome to Lagos.</div>
   <button id="boxAction" class="menuBtn">OK</button>
   <button id="close" class="menuBtn">CLOSE</button>
  </div>
 </div>
</div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
 }
}
</script>

<script type="module">
import * as THREE from "three";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x91b8d2);
scene.fog = new THREE.Fog(0x91b8d2,90,320);

const camera = new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,700);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xdcecff,0x5d604d,2));

const sun=new THREE.DirectionalLight(0xfff0d5,3);
sun.position.set(-70,120,60);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-150;
sun.shadow.camera.right=150;
sun.shadow.camera.top=150;
sun.shadow.camera.bottom=-150;
scene.add(sun);

const mat=(color,roughness=.85)=>new THREE.MeshStandardMaterial({color,roughness});
const groundMat=mat(0x77796c);
const roadMat=mat(0x292d32);
const concrete=mat(0x999b98);
const white=mat(0xffffff);
const glass=new THREE.MeshStandardMaterial({
 color:0x5e899c,metalness:.35,roughness:.25
});

function cube(parent,x,y,z,w,h,d,material){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;
 parent.add(m);return m;
}

const ground=new THREE.Mesh(new THREE.PlaneGeometry(700,700),groundMat);
ground.rotation.x=-Math.PI/2;ground.position.y=-.12;
ground.receiveShadow=true;scene.add(ground);

// Main roads
function road(x,z,w,d){
 cube(scene,x,.015,z,w,.08,d,roadMat);
}
road(0,0,18,500);
road(0,0,500,18);
road(65,0,12,500);
road(-70,0,12,500);
road(0,70,500,12);
road(0,-75,500,12);

// Road lane markings
for(let z=-230;z<240;z+=15){
 cube(scene,0,.07,z,.25,.025,6,white);
 cube(scene,65,.07,z,.25,.025,6,white);
 cube(scene,-70,.07,z,.25,.025,6,white);
}
for(let x=-230;x<240;x+=15){
 cube(scene,x,.07,0,6,.025,.25,white);
 cube(scene,x,.07,70,6,.025,.25,white);
 cube(scene,x,.07,-75,6,.025,.25,white);
}

// Sidewalks
for(const x of [-12,12,53,77,-82,-58]){
 cube(scene,x,.12,0,3,.25,500,concrete);
}
for(const z of [-12,12,58,82,-87,-63]){
 cube(scene,0,.12,z,500,.25,3,concrete);
}

// City buildings
const buildingColors=[0xaaa69b,0xb8b6aa,0x8b9ba1,0xc2b7a2,0x777e84,0xd1c7b3];
const buildings=[];
function makeBuilding(x,z,w,h,d,color){
 const group=new THREE.Group();
 const body=cube(group,0,h/2,0,w,h,d,mat(color));
 body.castShadow=true;
 // rows of windows
 const floors=Math.floor(h/3.5);
 const cols=Math.max(2,Math.floor(w/3));
 for(let f=0;f<floors;f++){
  for(let c=0;c<cols;c++){
   const wx=-w/2+1.3+c*((w-2.6)/Math.max(1,cols-1));
   cube(group,wx,2+f*3.5,d/2+.025,.9,1.5,.07,glass);
   cube(group,wx,2+f*3.5,-d/2-.025,.9,1.5,.07,glass);
  }
 }
 // rooftop
 cube(group,0,h+.35,0,w*.25,.7,d*.25,mat(0x777a7b));
 group.position.set(x,0,z);scene.add(group);buildings.push(group);
}
for(let x=-220;x<=220;x+=35){
 for(let z=-220;z<=220;z+=35){
  if(Math.abs(x)<30||Math.abs(z)<30||Math.abs(x-65)<25||Math.abs(x+70)<25)continue;
  const h=12+Math.random()*45;
  makeBuilding(x+(Math.random()-.5)*8,z+(Math.random()-.5)*8,
   13+Math.random()*9,h,13+Math.random()*8,
   buildingColors[Math.floor(Math.random()*buildingColors.length)]);
 }
}

// A few tall Lagos-style towers
makeBuilding(38,38,22,85,22,0x9aaeb6);
makeBuilding(-42,40,20,65,20,0xc1b49f);
makeBuilding(100,-35,25,105,22,0x7e969f);
makeBuilding(-115,-110,24,75,24,0xb5a895);

// Trees
function tree(x,z){
 const trunk=cube(scene,x,2,z,.8,4,.8,mat(0x65452c));
 const crown=new THREE.Mesh(new THREE.SphereGeometry(3.2,9,8),mat(0x28633b));
 crown.position.set(x,5,z);crown.castShadow=true;scene.add(crown);
}
for(let x=-220;x<220;x+=22){
 for(const z of [-19,19,48,90]){
  if(Math.abs(x)<30)continue;
  tree(x,z);
 }
}

// Player character
const player=new THREE.Group();
scene.add(player);
const skin=mat(0x8c5739);
const shirt=mat(0x2463a3);
const trousers=mat(0x242c3c);
const shoes=mat(0x171717);

const torso=cube(player,0,1.35,0,.72,.9,.4,shirt);
const head=new THREE.Mesh(new THREE.SphereGeometry(.24,16,12),skin);
head.position.y=2.05;head.castShadow=true;player.add(head);
const legs=[];
const arms=[];
function limb(x,y,z,length,radius,material){
 const m=new THREE.Mesh(new THREE.CylinderGeometry(radius,radius,length,10),material);
 m.position.set(x,y,z);m.castShadow=true;player.add(m);return m;
}
for(const side of [-1,1]){
 const leg=limb(side*.2,.48,0,.85,.13,trousers);legs.push(leg);
 const arm=limb(side*.48,1.35,0,.72,.095,skin);arms.push(arm);
 cube(player,side*.2,.08,.04,.3,.16,.45,shoes);
}
player.position.set(3,0,4);

const playerState={speed:0,angle:0,jump:0,walking:false};

// Vehicle builder
function makeCar(color,x,z,scale=1){
 const car=new THREE.Group();
 const paint=new THREE.MeshStandardMaterial({color,metalness:.55,roughness:.28});
 cube(car,0,.75,0,2.2,.7,4.3,paint);
 cube(car,0,1.3,-.15,1.8,.75,2.2,glass);
 // hood
 cube(car,0,1.02,1.35,2,.25,1.3,paint);
 const wheels=[];
 for(const sx of [-1,1]){
  for(const sz of [-1,1]){
   const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.25,16),mat(0x151515));
   wheel.rotation.z=Math.PI/2;
   wheel.position.set(sx*1.08,.43,sz*1.35);
   wheel.castShadow=true;car.add(wheel);wheels.push(wheel);
  }
 }
 car.position.set(x,0,z);
 car.scale.setScalar(scale);
 scene.add(car);
 return {group:car,wheels,speed:0,angle:0,color};
}

const cars=[
 makeCar(0x143e9a,7,10),
 makeCar(0xd41f25,20,5),
 makeCar(0x111111,-25,12),
 makeCar(0xd9d9d9,30,-12),
 makeCar(0x17834a,-18,-16)
];
let activeCar=null;
let money=5000000;

function updateMoney(){
 document.getElementById("money").textContent="₦"+money.toLocaleString("en-NG");
}
function message(txt){
 const el=document.getElementById("message");
 el.textContent=txt;el.style.display="block";
 clearTimeout(message.timer);
 message.timer=setTimeout(()=>el.style.display="none",2500);
}

// Input and joystick
const stick=document.getElementById("stick");
const knob=document.getElementById("knob");
const input={x:0,y:0,gas:false,brake:false};
let stickPointer=null;

function setStick(e){
 const r=stick.getBoundingClientRect();
 const cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy;
 const max=42,len=Math.hypot(dx,dy);
 if(len>max){dx=dx/len*max;dy=dy/len*max}
 knob.style.transform=`translate(${dx}px,${dy}px)`;
 input.x=dx/max;
 input.y=dy/max;
}
stick.addEventListener("pointerdown",e=>{
 stickPointer=e.pointerId;stick.setPointerCapture(e.pointerId);setStick(e);
});
stick.addEventListener("pointermove",e=>{
 if(e.pointerId===stickPointer)setStick(e);
});
function resetStick(){
 stickPointer=null;input.x=0;input.y=0;knob.style.transform="translate(0px,0px)";
}
stick.addEventListener("pointerup",resetStick);
stick.addEventListener("pointercancel",resetStick);

function holdButton(id,key){
 const el=document.getElementById(id);
 el.addEventListener("pointerdown",e=>{e.preventDefault();input[key]=true});
 ["pointerup","pointercancel","pointerleave"].forEach(ev=>
  el.addEventListener(ev,()=>input[key]=false));
}
holdButton("gasBtn","gas");
holdButton("brakeBtn","brake");

const keys={};
addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.key.toLowerCase()==="e")toggleCar();
 if(e.code==="Space")jump();
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

function jump(){
 if(activeCar)return;
 if(playerState.jump===0){playerState.jump=1.1}
}
document.getElementById("jumpBtn").onclick=jump;
document.getElementById("enterBtn").onclick=toggleCar;

// Enter and exit nearest car
function toggleCar(){
 if(activeCar){
  player.position.copy(activeCar.group.position);
  player.position.x+=3;
  player.rotation.y=activeCar.angle;
  activeCar=null;
  setDrivingUI(false);
  message("You left the car.");
  return;
 }
 let nearest=null,dist=8;
 for(const c of cars){
  const d=player.position.distanceTo(c.group.position);
  if(d<dist){dist=d;nearest=c}
 }
 if(nearest){
  activeCar=nearest;
  player.visible=false;
  setDrivingUI(true);
  message("You entered the car. Drive!");
 }else{
  message("Move closer to a car first.");
 }
}
function setDrivingUI(driving){
 document.getElementById("driveControls").style.display=driving?"flex":"none";
 document.getElementById("enterBtn").innerHTML=driving?"EXIT<br>CAR":"ENTER<br>CAR";
}
 
// Phone and app panels
document.getElementById("phoneBtn").onclick=()=>{
 const p=document.getElementById("phone");
 p.style.display=p.style.display==="block"?"none":"block";
};
function openApp(name,description){
 showPanel(name,description,()=>{
  if(name==="Car Dealership")dealership();
  else if(name==="Properties")properties();
  else if(name==="Investments")investments();
  else if(name==="Airport")airport();
  else showPanel(name,description,()=>{});
 });
}
function showPanel(title,description,action){
 document.getElementById("overlay").style.display="flex";
 document.getElementById("boxTitle").textContent=title;
 document.getElementById("boxText").textContent=description;
 document.getElementById("boxAction").onclick=action;
}
function closePanel(){document.getElementById("overlay").style.display="none"}
document.getElementById("close").onclick=closePanel;
document.getElementById("boxAction").onclick=closePanel;

function dealership(){
 showPanel("Car Dealership","Choose a car to buy. These are virtual game prices.",()=>{
  const options=[
   ["Sports Coupe",0x11aaff,1500000],
   ["Luxury Sports Car",0xd5b22e,3000000],
   ["Supercar",0xcc2222,4500000]
  ];
  const [name,color,price]=options[0];
  if(money<price){message("Not enough money!");return}
  money-=price;updateMoney();
  const c=makeCar(color,player.position.x+5,player.position.z+5);
  cars.push(c);message(name+" purchased!");
 });
 document.getElementById("boxText").textContent=
 "Press BUY to purchase a sports car for ₦1,500,000. Your new car will appear beside you.";
 document.getElementById("boxAction").textContent="BUY SPORTS CAR";
}
function properties(){
 showPanel("Properties","Buy a virtual house for ₦2,000,000.",()=>{
  if(money<2000000){message("Not enough money!");return}
  money-=2000000;updateMoney();
  makeBuilding(player.position.x+15,player.position.z+12,12,8,12,0xd1b58e);
  message("House purchased!");
 });
 document.getElementById("boxAction").textContent="BUY HOUSE";
}
function investments(){
 showPanel("Investments","Invest ₦500,000 in your virtual business. The game adds a virtual return.",()=>{
  if(money<500000){message("Not enough money!");return}
  money-=500000;money+=650000;updateMoney();
  message("Your virtual investment earned ₦150,000!");
 });
 document.getElementById("boxAction").textContent="INVEST ₦500,000";
}
function airport(){
 showPanel("Lagos Airport","Airport travel is planned for the next expansion. This prototype currently has one playable city area.",()=>{});
 document.getElementById("boxAction").textContent="OK";
}

// Camera
const cameraTarget=new THREE.Vector3();
const desiredCamera=new THREE.Vector3();
let clock=new THREE.Clock();

function updatePlayer(dt){
 if(activeCar)return;
 let forward=-input.y;
 let side=input.x;
 if(keys.w||keys.arrowup)forward=1;
 if(keys.s||keys.arrowdown)forward=-1;
 if(keys.a||keys.arrowleft)side=-1;
 if(keys.d||keys.arrowright)side=1;

 const moving=Math.abs(forward)+Math.abs(side)>.08;
 playerState.walking=moving;
 if(moving){
  const camForward=new THREE.Vector3();
  camera.getWorldDirection(camForward);
  camForward.y=0;camForward.normalize();
  const right=new THREE.Vector3().crossVectors(camForward,new THREE.Vector3(0,1,0)).normalize();
  const direction=camForward.multiplyScalar(forward).add(right.multiplyScalar(side)).normalize();
  player.position.addScaledVector(direction,5.5*dt);
  player.rotation.y=Math.atan2(direction.x,direction.z);
 }
 if(playerState.jump>0){
  player.position.y=Math.sin((1.1-playerState.jump)/1.1*Math.PI)*1.6;
  playerState.jump-=dt*2;
  if(playerState.jump<=0){playerState.jump=0;player.position.y=0}
 }
 const t=clock.elapsedTime*10;
 legs[0].rotation.x=moving?Math.sin(t)*.65:0;
 legs[1].rotation.x=moving?-Math.sin(t)*.65:0;
 arms[0].rotation.x=moving?-Math.sin(t)*.45:0;
 arms[1].rotation.x=moving?Math.sin(t)*.45:0;
}

function updateCar(dt){
 if(!activeCar)return;
 const car=activeCar;
 const steer=input.x+(keys.a?-1:0)+(keys.d?1:0);
 const gas=input.gas||keys.w||keys.arrowup;
 const brake=input.brake||keys.s||keys.arrowdown;
 if(gas)car.speed=Math.min(car.speed+12*dt,24);
 else car.speed*=Math.pow(.94,dt*60);
 if(brake)car.speed=Math.max(car.speed-22*dt,-7);
 car.angle-=steer*car.speed*.035*dt;
 car.group.rotation.y=car.angle;
 const direction=new THREE.Vector3(Math.sin(car.angle),0,Math.cos(car.angle));
 car.group.position.addScaledVector(direction,car.speed*dt);
 car.wheels.forEach(w=>w.rotation.x+=car.speed*dt*1.5);
}

// Camera follows player or car
function updateCamera(dt){
 const target=activeCar?activeCar.group.position:player.position;
 const angle=activeCar?activeCar.angle:player.rotation.y;
 const distance=activeCar?10:8;
 const height=activeCar?5.3:4.5;
 desiredCamera.set(
  target.x-Math.sin(angle)*distance,
  target.y+height,
  target.z-Math.cos(angle)*distance
 );
 camera.position.lerp(desiredCamera,1-Math.pow(.001,dt));
 cameraTarget.set(target.x,target.y+1.3,target.z);
 camera.lookAt(cameraTarget);
}

// Basic boundaries
function keepInCity(){
 const obj=activeCar?activeCar.group:player;
 obj.position.x=THREE.MathUtils.clamp(obj.position.x,-245,245);
 obj.position.z=THREE.MathUtils.clamp(obj.position.z,-245,245);
}

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 updatePlayer(dt);
 updateCar(dt);
 keepInCity();
 updateCamera(dt);
 renderer.render(scene,camera);
}
camera.position.set(0,7,14);
camera.lookAt(0,1,0);
animate();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
updateMoney();
message("Welcome to Lagos Life! Walk around and find a car.");
</script>
</body>
</html>
