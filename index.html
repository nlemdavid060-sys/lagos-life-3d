
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lagos Life 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#111;font-family:Arial;color:white}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{background:#101923dd;border:1px solid #ffffff44;border-radius:12px;padding:10px}
#stats{position:absolute;top:10px;left:10px;font-size:13px;line-height:1.7}
#message{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#101923dd;padding:9px 14px;border-radius:12px;text-align:center;font-size:13px}
#buttons{position:absolute;right:12px;bottom:18px;display:flex;flex-direction:column;gap:9px;pointer-events:auto}
button{border:0;border-radius:10px;background:#1676d2;color:white;padding:12px;font-weight:bold;font-size:13px;cursor:pointer;touch-action:none}
button:active{background:#07529b}
#joystick{position:absolute;left:20px;bottom:25px;width:115px;height:115px;border-radius:50%;background:#ffffff30;border:2px solid #ffffff80;pointer-events:auto;touch-action:none}
#stick{position:absolute;width:48px;height:48px;border-radius:50%;background:#ffffffbb;left:32px;top:32px}
#menu{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(330px,90vw);max-height:75vh;overflow:auto;display:none;pointer-events:auto}
#menu button{display:block;width:100%;margin:7px 0}
#close{background:#a83232}
#help{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:10px;color:#ddd;text-align:center;white-space:nowrap}
</style>
</head>
<body>
<div id="hud">
  <div id="stats" class="panel">
    <b>🏙️ LAGOS LIFE 3D</b><br>
    💵 Money: ₦<span id="money">5000000</span><br>
    🚗 Vehicle: <span id="vehicle">On foot</span><br>
    📍 Location: <span id="location">Lagos</span>
  </div>
  <div id="message">Welcome to Lagos Life!</div>
  <div id="joystick"><div id="stick"></div></div>
  <div id="buttons">
    <button id="action">ENTER CAR</button>
    <button id="phone">📱 PHONE</button>
    <button id="jump">JUMP</button>
  </div>
  <div id="menu" class="panel"></div>
  <div id="help">Use joystick or WASD to move • Action to enter/exit cars</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.128.0/three.min.js"></script>
<script>
(() => {
"use strict";

const message = document.getElementById("message");
const menu = document.getElementById("menu");

if (!window.THREE) {
  message.textContent = "3D engine could not load. Check your internet and reopen this game.";
  return;
}

let money = 5000000;
let driving = false;
let activeCar = null;
let currentState = "Lagos";
let joyX = 0, joyY = 0;
let keys = {};
let playerSpeed = 0;
let gameTime = 0;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87c9ef);
scene.fog = new THREE.Fog(0x87c9ef, 65, 190);

const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 400);
const renderer = new THREE.WebGLRenderer({antialias:false, powerPreference:"low-power"});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled = false;
document.body.insertBefore(renderer.domElement, document.getElementById("hud"));

scene.add(new THREE.HemisphereLight(0xffffff,0x64705a,2));
const sun = new THREE.DirectionalLight(0xffffff,1.5);
sun.position.set(30,60,20);
scene.add(sun);

const mat = color => new THREE.MeshStandardMaterial({color});
const groundMat = mat(0x39844c);
const roadMat = mat(0x30343b);
const whiteMat = mat(0xffffff);
const darkMat = mat(0x151b24);

function cube(w,h,d,material,x,y,z,parent=scene) {
  const obj = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
  obj.position.set(x,y,z);
  parent.add(obj);
  return obj;
}

// Ground and city roads
cube(240,0.5,240,groundMat,0,-0.3,0);

for(let i=-5;i<=5;i++){
  cube(8,0.08,230,roadMat,i*20,0,0);
  cube(230,0.08,8,roadMat,0,0,i*20);
  for(let j=-5;j<=5;j++){
    cube(0.18,0.02,2,whiteMat,i*20,0.06,j*20+5);
    cube(2,0.02,0.18,whiteMat,j*20+5,0.06,i*20);
  }
}

// Buildings
const buildingColors=[0xd4c2a4,0xb8c6d1,0xd5d5d5,0xd6a77b,0x9eafbd,0xc4b3a0];
for(let x=-100;x<=100;x+=20){
  for(let z=-100;z<=100;z+=20){
    if(Math.abs(x)<12 || Math.abs(z)<12) continue;
    const h=8+Math.random()*22;
    const w=7+Math.random()*4;
    const d=7+Math.random()*4;
    const building=cube(w,h,d,mat(buildingColors[Math.floor(Math.random()*buildingColors.length)]),x,h/2,z);
    building.userData.building=true;
  }
}

// Player
const player=new THREE.Group();
const skin=mat(0x8b542e), shirt=mat(0x1767c2), trousers=mat(0x202b42);
const body=cube(0.8,1.2,0.45,shirt,0,1.3,0,player);
const head=new THREE.Mesh(new THREE.SphereGeometry(0.34,12,10),skin);
head.position.y=2.15; player.add(head);
const leg1=cube(0.27,0.8,0.3,trousers,-0.22,0.4,0,player);
const leg2=cube(0.27,0.8,0.3,trousers,0.22,0.4,0,player);
const arm1=cube(0.22,0.8,0.25,skin,-0.55,1.35,0,player);
const arm2=cube(0.22,0.8,0.25,skin,0.55,1.35,0,player);
player.position.set(0,0,0);
scene.add(player);

// Cars
const cars=[];
function makeCar(name,color,x,z,price){
  const car=new THREE.Group();
  const paint=mat(color);
  cube(2,0.65,4,paint,0,0.75,0,car);
  cube(1.65,0.65,1.8,mat(0x9cc9db),0,1.3,-0.2,car);
  for(const wx of [-1,1]){
    for(const wz of [-1.25,1.25]){
      const wheel=new THREE.Mesh(new THREE.CylinderGeometry(0.38,0.38,0.25,12),darkMat);
      wheel.rotation.z=Math.PI/2;
      wheel.position.set(wx,0.4,wz);
      car.add(wheel);
    }
  }
  car.position.set(x,0,z);
  scene.add(car);
  cars.push({name,car,price});
  return car;
}
makeCar("Lagos Taxi",0xe6c52d,5,5,0);
makeCar("Sports Coupe",0xe32636,12,5,1500000);
makeCar("Supercar",0x1478e8,18,5,4500000);
makeCar("Luxury SUV",0x111111,25,5,3000000);
makeCar("Green Racer",0x13a85a,32,5,2500000);

// Airport terminal and airplane
const airport=cube(22,6,13,mat(0xd8e0e5),75,3,-75);
const runway=cube(16,0.15,65,roadMat,75,0,-105);
const plane=new THREE.Group();
cube(3,1,12,whiteMat,0,0,0,plane);
const wing=cube(15,0.25,2,whiteMat,0,0,0,plane);
const tail=cube(4,0.2,2,whiteMat,0,1,4,plane);
plane.position.set(75,5,-85);
scene.add(plane);

// Camera
camera.position.set(0,6,10);
function updateCamera(target,angle){
  const distance=driving?10:8;
  const height=driving?5:5;
  const behind=new THREE.Vector3(
    Math.sin(angle)*distance,
    height,
    Math.cos(angle)*distance
  );
  camera.position.lerp(target.clone().add(behind),0.12);
  camera.lookAt(target.x,target.y+1.2,target.z);
}

function say(text){
  message.textContent=text;
  clearTimeout(say.timer);
  say.timer=setTimeout(()=>message.textContent="Lagos Life 3D",2500);
}
function updateMoney(){
  document.getElementById("money").textContent=money.toLocaleString();
}
function nearestCar(){
  let nearest=null,dist=5;
  for(const item of cars){
    const d=player.position.distanceTo(item.car.position);
    if(d<dist){dist=d;nearest=item;}
  }
  return nearest;
}

function enterExit(){
  if(!driving){
    const item=nearestCar();
    if(!item){say("Walk closer to a car first!");return;}
    activeCar=item;
    driving=true;
    player.visible=false;
    say("Driving: "+item.name);
  }else{
    player.visible=true;
    player.position.copy(activeCar.car.position);
    player.position.x+=3;
    driving=false;
    activeCar=null;
    say("You left the car");
  }
}
document.getElementById("action").onclick=enterExit;

function openMenu(title,items){
  menu.innerHTML="<h3>"+title+"</h3>";
  items.forEach(item=>{
    const b=document.createElement("button");
    b.textContent=item.label;
    b.onclick=()=>{item.run();};
    menu.appendChild(b);
  });
  const close=document.createElement("button");
  close.id="close";close.textContent="CLOSE";
  close.onclick=()=>menu.style.display="none";
  menu.appendChild(close);
  menu.style.display="block";
}

document.getElementById("phone").onclick=()=>{
  openMenu("📱 MY PHONE",[
    {label:"🚗 Car Dealership",run:dealership},
    {label:"🏠 Buy a House",run:houses},
    {label:"📈 Investments",run:investments},
    {label:"✈️ Airport / Travel",run:travel},
    {label:"💼 My Wallet",run:()=>say("Wallet: ₦"+money.toLocaleString())}
  ]);
};

function dealership(){
  openMenu("🚗 SPORTS CAR DEALERSHIP",cars.filter(c=>c.price>0).map(item=>({
    label:item.name+" — ₦"+item.price.toLocaleString(),
    run:()=>{
      if(money<item.price){say("Not enough money!");return;}
      money-=item.price;updateMoney();
      say("You bought the "+item.name+"!");
      item.car.position.set(player.position.x+4,0,player.position.z);
      menu.style.display="none";
    }
  })));
}
function houses(){
  openMenu("🏠 PROPERTY MARKET",[
    {label:"Buy Lagos Apartment — ₦2,000,000",run:()=>{
      if(money>=2000000){money-=2000000;updateMoney();say("Apartment purchased!");}
      else say("Not enough money!");
    }},
    {label:"Buy Luxury House — ₦4,000,000",run:()=>{
      if(money>=4000000){money-=4000000;updateMoney();say("Luxury house purchased!");}
      else say("Not enough money!");
    }},
    {label:"Collect rent — ₦50,000",run:()=>{money+=50000;updateMoney();say("You collected virtual rent!");}}
  ]);
}
function investments(){
  openMenu("📈 INVESTMENTS",[
    {label:"Invest ₦100,000",run:()=>{
      if(money>=100000){money-=100000;money+=125000;updateMoney();say("Virtual investment returned ₦125,000!");}
      else say("Not enough money!");
    }},
    {label:"Invest ₦500,000",run:()=>{
      if(money>=500000){money-=500000;money+=600000;updateMoney();say("Virtual investment returned ₦600,000!");}
      else say("Not enough money!");
    }}
  ]);
}
function travel(){
  const states=["Lagos","Ogun","Oyo","Abuja","Rivers","Kano","Delta","Enugu"];
  openMenu("✈️ NIGERIA AIRPORT",states.map(state=>({
    label:"Travel to "+state,
    run:()=>{
      currentState=state;
      document.getElementById("location").textContent=state;
      player.position.set(75,0,-75);
      if(driving){driving=false;player.visible=true;activeCar=null;}
      menu.style.display="none";
      say("Welcome to "+state+"! Flight completed.");
    }
  })));
}

// Joystick
const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");
let joyActive=false;
function moveStick(e){
  const r=joystick.getBoundingClientRect();
  const cx=r.left+r.width/2,cy=r.top+r.height/2;
  let dx=e.clientX-cx,dy=e.clientY-cy;
  const max=35,len=Math.hypot(dx,dy);
  if(len>max){dx=dx/len*max;dy=dy/len*max;}
  stick.style.left=(32+dx)+"px";
  stick.style.top=(32+dy)+"px";
  joyX=dx/max;joyY=dy/max;
}
joystick.addEventListener("pointerdown",e=>{
  joyActive=true;joystick.setPointerCapture(e.pointerId);moveStick(e);
});
joystick.addEventListener("pointermove",e=>{if(joyActive)moveStick(e);});
function releaseStick(){
  joyActive=false;joyX=0;joyY=0;
  stick.style.left="32px";stick.style.top="32px";
}
joystick.addEventListener("pointerup",releaseStick);
joystick.addEventListener("pointercancel",releaseStick);

// Keyboard
window.addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()]=true;
  if(e.key.toLowerCase()==="e")enterExit();
  if(e.key.toLowerCase()==="p")document.getElementById("phone").click();
});
window.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
document.getElementById("jump").onclick=()=>say("Jump!");

let walkPhase=0;
function animate(){
  requestAnimationFrame(animate);
  const dt=0.016;
  gameTime+=dt;

  let forward=-joyY;
  let sideways=joyX;
  if(keys.w||keys.arrowup)forward=1;
  if(keys.s||keys.arrowdown)forward=-1;
  if(keys.a||keys.arrowleft)sideways=-1;
  if(keys.d||keys.arrowright)sideways=1;

  if(driving && activeCar){
    const car=activeCar.car;
    const turn=sideways*0.035;
    car.rotation.y+=turn;
    const speed=forward*0.25;
    car.position.x-=Math.sin(car.rotation.y)*speed;
    car.position.z-=Math.cos(car.rotation.y)*speed;
    updateCamera(car.position,car.rotation.y);
    document.getElementById("vehicle").textContent=activeCar.name;
  }else{
    const moving=Math.abs(forward)+Math.abs(sideways)>0.05;
    if(moving){
      player.rotation.y=Math.atan2(-sideways,-forward);
      player.position.x-=Math.sin(player.rotation.y)*0.12;
      player.position.z-=Math.cos(player.rotation.y)*0.12;
      walkPhase+=0.18;
      leg1.rotation.x=Math.sin(walkPhase)*0.55;
      leg2.rotation.x=-Math.sin(walkPhase)*0.55;
      arm1.rotation.x=-Math.sin(walkPhase)*0.4;
      arm2.rotation.x=Math.sin(walkPhase)*0.4;
    }else{
      leg1.rotation.x=0;leg2.rotation.x=0;
      arm1.rotation.x=0;arm2.rotation.x=0;
    }
    updateCamera(player.position,player.rotation.y);
    document.getElementById("vehicle").textContent="On foot";
  }
  plane.position.x=75+Math.sin(gameTime*0.25)*2;
  renderer.render(scene,camera);
}

window.addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
updateMoney();
say("Welcome! Explore Lagos and build your life.");
animate();
})();
</script>
</body>
</html>
