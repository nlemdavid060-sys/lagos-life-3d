
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lagos Life 3D V5</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial}
header{background:#101f32;padding:14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
button{background:#1679e9;color:white;border:0;padding:11px;border-radius:9px;margin:3px;font-weight:bold}
button:active{transform:scale(.96)}
#city{height:340px;position:relative;overflow:hidden;
background:linear-gradient(#68b9e9 0%,#c3e7f3 55%,#555 56%,#252d35 100%)}
.building{position:absolute;bottom:44%;width:65px;background:#344e6e;
border:2px solid #182b43;display:flex;flex-wrap:wrap;gap:5px;padding:6px}
.window{width:10px;height:12px;background:#f7d779}
.road{position:absolute;bottom:0;width:100%;height:45%;background:#292d32}
.road:after{content:"";position:absolute;top:50%;width:100%;border-top:5px dashed white}
#car{position:absolute;bottom:55px;left:35%;font-size:48px}
#player{position:absolute;bottom:52px;left:15%;font-size:35px}
#panel{padding:12px;background:#19283a;min-height:300px}
.card{background:#263c55;border-radius:12px;padding:12px;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
#phone{background:#080e19;border:5px solid #718096;border-radius:25px;
padding:15px;max-width:330px;margin:10px auto}
#apps{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.app{background:#253d5b;padding:17px 5px;border-radius:12px;text-align:center}
#message{color:#8debb1;padding:8px}
</style>
</head>
<body>
<header>
<strong>🌆 LAGOS LIFE 3D V5.0</strong>
<div>💰 ₦<span id="money">50000000</span></div>
<div>🏠 <span id="owned">0</span> Houses</div>
</header>

<div id="city">
<div class="road"></div>
<div id="buildings"></div>
<div id="player">🧍</div>
<div id="car">🚘</div>
</div>

<div id="panel">
<h3>🏙️ Your City</h3>
<div class="grid">
<button onclick="openPage('phone')">📱 Phone</button>
<button onclick="openPage('cars')">🚘 Car Dealership</button>
<button onclick="openPage('flights')">✈️ Airport</button>
<button onclick="openPage('states')">🗺️ Travel States</button>
<button onclick="openPage('houses')">🏠 Real Estate</button>
<button onclick="openPage('invest')">📈 Investment</button>
<button onclick="openPage('city')">🏙️ Expand City</button>
<button onclick="openPage('home')">🏡 Home</button>
</div>
<div id="message">Welcome to Lagos! Your new life starts here.</div>
</div>

<div id="content"></div>

<script>
let money=50000000;
let owned=0;
let cars=[];
let houses=[];
let rented=[];
let investments=[];
let currentState="Lagos";
let cityLevel=1;

const states=[
"Lagos","Abuja","Kano","Rivers","Ogun","Oyo",
"Enugu","Delta","Kaduna","Anambra","Edo",
"Imo","Akwa Ibom","Cross River","Osun",
"Ondo","Kwara","Plateau","Borno","Benue",
"Niger","Ekiti","Taraba","Adamawa","Bauchi",
"Gombe","Jigawa","Katsina","Kebbi","Sokoto",
"Yobe","Zamfara","Bayelsa","Ebonyi","Nasarawa",
"Abia","Kogi"
];

const carList=[
["Bugatti Chiron","🏎️",15000000],
["Lamborghini Aventador","🏎️",12000000],
["Ferrari SF90","🏎️",11000000],
["Rolls Royce","🚘",9000000],
["Mercedes AMG","🚗",7000000],
["Range Rover","🚙",6500000],
["Porsche 911","🏎️",8000000],
["McLaren 720S","🏎️",13000000],
["Bentley Continental","🚘",8500000],
["BMW M5","🚗",5500000]
];

function update(){
document.getElementById("money").textContent=money.toLocaleString();
document.getElementById("owned").textContent=owned;
}

function notify(msg){
document.getElementById("message").textContent=msg;
}

function spend(amount){
if(money<amount){notify("Not enough game money!");return false}
money-=amount;update();return true;
}

function openPage(page){
let html="";
const el=document.getElementById("content");

if(page==="phone"){
html=`<div id="phone">
<h2>📱 Davey's Phone</h2>
<p>9:41 AM | Lagos Network</p>
<div id="apps">
${["🏦 Bank","💬 Messages","📍 Maps","📷 Camera","✈️ Flights","🚘 Cars","🏠 Homes","📈 Stocks","🎵 Music"].map((a,i)=>`<div class="app" onclick="phoneApp(${i})">${a}</div>`).join("")}
</div><div id="phoneResult"></div></div>`;
}
if(page==="cars"){
html="<h2>🚘 Car Dealership</h2><div class='grid'>";
carList.forEach((c,i)=>{
html+=`<div class="card"><h3>${c[1]} ${c[0]}</h3><p>₦${c[2].toLocaleString()}</p><button onclick="buyCar(${i})">Buy Car</button></div>`;
});
html+="</div>";
}
if(page==="flights"||page==="states"){
html="<h2>✈️ Lagos International Airport</h2><p>Choose your destination</p>";
states.forEach((s,i)=>{
html+=`<div class="card">✈️ Lagos → ${s}<br><button onclick="travel('${s}')">Book Flight ₦${(50000+i*1000).toLocaleString()}</button></div>`;
});
}
if(page==="houses"){
html=`<h2>🏠 Real Estate Agency</h2>
<div class="card">🏡 Small House - ₦5,000,000 <button onclick="buyHouse('Small House',5000000)">Buy</button></div>
<div class="card">🏠 Luxury House - ₦15,000,000 <button onclick="buyHouse('Luxury House',15000000)">Buy</button></div>
<div class="card">🏰 Mansion - ₦30,000,000 <button onclick="buyHouse('Mansion',30000000)">Buy</button></div>
<h3>Your Properties</h3><div id="properties">${houses.map((h,i)=>`<div class="card">${h.name} <button onclick="rentHouse(${i})">Rent for ₦${h.rent.toLocaleString()}</button></div>`).join("")}</div>`;
}
if(page==="invest"){
html=`<h2>📈 Investment Centre</h2>
<div class="card">🏢 Shopping Mall Investment<br>₦2,000,000 <button onclick="invest('Shopping Mall',2000000,250000)">Invest</button></div>
<div class="card">🏨 Hotel Investment<br>₦5,000,000 <button onclick="invest('Hotel',5000000,700000)">Invest</button></div>
<div class="card">🏭 Factory Investment<br>₦3,000,000 <button onclick="invest('Factory',3000000,400000)">Invest</button></div>
<h3>Your Investments</h3><div>${investments.map(x=>`<div class="card">${x.name} - Income ₦${x.income.toLocaleString()} per collection <button onclick="collect(${investments.indexOf(x)})">Collect</button></div>`).join("")}</div>`;
}
if(page==="city"){
html=`<h2>🏙️ Build a Mega City</h2><p>City Level: ${cityLevel}</p>
<div class="card">🏢 Build Skyscraper - ₦2,000,000 <button onclick="build(2000000)">Build</button></div>
<div class="card">🛍️ Shopping Mall - ₦3,000,000 <button onclick="build(3000000)">Build</button></div>
<div class="card">🏨 New Hotel - ₦4,000,000 <button onclick="build(4000000)">Build</button></div>
<div class="card">🛣️ Expand Roads - ₦1,000,000 <button onclick="build(1000000)">Build</button></div>`;
}
if(page==="home"){
html=`<h2>🏡 Your Life</h2><div class="card">📍 Current Location: ${currentState}</div>
<div class="card">🚘 Cars Owned: ${cars.length}</div>
<div class="card">🏠 Houses Owned: ${owned}</div>
<div class="card">🏙️ City Level: ${cityLevel}</div>
<button onclick="openPage('phone')">Open Phone</button>`;
}
el.innerHTML=html;
el.scrollIntoView({behavior:"smooth"});
}

function phoneApp(i){
let result=document.getElementById("phoneResult");
let pages=[
"🏦 Bank: Your game balance is ₦"+money.toLocaleString(),
"💬 Messages: Welcome to Lagos Life!",
"📍 Maps: Current location: "+currentState,
"📷 Camera: City camera ready!",
"✈️ Flights: Visit the airport to book flights.",
"🚘 Cars: You own "+cars.length+" cars.",
"🏠 Homes: You own "+owned+" houses.",
"📈 Investments: "+investments.length+" active businesses.",
"🎵 Music: Music player ready!"
];
result.innerHTML="<div class='card'>"+pages[i]+"</div>";
}

function buyCar(i){
let c=carList[i];
if(spend(c[2])){
cars.push(c[0]);
document.getElementById("car").textContent=c[1];
notify("Congratulations! You bought "+c[0]);
}
}

function travel(s){
let price=50000+states.indexOf(s)*1000;
if(spend(price)){
currentState=s;
notify("Welcome to "+s+"! You have arrived by airplane ✈️");
document.getElementById("player").textContent="🧍";
}
}

function buyHouse(name,price){
if(spend(price)){
houses.push({name:name,rent:Math.floor(price*.02),rented:false});
owned++;update();notify("You bought a "+name+"!");
}
}

function rentHouse(i){
let h=houses[i];
if(h.rented){notify("This property is already rented.");return}
h.rented=true;
h.rentIncome=h.rent;
rented.push(h);
notify("Your house is now rented. Collect rent from Real Estate!");
openPage("houses");
}

function invest(name,price,income){
if(spend(price)){
investments.push({name,income});
notify("Investment successful: "+name);
openPage("invest");
}
}

function collect(i){
let x=investments[i];
money+=x.income;
update();
notify("You collected ₦"+x.income.toLocaleString()+" from "+x.name);
}

function build(price){
if(spend(price)){
cityLevel++;
addBuilding();
notify("Your city has expanded! City level "+cityLevel);
openPage("city");
}
}

function addBuilding(){
let b=document.createElement("div");
b.className="building";
let height=80+Math.random()*130;
b.style.height=height+"px";
b.style.left=(Math.random()*85)+"%";
for(let i=0;i<12;i++){
let w=document.createElement("div");
w.className="window";b.appendChild(w);
}
document.getElementById("buildings").appendChild(b);
}

for(let i=0;i<9;i++)addBuilding();
update();
openPage("home");
</script>
</body>
</html>
