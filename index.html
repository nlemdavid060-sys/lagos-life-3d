
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LAGOS LIFE 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial;color:white}
#game{position:fixed;inset:0}
#hud{position:absolute;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;pointer-events:none}
.panel{background:#111c;padding:12px 16px;border-radius:12px;font-weight:bold}
#controls{position:absolute;bottom:25px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:end}
#stick{width:115px;height:115px;border-radius:50%;background:#ffffff55;border:2px solid white;position:relative;touch-action:none}
#knob{width:45px;height:45px;background:#fff;border-radius:50%;position:absolute;left:33px;top:33px}
#run{width:75px;height:75px;border-radius:50%;background:#e6a900;border:3px solid white;color:#111;font-weight:bold;touch-action:none}
#message{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#111d;padding:18px;border-radius:15px;text-align:center}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
 <div class="panel">🏙️ LAGOS LIFE</div>
 <div class="panel">🌞 DAYTIME</div>
</div>
<div id="message">WELCOME TO LAGOS LIFE 3D<br><small>Explore your city!</small></div>
<div id="controls">
 <div id="stick"><div id="knob"></div></div>
 <button id="run">RUN</button>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,70,220);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
document.getElementById('game').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x667755,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(30,60,20);
scene.add(sun);

function box(x,y,z,w,h,d,color){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({color})
 );
 mesh.position.set(x,y,z);
 scene.add(mesh);
 return mesh;
}

// Ground
box(0,-0.6,0,220,1,220,0x529b49);

// Roads
box(0,-0.05,0,18,0.1,220,0x333333);
box(0,-0.04,0,220,0.1,18,0x333333);

// Road markings
for(let i=-100;i<100;i+=12){
 box(0,0.02,i,0.25,0.03,5,0xffffff);
 box(i,0.02,0,5,0.03,0.25,0xffffff);
}

// Lagos city buildings
const colors=[0xd7c3a3,0xe6e0d5,0xd9a35c,0xb5c5d4,0xeeeeee,0xc6a0a0];
for(let x=-90;x<=90;x+=17){
 for(let z=-90;z<=90;z+=17){
  if(Math.abs(x)<17||Math.abs(z)<17)continue;
  const h=8+Math.random()*25;
  const w=8+Math.random()*4;
  const b=box(x,h/2,z,w,h,w,colors[Math.floor(Math.random()*colors.length)]);
  // Windows
  for(let y=2;y<h-2;y+=3){
   for(let side=-1;side<=1;side+=2){
    const windowMesh=box(x+side*(w/2+0.02),y,z,0.12,1.2,w*0.55,0x7dc8e8);
   }
  }
  // Roof
  box(x,h+0.3,z,w+0.3,0.6,w+0.3,0x555555);
 }
}

// Palm trees
for(let i=0;i<30;i++){
 const x=(Math.random()-.5)*180;
 const z=(Math.random()-.5)*180;
 if(Math.abs(x)<13||Math.abs(z)<13)continue;
 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.25,.4,5,7),
  new THREE.MeshStandardMaterial({color:0x81502b})
 );
 trunk.position.set(x,2.5,z);scene.add(trunk);
 for(let j=0;j<6;j++){
  const leaf=new THREE.Mesh(
   new THREE.ConeGeometry(.6,4,5),
   new THREE.MeshStandardMaterial({color:0x16833d})
  );
  leaf.rotation.z=Math.PI/2;
  leaf.rotation.y=j*Math.PI/3;
  leaf.position.set(x,5,z);scene.add(leaf);
 }
}

// Player
const player=new THREE.Group();
const body=new THREE.Mesh(
 new THREE.CapsuleGeometry(.65,1.1,4,8),
 new THREE.MeshStandardMaterial({color:0x174de0})
);
body.position.y=1.3;player.add(body);
const head=new THREE.Mesh(
 new THREE.SphereGeometry(.4,16,16),
 new THREE.MeshStandardMaterial({color:0x9b623e})
);
head.position.y=2.35;player.add(head);
scene.add(player);
player.position.set(0,0,0);

// Touch controls
let moveX=0,moveY=0,running=false;
const stick=document.getElementById('stick');
const knob=document.getElementById('knob');

stick.addEventListener('pointerdown',e=>{
 stick.setPointerCapture(e.pointerId);
 moveStick(e);
});
stick.addEventListener('pointermove',e=>{
 if(stick.hasPointerCapture(e.pointerId))moveStick(e);
});
function moveStick(e){
 const r=stick.getBoundingClientRect();
 let x=e.clientX-r.left-r.width/2;
 let y=e.clientY-r.top-r.height/2;
 const length=Math.hypot(x,y);
 if(length>35){x=x/length*35;y=y/length*35}
 moveX=x/35;moveY=y/35;
 knob.style.left=(33+x)+'px';
 knob.style.top=(33+y)+'px';
}
function resetStick(){
 moveX=0;moveY=0;
 knob.style.left='33px';knob.style.top='33px';
}
stick.addEventListener('pointerup',resetStick);
stick.addEventListener('pointercancel',resetStick);

const runButton=document.getElementById('run');
runButton.addEventListener('pointerdown',e=>{e.preventDefault();running=true});
runButton.addEventListener('pointerup',()=>running=false);
runButton.addEventListener('pointercancel',()=>running=false);
runButton.addEventListener('pointerleave',()=>running=false);

// Keyboard controls
const keys={};
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

let angle=0;
const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);

 let x=moveX;
 let y=moveY;
 if(keys.w||keys.arrowup)y=-1;
 if(keys.s||keys.arrowdown)y=1;
 if(keys.a||keys.arrowleft)x=-1;
 if(keys.d||keys.arrowright)x=1;

 const moving=Math.hypot(x,y)>.1;
 if(moving){
  const speed=running||keys.shift?12:6;
  angle=Math.atan2(x,-y);
  player.rotation.y=angle;
  player.position.x+=Math.sin(angle)*speed*dt;
  player.position.z-=Math.cos(angle)*speed*dt;
 }
 player.position.x=THREE.MathUtils.clamp(player.position.x,-105,105);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-105,105);

 // Follow camera
 const target=new THREE.Vector3(
  player.position.x-Math.sin(angle)*9,
  7,
  player.position.z+Math.cos(angle)*9
 );
 camera.position.lerp(target,.09);
 camera.lookAt(player.position.x,1.5,player.position.z);

 renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

setTimeout(()=>document.getElementById('message').style.display='none',3500);
</script>
</body>
</html>
