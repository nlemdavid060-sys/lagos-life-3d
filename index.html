
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lagos Life</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#91cce8;color:white}
#game{position:fixed;inset:0}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:4;pointer-events:none}
.pill{background:#142c38ed;padding:10px 12px;border-radius:13px;font-size:13px;font-weight:bold}
#stats{display:flex;gap:6px}
#bottom{position:fixed;bottom:12px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:end;z-index:4}
.controls{display:grid;grid-template-columns:44px 44px 44px;grid-template-rows:44px 44px;gap:4px}
.ctrl{background:#142c38eF;color:white;border:0;border-radius:12px;font-size:22px;touch-action:none}
#up{grid-column:2}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}
.actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:end}
.action{border:0;border-radius:12px;padding:12px;background:#142c38ed;color:white;font-weight:bold}
#notice{position:fixed;top:65px;left:50%;transform:translateX(-50%);z-index:8;background:#142c38ed;padding:10px 15px;border-radius:12px;display:none;text-align:center}
.overlay{position:fixed;inset:0;background:#06131bdc;z-index:10;display:none;align-items:center;justify-content:center;padding:12px}
.panel{background:#f4f5f1;color:#172a31;border-radius:20px;width:min(520px,100%);max-height:88vh;overflow:auto;padding:16px}
.head{display:flex;justify-content:space-between;align-items:center}
.head h2{margin:5px 0 12px}
.close{border:0;border-radius:10px;padding:9px 13px;background:#253d47;color:white}
#items{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.item{background:white;border-radius:13px;padding:12px;border:1px solid #dce3df}
.item .emoji{font-size:30px}
.item button,.primary{width:100%;padding:10px;border:0;border-radius:9px;background:#168b60;color:white;font-weight:bold;margin-top:7px}
#phoneOverlay{background:#07121cdd}
.phone{width:min(350px,94vw);height:min(690px,88vh);background:#111b23;border:7px solid #27343d;border-radius:35px;padding:12px;display:flex;flex-direction:column;box-shadow:0 15px 50px #0008}
.phoneTop{display:flex;justify-content:space-between;font-size:12px;padding:4px 7px}
.phoneScreen{flex:1;background:linear-gradient(145deg,#6e9bc1,#9cbed0 55%,#527c78);border-radius:20px;padding:15px;overflow:auto;color:#142b35;position:relative}
.phoneTitle{text-align:center;font-size:21px;font-weight:bold;margin:12px 0 5px}
.phoneDate{text-align:center;font-size:12px;margin-bottom:22px}
.appGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px 8px}
.app{border:0;background:#ffffffd9;border-radius:15px;padding:10px 3px;min-height:76px;color:#142b35;font-weight:bold;font-size:11px}
.app span{display:block;font-size:27px;margin-bottom:5px}
.phoneBottom{display:flex;justify-content:space-around;padding:10px 0 2px}
.phoneBottom button{border:0;background:#ffffff20;color:white;border-radius:20px;padding:9px 17px}
.appPage{background:#f4f5f1;color:#172a31;border-radius:14px;padding:12px;min-height:90%;display:flex;flex-direction:column}
.appPage h3{margin:5px 0 12px}
.appPage input,.appPage textarea{width:100%;padding:12px;border:1px solid #cbd5d8;border-radius:9px;margin:5px 0;font:inherit}
.appPage textarea{min-height:170px;resize:vertical}
.appPage button{padding:10px;border:0;border-radius:9px;background:#168b60;color:white;margin:4px 0;font-weight:bold}
.appBack{background:#dce7e8!important;color:#172a31!important}
.calcDisplay{background:#dce7e8;border-radius:10px;padding:17px;text-align:right;font-size:25px;min-height:60px;overflow-wrap:anywhere}
.calcKeys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.calcKeys button{font-size:19px;padding:15px 4px}
.mapBox{background:#d5e6cf;border-radius:12px;height:250px;position:relative;overflow:hidden}
.mapRoad{position:absolute;background:#888f92;height:18px;width:130%;top:48%;left:-10%;transform:rotate(-22deg)}
.mapRoad.two{transform:rotate(45deg);top:25%;background:#b0a58c}
.mapPin{position:absolute;font-size:24px}
</style>
</head>
<body>
<div id="game"></div>

<div id="hud">
 <div class="pill">🏠 LAGOS LIFE</div>
 <div id="stats">
  <div class="pill" id="money">₦500,000</div>
  <div class="pill" id="energy">⚡100</div>
 </div>
</div>
<div id="notice"></div>

<div id="bottom">
 <div class="controls">
  <button class="ctrl" id="up">▲</button>
  <button class="ctrl" id="left">◀</button>
  <button class="ctrl" id="down">▼</button>
  <button class="ctrl" id="right">▶</button>
 </div>
 <div class="actions">
  <button class="action" id="shopBtn">🛒 BUY</button>
  <button class="action" id="phoneBtn">📱 PHONE</button>
  <button class="action" id="homeBtn">🏠 HOME</button>
  <button class="action" id="yardBtn">🌴 YARD</button>
 </div>
</div>

<div class="overlay" id="shopOverlay">
 <div class="panel">
  <div class="head"><h2>🛍️ Furniture Shop</h2><button class="close" id="closeShop">✕</button></div>
  <p>Buy furniture, then tap the house floor to place it.</p>
  <div id="items"></div>
 </div>
</div>

<div class="overlay" id="phoneOverlay">
 <div class="phone">
  <div class="phoneTop"><span id="phoneTime">11:51</span><span>●●● ▰</span></div>
  <div class="phoneScreen" id="phoneScreen">
   <div id="homeScreen">
    <div class="phoneTitle">LAGOS PHONE</div>
    <div class="phoneDate" id="phoneDate"></div>
    <div class="appGrid">
     <button class="app" data-app="messages"><span>💬</span>Messages</button>
     <button class="app" data-app="calculator"><span>🧮</span>Calculator</button>
     <button class="app" data-app="map"><span>🗺️</span>Lagos Map</button>
     <button class="app" data-app="notes"><span>📝</span>Notes</button>
     <button class="app" data-app="calendar"><span>📅</span>Calendar</button>
     <button class="app" data-app="settings"><span>⚙️</span>Settings</button>
     <button class="app" data-app="weather"><span>☀️</span>Weather</button>
     <button class="app" data-app="camera"><span>📷</span>Camera</button>
     <button class="app" data-app="music"><span>🎵</span>Music</button>
    </div>
   </div>
   <div id="appScreen" style="display:none"></div>
  </div>
  <div class="phoneBottom">
   <button id="phoneBack">← Back</button>
   <button id="phoneHome">● Home</button>
   <button id="phoneClose">Close</button>
  </div>
 </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const mount=document.getElementById('game');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91cce8);
scene.fog=new THREE.Fog(0x91cce8,28,70);

const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,150);
camera.position.set(12,15,19);camera.lookAt(0,0,0);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
mount.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x647b60,2));
const sun=new THREE.DirectionalLight(0xffffff,2.2);
sun.position.set(-8,18,10);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);scene.add(sun);

const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.85});
const M={
 grass:mat(0x5caa58),floor:mat(0xe6d8b8),wall:mat(0xf0e9d9),
 trim:mat(0x9b6946),road:mat(0x454b50),wood:mat(0x95613a),
 green:mat(0x25804c),glass:new THREE.MeshStandardMaterial({color:0x83cce8,transparent:true,opacity:.5})
};
function box(w,h,d,x,y,z,material){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;
}
box(100,.2,100,0,-.22,0,M.grass);
box(100,.12,8,0,-.08,13,M.road);
for(let x=-45;x<48;x+=8)box(4,.03,.12,x,0,13,mat(0xe7d99b));

// House
const houseFloor=box(14,.25,12,0,0,0,M.floor);
box(14,.35,.25,0,.17,-6,M.trim);
box(.25,3,12,-7,1.5,0,M.wall);
box(.25,3,12,7,1.5,0,M.wall);
box(14,3,.25,0,1.5,-6,M.wall);
box(.18,2.7,3,-2,1.35,-4.5,M.wall);
box(.18,2.7,3,-2,1.35,0,M.wall);
box(4,2.7,.18,4,1.35,-2,M.wall);
box(2,2.7,.18,5,1.35,2,M.wall);
for(const x of [-5,0,5]){
 box(1.7,1.1,.08,x,1.9,-5.83,M.glass);
 box(1.85,.09,.12,x,1.9,-5.78,M.trim);
 box(.09,1.2,.12,x,1.9,-5.78,M.trim);
}
box(1.25,2.2,.18,0,1.1,-5.82,M.trim);

function label(t,x,z){
 const c=document.createElement('canvas');c.width=256;c.height=64;
 const ctx=c.getContext('2d');ctx.fillStyle='#183b32';ctx.font='bold 29px Arial';ctx.textAlign='center';ctx.fillText(t,128,42);
 const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true}));
 sprite.position.set(x,2.9,z);sprite.scale.set(2.5,.62,1);scene.add(sprite);
}
label('LIVING ROOM',-4,-3);label('BEDROOM',4,-4);label('KITCHEN',4,1);label('DINING',-4,2);

function tree(x,z){
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.18,.25,1.8,12),M.trim);
 trunk.position.set(x,.9,z);scene.add(trunk);
 const crown=new THREE.Mesh(new THREE.SphereGeometry(1.05,12,10),M.green);
 crown.position.set(x,2.25,z);crown.castShadow=true;scene.add(crown);
}
tree(-10,-2);tree(10,-3);tree(-10,6);tree(10,6);
for(let x=-12;x<=12;x+=2){box(.12,1.1,.12,x,.55,8,M.trim)}
box(24,.12,.12,0,1.05,8,M.trim);
for(const b of [{x:-14,z:-8,c:0xe2a66d},{x:14,z:-8,c:0xd7d5c8},{x:-15,z:2,c:0xb9c6ce}]){
 box(4,5,5,b.x,2.5,b.z,mat(b.c));
 box(4.2,.25,5.2,b.x,5.1,b.z,M.trim);
}

// Character
const player=new THREE.Group();scene.add(player);
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.32,.75,4,8),mat(0x2467ce));
body.position.y=.75;body.castShadow=true;player.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.25,16,12),mat(0x8c5737));
head.position.y=1.42;head.castShadow=true;player.add(head);
player.position.set(0,0,4);

let money=500000,energy=100,placing=null;
const owned=[];
const types=[
{id:'sofa',name:'Sofa',emoji:'🛋️',price:85000,color:0x3976a8,w:2.5,h:.8,d:1},
{id:'bed',name:'Double Bed',emoji:'🛏️',price:120000,color:0x9a6b9c,w:2.2,h:.65,d:2.6},
{id:'table',name:'Dining Table',emoji:'🍽️',price:45000,color:0x98613b,w:1.8,h:.8,d:1.2},
{id:'chair',name:'Chair',emoji:'🪑',price:18000,color:0x9a6035,w:.7,h:.9,d:.7},
{id:'tv',name:'Television',emoji:'📺',price:65000,color:0x202a32,w:1.6,h:1,d:.25},
{id:'fridge',name:'Fridge',emoji:'🧊',price:95000,color:0xd9e0e5,w:.9,h:1.8,d:.8},
{id:'wardrobe',name:'Wardrobe',emoji:'🚪',price:70000,color:0x865b3e,w:1.4,h:2,d:.7},
{id:'plant',name:'Plant',emoji:'🪴',price:12000,color:0x287d43,w:.65,h:1,d:.65}
];
function updateHud(){
 document.getElementById('money').textContent='₦'+money.toLocaleString('en-NG');
 document.getElementById('energy').textContent='⚡'+energy;
}
function say(t){
 const n=document.getElementById('notice');n.textContent=t;n.style.display='block';
 clearTimeout(say.timer);say.timer=setTimeout(()=>n.style.display='none',2400);
}
const shop=document.getElementById('shopOverlay');
function showShop(){
 const items=document.getElementById('items');items.innerHTML='';
 types.forEach(item=>{
  const div=document.createElement('div');div.className='item';
  div.innerHTML=`<div class="emoji">${item.emoji}</div><b>${item.name}</b><p>₦${item.price.toLocaleString('en-NG')}</p><button>BUY</button>`;
  div.querySelector('button').onclick=()=>{
   if(money<item.price){say('Not enough game money!');return}
   money-=item.price;updateHud();placing=item;shop.style.display='none';
   say('Bought '+item.name+'. Tap inside the house to place it.');
  };
  items.appendChild(div);
 });
 shop.style.display='flex';
}
document.getElementById('shopBtn').onclick=showShop;
document.getElementById('closeShop').onclick=()=>shop.style.display='none';

function makeFurniture(item,x,z){
 const group=new THREE.Group();
 const base=new THREE.Mesh(new THREE.BoxGeometry(item.w,item.h,item.d),mat(item.color));
 base.position.y=item.h/2;base.castShadow=true;group.add(base);
 if(item.id==='bed'){
  const mattress=new THREE.Mesh(new THREE.BoxGeometry(item.w*.95,.18,item.d*.8),mat(0xf0e9df));
  mattress.position.set(0,item.h+.08,.12);group.add(mattress);
 }
 if(item.id==='sofa'){
  const back=new THREE.Mesh(new THREE.BoxGeometry(item.w,.65,.22),mat(item.color));
  back.position.set(0,item.h+.25,-item.d*.38);group.add(back);
 }
 if(item.id==='plant'){
  const leaves=new THREE.Mesh(new THREE.SphereGeometry(.42,10,8),M.green);
  leaves.position.y=item.h+.3;group.add(leaves);
 }
 group.position.set(x,0,z);scene.add(group);owned.push(group);
}
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown',e=>{
 if(!placing)return;
 const r=renderer.domElement.getBoundingClientRect();
 pointer.x=(e.clientX-r.left)/r.width*2-1;
 pointer.y=-(e.clientY-r.top)/r.height*2+1;
 ray.setFromCamera(pointer,camera);
 const hit=ray.intersectObject(houseFloor)[0];
 if(!hit){say('Tap the house floor to place furniture.');return}
 const p=hit.point;
 if(Math.abs(p.x)>6.5||Math.abs(p.z)>5.5){say('Place it inside the house.');return}
 makeFurniture(placing,p.x,p.z);say(placing.name+' placed!');placing=null;
});

document.getElementById('homeBtn').onclick=()=>{player.position.set(0,0,4);say('Welcome home!')};
document.getElementById('yardBtn').onclick=()=>{player.position.set(0,0,10);say('You are in the yard!')};

// Movement controls
const keys={};
window.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function bind(id,key){
 const el=document.getElementById(id);
 el.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true});
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,()=>keys[key]=false));
}
bind('up','w');bind('down','s');bind('left','a');bind('right','d');

// PHONE APP SYSTEM
const phone=document.getElementById('phoneOverlay');
const homeScreen=document.getElementById('homeScreen');
const appScreen=document.getElementById('appScreen');
let currentApp='';
document.getElementById('phoneBtn').onclick=()=>{
 phone.style.display='flex';showPhoneHome();
};
document.getElementById('phoneClose').onclick=()=>phone.style.display='none';
document.getElementById('phoneHome').onclick=showPhoneHome;
document.getElementById('phoneBack').onclick=showPhoneHome;

function showPhoneHome(){
 currentApp='';homeScreen.style.display='block';appScreen.style.display='none';
}
document.querySelectorAll('.app').forEach(btn=>{
 btn.onclick=()=>openApp(btn.dataset.app);
});
function page(title,html){
 homeScreen.style.display='none';appScreen.style.display='block';
 appScreen.innerHTML=`<div class="appPage"><h3>${title}</h3>${html}<button class="appBack" id="pageBack">← Back to apps</button></div>`;
 document.getElementById('pageBack').onclick=showPhoneHome;
}

function openApp(name){
 currentApp=name;
 if(name==='messages'){
  page('💬 Messages',`
   <p><b>Game contacts</b></p>
   <button class="contact" data-contact="Tunde">Tunde</button>
   <button class="contact" data-contact="Amaka">Amaka</button>
   <button class="contact" data-contact="Neighbour">Neighbour</button>
   <div id="chatArea"><p>Choose a contact to start a game conversation.</p></div>
  `);
  appScreen.querySelectorAll('.contact').forEach(b=>b.onclick=()=>{
   const who=b.dataset.contact;
   document.getElementById('chatArea').innerHTML=`
    <p><b>Chat with ${who}</b></p>
    <div id="chatMessages" style="background:#e6eeee;padding:10px;border-radius:9px;min-height:55px"> ${who}: Welcome to Lagos!</div>
    <input id="chatInput" placeholder="Write a message">
    <button id="sendMessage">Send</button>`;
   document.getElementById('sendMessage').onclick=()=>{
    const input=document.getElementById('chatInput');
    if(!input.value.trim())return;
    const msg=document.createElement('p');msg.textContent='You: '+input.value;
    document.getElementById('chatMessages').appendChild(msg);input.value='';
   };
  });
 }
 if(name==='calculator'){
  page('🧮 Calculator',`<div class="calcDisplay" id="calcDisplay">0</div><div class="calcKeys">
  ${['7','8','9','÷','4','5','6','×','1','2','3','−','C','0','=','+'].map(k=>`<button data-key="${k}">${k}</button>`).join('')}
  </div>`);
  let expression='';
  const display=document.getElementById('calcDisplay');
  appScreen.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{
   const k=b.dataset.key;
   if(k==='C'){expression='';display.textContent='0';return}
   if(k==='='){
    try{
     const safe=expression.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
     if(!/^[0-9+*/(). -]+$/.test(safe))throw Error();
     const result=Function('"use strict";return ('+safe+')')();
     if(!Number.isFinite(result))throw Error();
     expression=String(Number(result.toFixed(8)));display.textContent=expression;
    }catch{display.textContent='Error';expression=''}
    return;
   }
   expression+=k;display.textContent=expression;
  });
 }
 if(name==='notes'){
  const saved=localStorage.getItem('lagosLifeNotes')||'';
  page('📝 My Notes',`<textarea id="notesText" placeholder="Write your notes here..."></textarea><button id="saveNotes">Save Notes</button><p id="noteStatus"></p>`);
  document.getElementById('notesText').value=saved;
  document.getElementById('saveNotes').onclick=()=>{
   localStorage.setItem('lagosLifeNotes',document.getElementById('notesText').value);
   document.getElementById('noteStatus').textContent='Saved on this device ✓';
  };
 }
 if(name==='map'){
  page('🗺️ Lagos Map',`<p>Explore your game neighbourhood.</p><div class="mapBox">
   <div class="mapRoad"></div><div class="mapRoad two"></div>
   <span class="mapPin" style="left:45%;top:45%">🏠</span>
   <span class="mapPin" style="left:18%;top:18%">🛍️</span>
   <span class="mapPin" style="left:70%;top:68%">🌳</span>
   <span class="mapPin" style="left:73%;top:20%">🏢</span>
  </div><p>🏠 Your Home<br>🛍️ Shopping Area<br>🌳 Community Park<br>🏢 City Centre</p>
  <button id="goHome">Go to Home</button><button id="goYard">Go to Yard</button>`);
  document.getElementById('goHome').onclick=()=>{player.position.set(0,0,4);phone.style.display='none';say('Returned home!')};
  document.getElementById('goYard').onclick=()=>{player.position.set(0,0,10);phone.style.display='none';say('You are at the yard!')};
 }
 if(name==='calendar'){
  const d=new Date();
  page('📅 Calendar',`<h2>${d.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h2><p>Today: ${d.toLocaleDateString()}</p><p>Game reminder</p><input id="eventInput" placeholder="Add a reminder"><button id="saveEvent">Save Reminder</button><p id="eventStatus"></p>`);
  document.getElementById('saveEvent').onclick=()=>{
   const v=document.getElementById('eventInput').value;
   if(v.trim()){localStorage.setItem('lagosLifeReminder',v);document.getElementById('eventStatus').textContent='Saved: '+v}
  };
  const old=localStorage.getItem('lagosLifeReminder');
  if(old)document.getElementById('eventStatus').textContent='Saved reminder: '+old;
 }
 if(name==='settings'){
  page('⚙️ Settings',`<p>Game settings</p><button id="soundBtn">🔊 Toggle sound setting</button><p id="soundStatus">Sound setting: On</p><button id="resetNotes">Clear saved notes</button><p id="settingsStatus"></p>`);
  let sound=true;
  document.getElementById('soundBtn').onclick=()=>{
   sound=!sound;document.getElementById('soundStatus').textContent='Sound setting: '+(sound?'On':'Off');
  };
  document.getElementById('resetNotes').onclick=()=>{
   localStorage.removeItem('lagosLifeNotes');
   document.getElementById('settingsStatus').textContent='Saved notes cleared.';
  };
 }
 if(name==='weather'){
  page('☀️ Weather',`<h2>☀️ Sunny</h2><p>Welcome to your Lagos neighbourhood!</p><p>This is a fictional
