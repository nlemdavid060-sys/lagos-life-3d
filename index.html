
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LAGOS LIFE 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#78baff;font-family:Arial,sans-serif;color:white}
canvas{display:block}
#ui{position:fixed;inset:0;pointer-events:none}
.panel{background:#101827eF;border:1px solid #ffffff30;border-radius:13px;padding:11px;pointer-events:auto}
#top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
#brand{font-size:17px;font-weight:900;color:#64d9ff}
#stats{font-size:12px;line-height:1.7;text-align:right}
#buttons{position:absolute;top:105px;right:10px;display:flex;flex-direction:column;gap:7px}
button{border:0;border-radius:10px;padding:11px 13px;background:#087bdb;color:white;font-weight:bold;font-size:12px;pointer-events:auto}
button:active{background:#00a9ff}
#controls{position:absolute;bottom:22px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-end}
#move{display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px;gap:4px;pointer-events:auto}
#move button{padding:0;font-size:22px;background:#172d49dd}
#up{grid-column:2;grid-row:1}
#left{grid-column:1;grid-row:2}
#down{grid-column:2;grid-row:2}
#right{grid-column:3;grid-row:2}
#actions{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
#actions button{min-width:85px}
#message{position:absolute;top:47%;left:50%;transform:translate(-50%,-50%);width:85%;max-width:360px;text-align:center;display:none}
#message h2{color:#62dfff}
#message button{margin:4px}
#close{background:#bd354a}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#14253e;color:white;z-index:10;text-align:center;padding:20px}
#loading small{color:#b8d9ff}
#hint{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);font-size:10px;color:white;text-shadow:0 1px 4px black;white-space:nowrap}
@media(max-width:420px){#brand{font-size:14px}button{padding:10px;font-size:11px}}
</style>
</head>
<body>
<div id="loading"><div><h2>LAGOS LIFE 3D</h2><p id="loadText">Loading your city...</p><small>Please wait</small></div></div>
<div id="ui">
 <div id="top">
  <div class="panel"><div id="brand">LAGOS LIFE 3D</div><small id="place">LAGOS, NIGERIA</small></div>
  <div class="panel" id="stats">
   <div>💰 ₦<span id="money">1000000000000</span></div>
   <div>🚗 <span id="mode">WALKING</span></div>
   <div>🌤️ <span id="weather">DAY</span></div>
  </div>
 </div>
 <div id="buttons">
  <button onclick="openPanel('phone')">📱 PHONE</button>
  <button onclick="openPanel('map')">🗺️ MAP</button>
  <button onclick="openPanel('bank')">🏦 BANK</button>
  <button onclick="openPanel('shop')">🛍️ SHOP</button>
  <button onclick="toggleDay()">🌙 DAY / NIGHT</button>
 </div>
 <div id="controls">
  <div id="move">
   <button id="up">⬆️</button>
   <button id="left">⬅️</button>
   <button id="down">⬇️</button>
   <button id="right">➡️</button>
  </div>
  <div id="actions">
   <button onclick="toggleCar()">🚘 ENTER / EXIT</button>
   <button id="runButton" onclick="running=!running">🏃 RUN</button>
   <button onclick="openPanel('missions')">🎯 MISSIONS</button>
  </div>
 </div>
 <div id="message" class="panel"></div>
 <div id="hint">Use the arrows to move around Lagos</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const loading=document.getElementById('loading');
const loadText=document.getElementById('loadText');
if(!window.THREE){
 loadText.innerHTML="3D engine could not load.<br>Check your internet connection and refresh.";
 return;
}
try{
const THREE=window.THREE;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x78baff);
scene.fog=new THREE.FogExp2(0x78baff,0.0022);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,1000);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
document.body.insertBefore(renderer.domElement,document.getElementById('ui'));

scene.add(new THREE.HemisphereLight(0xbfe6ff,0x40502b,1.5));
const sun=new THREE.DirectionalLight(0xffedc4,2);
sun.position.set(-40,70,35);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

const mat=(color,roughness=0.8)=>new THREE.MeshStandardMaterial({color,roughness});
const green=mat(0x368b48),roadMat=mat(0x30343b),white=mat(0xffffff),yellow=mat(0xffd12b);
const buildingMats=[0xd9b89a,0xd0d6df,0xe8d8c4,0x9fb8c8,0xd2c2a9].map(c=>mat(c));
function box(w,h,d,material,x,y,z){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;
}
function ground(){
 box(400,1,400,green,0,-0.7,0);
 box(400,0.15,13,roadMat,0,0,-5);
 box(13,0.16,400,roadMat,5,0,0);
 for(let i=-180;i<190;i+=12){
  box(5,0.03,.25,yellow,i,.1,-5);
  box(.25,.03,5,yellow,5,.1,i);
 }
}
function building(x,z){
 const w=8+Math.random()*8,h=8+Math.random()*22,d=8+Math.random()*9;
 const b=box(w,h,d,buildingMats[Math.floor(Math.random()*buildingMats.length)],x,h/2,z);
 for(let y=2;y<h-1;y+=3){
  for(let xx=-w/2+1;xx<w/2;xx+=2.5){
   box(1.1,1.3,.12,mat(0x5aa5bd),x+xx,y,z-d/2-.08);
  }
 }
 return b;
}
function palm(x,z){
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.25,.4,5,7),mat(0x81532c));
 trunk.position.set(x,2.5,z);scene.add(trunk);
 for(let i=0;i<7;i++){
  const leaf=new THREE.Mesh(new THREE.BoxGeometry(.35,.15,4),mat(0x187d37));
  leaf.position.set(x,5,z);leaf.rotation.y=i*Math.PI/3;leaf.rotation.x=-.3;scene.add(leaf);
 }
}
ground();
for(let x=-75;x<=75;x+=18){
 for(let z=-75;z<=75;z+=18){
  if(Math.abs(x)<15||Math.abs(z)<15)continue;
  building(x+(Math.random()*5),z+(Math.random()*5));
 }
}
for(let i=-85;i<=85;i+=12){palm(i,-14);palm(i,14);}

function makeCar(color=0x075dff){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.BoxGeometry(3,0.8,5.3),mat(color,.35));
 body.position.y=1;body.castShadow=true;g.add(body);
 const top=new THREE.Mesh(new THREE.BoxGeometry(2.2,.8,2.3),mat(0x172b3c,.3));
 top.position.set(0,1.75,-.25);g.add(top);
 for(const x of [-1.55,1.55]){
  for(const z of [-1.7,1.7]){
   const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,.35,16),mat(0x111111));
   wheel.rotation.z=Math.PI/2;wheel.position.set(x,.55,z);g.add(wheel);
  }
 }
 return g;
}
const car=makeCar();car.position.set(4,0,5);scene.add(car);

const player=new THREE.Group();
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.5,1.2,4,8),mat(0x147bff));
body.position.y=1.25;player.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.38,16,16),mat(0x9b603d));
head.position.y=2.25;player.add(head);
const hair=new THREE.Mesh(new THREE.SphereGeometry(.39,12,8),mat(0x17120e));
hair.scale.y=.45;hair.position.y=2.52;player.add(hair);
player.position.set(0,0,24);scene.add(player);

function danfo(x,z){
 const g=new THREE.Group();
 const bus=new THREE.Mesh(new THREE.BoxGeometry(2.5,2.3,4),yellow);
 bus.position.y=1.3;g.add(bus);
 const glass=new THREE.Mesh(new THREE.BoxGeometry(2.2,.8,.08),mat(0x243c51));
 glass.position.set(0,1.7,-2.05);g.add(glass);
 g.position.set(x,0,z);scene.add(g);return g;
}
const buses=[danfo(-25,-5),danfo(25,5),danfo(-45,-5)];

let money=1000000000000;
let inCar=false,running=false,night=false;
let speed=0,place='LAGOS';
let keys={};
let held={};
let message=document.getElementById('message');
let saved=null;
try{saved=JSON.parse(localStorage.getItem('lagosLifeSave')||'null')}catch(e){}
if(saved&&saved.version===3&&Number.isFinite(saved.money))money=saved.money;
function save(){
 try{localStorage.setItem('lagosLifeSave',JSON.stringify({version:3,money:money}));}catch(e){}
 updateUI();
}
function updateUI(){
 document.getElementById('money').textContent=money.toLocaleString('en-NG');
 document.getElementById('mode').textContent=inCar?'DRIVING':'WALKING';
 document.getElementById('place').textContent=place+', NIGERIA';
 document.getElementById('weather').textContent=night?'NIGHT':'DAY';
}
window.toggleDay=function(){
 night=!night;
 scene.background=new THREE.Color(night?0x07152d:0x78baff);
 scene.fog.color.set(night?0x07152d:0x78baff);
 sun.intensity=night?.18:2;
 updateUI();
};
window.toggleCar=function(){
 inCar=!inCar;
 if(inCar){car.position.copy(player.position);car.position.y=0;}
 updateUI();
};
window.openPanel=function(which){
 let html='<h2>'+which.toUpperCase()+'</h2>';
 if(which==='phone')html+='<p>Welcome to your Lagos Life phone.</p><button onclick="openPanel(\\'map\\')">Open map</button><button onclick="openPanel(\\'bank\\')">Open bank</button>';
 if(which==='map')html+='<p>Choose a destination:</p>'+['Lagos','Ogun','Oyo','Rivers','Kano','Enugu','Delta','Kaduna','Abuja FCT'].map(s=>'<button onclick="travel(\\''+s+'\\')">'+s+'</button>').join('');
 if(which==='bank')html+='<p>Your virtual balance: ₦'+money.toLocaleString('en-NG')+'</p><p>Investment centre</p>'+[['Small Business',10000000,12000000],['Shopping Mall',50000000,60000000],['Hotel Business',100000000,125000000],['Factory',200000000,250000000]].map(a=>'<p>'+a[0]+'<br>Invest ₦'+a[1].toLocaleString('en-NG')+' <button onclick="invest('+a[1]+','+a[2]+')">Invest</button></p>').join('');
 if(which==='shop')html+='<p>Virtual city shop</p>'+[['Food',50000],['Designer clothes',250000],['Watch',1000000],['Furniture',2000000],['Fuel',100000]].map(a=>'<p>'+a[0]+' — ₦'+a[1].toLocaleString('en-NG')+' <button onclick="buy('+a[1]+')">Buy</button></p>').join('');
 if(which==='missions')html+='<p>Explore Lagos, drive your car and visit the city landmarks.</p><p>Reward for exploring: ₦500,000</p><button onclick="reward()">Claim exploration reward</button>';
 if(which==='hotel')html+='<p>Welcome to the Lagos hotel.</p><p>Virtual room: ₦2,000,000</p><button onclick="buy(2000000)">Book a room</button>';
 html+='<br><button id="close" onclick="closePanel()">CLOSE</button>';
 message.innerHTML=html;message.style.display='block';
};
window.closePanel=function(){message.style.display='none';};
window.travel=function(s){
 place=s;player.position.set(0,0,24);car.position.set(4,0,5);
 closePanel();updateUI();
};
window.invest=function(cost,returns){
 if(money<cost){alert('Not enough virtual money');return;}
 money-=cost;money+=returns;save();
 alert('Investment complete! Virtual return added.');
 openPanel('bank');
};
window.buy=function(cost){
 if(money<cost){alert('Not enough virtual money');return;}
 money-=cost;save();alert('Purchase complete!');
};
window.reward=function(){
 money+=500000;save();alert('Mission reward received!');
};
['up','down','left','right'].forEach(id=>{
 const b=document.getElementById(id);
 b.addEventListener('pointerdown',e=>{e.preventDefault();held[id]=true;});
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>held[id]=false));
});
window.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

function move(){
 let forward=keys.w||keys.arrowup||held.up;
 let back=keys.s||keys.arrowdown||held.down;
 let left=keys.a||keys.arrowleft||held.left;
 let right=keys.d||keys.arrowright||held.right;
 let amount=inCar?.65:(running?.25:.12);
 if(forward)player.position.z-=amount;
 if(back)player.position.z+=amount;
 if(left)player.position.x-=amount;
 if(right)player.position.x+=amount;
 player.position.x=Math.max(-180,Math.min(180,player.position.x));
 player.position.z=Math.max(-180,Math.min(180,player.position.z));
 if(inCar){car.position.x=player.position.x;car.position.z=player.position.z;}
}
function animate(){
 requestAnimationFrame(animate);
 move();
 buses.forEach((b,i)=>{b.position.x+=.08+i*.025;if(b.position.x>100)b.position.x=-100;});
 const target=inCar?car.position:player.position;
 camera.position.lerp(new THREE.Vector3(target.x+12,10,target.z+17),.08);
 camera.lookAt(target.x,1.2,target.z);
 renderer.render(scene,camera);
}
window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
save();
loading.style.display='none';
animate();
}catch(error){
 loadText.textContent='Game error: '+error.message+'. Please send a screenshot.';
 console.error(error);
}
})();
</script>
</body>
</html>
