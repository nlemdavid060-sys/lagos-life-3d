
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lagos Life 3D V6</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111827;color:white;font-family:Arial;overflow:hidden}
#hud{position:absolute;top:8px;left:8px;right:8px;z-index:5;display:flex;justify-content:space-between;gap:5px;pointer-events:none}
.pill{background:#101b2ddd;padding:10px;border-radius:12px;font-size:13px}
#world{position:absolute;inset:0;overflow:hidden;background:#79c6e9}
#scene{position:absolute;width:2400px;height:2400px;left:50%;top:50%;transform:translate(-50%,-50%);background:#478c54}
.road{position:absolute;background:#353b43}
.road.h{height:150px;width:2400px}
.road.v{width:150px;height:2400px}
.lane{position:absolute;border-top:5px dashed white}
.building{position:absolute;background:linear-gradient(90deg,#273b56,#526b85);border:4px solid #1d2d42;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:10px}
.window{background:#f5d77c}
.tree{position:absolute;font-size:35px}
#player,#vehicle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;font-size:43px;pointer-events:none}
#vehicle{display:none;font-size:55px}
#controls{position:absolute;bottom:18px;left:15px;right:15px;z-index:8;display:flex;justify-content:space-between;align-items:end}
#stick{width:125px;height:125px;border-radius:50%;background:#ffffff40;border:3px solid white;position:relative;touch-action:none}
#knob{width:48px;height:48px;background:#fff;border-radius:50%;position:absolute;left:35px;top:35px}
.actions{display:grid;grid-template-columns:repeat(2,75px);gap:8px}
button{background:#147ce9;color:white;border:0;border-radius:12px;padding:12px;font-weight:bold}
button:active{background:#0753a7}
#menu{position:absolute;z-index:10;top:65px;left:8px;right:8px;bottom:165px;background:#101c2cf5;border-radius:15px;padding:15px;overflow:auto;display:none}
#menu h2{margin-top:0}
.card{background:#263d57;padding:12px;border-radius:12px;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
#message{position:absolute;bottom:150px;left:10%;right:10%;text-align:center;background:#101c2ccc;padding:8px;border-radius:10px;z-index:7}
#phone{background:#101827;border:5px solid #9ca3af;border-radius:25px;padding:15px}
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.app{background:#304b6d;padding:17px 3px;text-align:center;border-radius:12px}
</style>
</head>
<body>
<div id="hud">
<div class="pill">🌆 LAGOS LIFE V6</div>
<div class="pill">💰 ₦<span id="money">50000000</span></div>
<div class="pill">📍 <span id="location">Lagos</span></div>
</div>

<div id="world">
<div id="scene">
<div class="road h" style="top:600px"></div>
<div class="road h" style="top:1250px"></div>
<div class="road h" style="top:1900px"></div>
<div class="road v" style="left:550px"></div>
<div class="road v" style="left:1150px"></div>
<div class="road v" style="left:1800px"></div>
<div id="buildings"></div>
</div>
</div>
<div id="player">🧍</div>
<div id="vehicle">🏎️</div>

<div id="message">Welcome to Lagos! Use the joystick to move.</div>

<div id="controls">
<div id="stick"><div id="knob"></div></div>
<div class="actions">
<button onclick="toggleCar()">🚘 Car</button>
<button onclick="jump()">⬆️ Jump</button>
<button onclick="run=!run">🏃 Run</button>
<button onclick="openMenu('home')">☰ Menu</button>
<button onclick="openMenu('phone')">📱 Phone</button>
<button onclick="openMenu('map')">🗺️ Map</button>
</div>
</div>

<div id="menu">
<button onclick="closeMenu()" style="float:right">✖ Close</button>
<div id="menuContent"></div>
</div>

<script>
const scene=document.getElementById("scene");
const player=document.getElementById("player");
const vehicle=document.getElementById("vehicle");
const stick=document.getElementById("stick");
const knob=document.getElementById("knob");
let money=50000000,owned=[],cars=[],investments=[],rentals=[];
let state="Lagos",run=false,inCar=false;
let x=1200,y=1200,dx=0,dy=0,angle=0;
let saved=JSON.parse(localStorage.getItem("lagosV6")||"null");
if(saved){
money=saved.money??money;
owned=saved.owned||[];
cars=saved.cars||[];
investments=saved.investments||[];
state=saved.state||"Lagos";
}

const states=["Lagos","Abuja","Kano","Rivers","Ogun","Oyo","Enugu","Delta","Kaduna","Anambra","Edo","Imo","Akwa Ibom","Cross River","Osun","Ondo","Kwara","Plateau","Borno","Benue","Niger","Ekiti","Taraba","Adamawa","Bauchi","Gombe","Jigawa","Katsina","Kebbi","Sokoto","Yobe","Zamfara","Bayelsa","Ebonyi","Nasarawa","Abia","Kogi"];
const carList=[
["Bugatti Chiron","🏎️",15000000],
["Lamborghini","🏎️",12000000],
["Ferrari","🏎️",11000000],
["Rolls Royce","🚘",9000000],
["Mercedes AMG","🚗",7000000],
["Range Rover","🚙",6500000],
["Porsche 911","🏎️",8000000],
["McLaren","🏎️",13000000]
];

function save(){
localStorage.setItem("lagosV6",JSON.stringify({money,owned,cars,investments,state}));
document.getElementById("money").textContent=money.toLocaleString();
document.getElementById("location").textContent=state;
}
function notify(t){document.getElementById("message").textContent=t}
function spend(n){if(money<n){notify("Not enough money!");return false}money-=n;save();return true}

function addBuildings(){
for(let i=0;i<45;i++){
let b=document.createElement("div");
b.className="building";
b.style.left=(100+Math.random()*2100)+"px";
b.style.top=(100+Math.random()*2100)+"px";
b.style.width=(65+Math.random()*65)+"px";
b.style.height=(100+Math.random()*180)+"px";
for(let j=0;j<9;j++){
let w=document.createElement("div");w.className="window";b.appendChild(w);
}
scene.appendChild(b);
}
for(let i=0;i<55;i++){
let t=document.createElement("div");t.className="tree";t.textContent="🌳";
t.style.left=Math.random()*2300+"px";
t.style.top=Math.random()*2300+"px";
scene.appendChild(t);
}
}
addBuildings();

function updateWorld(){
let cx=innerWidth/2-x,cy=innerHeight/2-y;
scene.style.left=cx+"px";
scene.style.top=cy+"px";
player.style.display=inCar?"none":"block";
vehicle.style.display=inCar?"block":"none";
player.style.transform=`translate(-50%,-50%) rotate(${angle}deg)`;
vehicle.style.transform=`translate(-50%,-50%) rotate(${angle}deg)`;
}

function move(){
let speed=inCar?5:run?4:2.3;
x+=dx*speed;
y+=dy*speed;
x=Math.max(30,Math.min(2370,x));
y=Math.max(30,Math.min(2370,y));
if(dx||dy)angle=Math.atan2(dy,dx)*180/Math.PI;
updateWorld();
requestAnimationFrame(move);
}
move();

let active=false;
function joystick(e){
const r=stick.getBoundingClientRect();
let px=e.clientX-r.left-r.width/2;
let py=e.clientY-r.top-r.height/2;
let len=Math.hypot(px,py),max=40;
if(len>max){px=px/len*max;py=py/len*max}
knob.style.left=(35+px)+"px";
knob.style.top=(35+py)+"px";
dx=px/max;dy=py/max;
}
stick.addEventListener("pointerdown",e=>{
active=true;stick.setPointerCapture(e.pointerId);joystick(e);
});
stick.addEventListener("pointermove",e=>{if(active)joystick(e)});
function stopStick(){active=false;dx=0;dy=0;knob.style.left="35px";knob.style.top="35px"}
stick.addEventListener("pointerup",stopStick);
stick.addEventListener("pointercancel",stopStick);

document.addEventListener("keydown",e=>{
if(e.key==="ArrowUp"||e.key==="w")dy=-1;
if(e.key==="ArrowDown"||e.key==="s")dy=1;
if(e.key==="ArrowLeft"||e.key==="a")dx=-1;
if(e.key==="ArrowRight"||e.key==="d")dx=1;
});
document.addEventListener("keyup",e=>{
if(["ArrowUp","ArrowDown","w","s"].includes(e.key))dy=0;
if(["ArrowLeft","ArrowRight","a","d"].includes(e.key))dx=0;
});

function jump(){notify("Jump!")}
function toggleCar(){
if(!inCar){
if(!cars.length){notify("Buy a car first!");return}
inCar=true;notify("You entered your car! Drive with the joystick.");
}else{inCar=false;notify("You left your car.");}
updateWorld();
}

function openMenu(page){
let m=document.getElementById("menu");
m.style.display="block";
let c=document.getElementById("menuContent");
let html="";
if(page==="home"){
html=`<h2>🏙️ Lagos Life</h2><div class="grid">
<button onclick="openMenu('phone')">📱 Phone</button>
<button onclick="openMenu('cars')">🚘 Cars</button>
<button onclick="openMenu('flights')">✈️ Airport</button>
<button onclick="openMenu('houses')">🏠 Houses</button>
<button onclick="openMenu('invest')">📈 Investment</button>
<button onclick="openMenu('city')">🏙️ Build City</button></div>`;
}
if(page==="phone"){
html=`<div id="phone"><h2>📱 Davey's Phone</h2><div class="apps">
${["🏦 Bank","💬 Messages","📍 Maps","📷 Camera","✈️ Flights","🚘 Cars","🏠 Homes","📈 Stocks","🎵 Music"].map((a,i)=>`<div class="app" onclick="phoneApp(${i})">${a}</div>`).join("")}
</div><div id="phoneResult"></div></div>`;
}
if(page==="cars"){
html="<h2>🚘 Car Dealership</h2>";
carList.forEach((a,i)=>html+=`<div class="card">${a[1]} ${a[0]} - ₦${a[2].toLocaleString()} <button onclick="buyCar(${i})">Buy</button></div>`);
}
if(page==="flights"){
html="<h2>✈️ Airport</h2>";
states.forEach((s,i)=>html+=`<div class="card">Lagos → ${s} <button onclick="travel('${s}')">Fly ₦${(50000+i*1000).toLocaleString()}</button></div>`);
}
if(page==="houses"){
html=`<h2>🏠 Real Estate</h2>
<div class="card">Small House ₦5,000,000 <button onclick="buyHouse('Small House',5000000)">Buy</button></div>
<div class="card">Luxury House ₦15,000,000 <button onclick="buyHouse('Luxury House',15000000)">Buy</button></div>
<div class="card">Mansion ₦30,000,000 <button onclick="buyHouse('Mansion',30000000)">Buy</button></div>
<h3>Your Houses</h3>${owned.map((h,i)=>`<div class="card">${h.name} ${h.rented?"(Rented)":""}<button onclick="rentHouse(${i})">Rent out</button></div>`).join("")}`;
}
if(page==="invest"){
html=`<h2>📈 Business Investments</h2>
<div class="card">Shopping Mall ₦2,000,000 <button onclick="invest('Shopping Mall',2000000,250000)">Invest</button></div>
<div class="card">Hotel ₦5,000,000 <button onclick="invest('Hotel',5000000,700000)">Invest</button></div>
<div class="card">Factory ₦3,000,000 <button onclick="invest('Factory',3000000,400000)">Invest</button></div>
<h3>Your Businesses</h3>${investments.map((v,i)=>`<div class="card">${v.name} <button onclick="collect(${i})">Collect ₦${v.income.toLocaleString()}</button></div>`).join("")}`;
}
if(page==="city"){
html=`<h2>🏙️ Expand Lagos</h2>
<div class="card">Build skyscraper ₦2,000,000 <button onclick="build(2000000)">Build</button></div>
<div class="card">Build mall ₦3,000,000 <button onclick="build(3000000)">Build</button></div>
<div class="card">Build hotel ₦4,000,000 <button onclick="build(4000000)">Build</button></div>`;
}
if(page==="map")html=`<h2>🗺️ City Map</h2><p>Current position: ${Math.round(x)}, ${Math.round(y)}</p><p>Current state: ${state}</p>`;
c.innerHTML=html;
}
function closeMenu(){document.getElementById("menu").style.display="none"}

function phoneApp(i){
let names=["Bank balance: ₦"+money.toLocaleString(),"No new messages","Current state: "+state,"Camera ready","Use the airport to travel","Cars owned: "+cars.length,"Houses owned: "+owned.length,"Virtual investment portfolio","Music player ready"];
document.getElementById("phoneResult").innerHTML="<div class='card'>"+names[i]+"</div>";
}
function buyCar(i){
let a=carList[i];if(spend(a[2])){cars.push(a[0]);notify("You bought "+a[0]);openMenu("cars")}
}
function travel(s){
let i=states.indexOf(s),price=50000+i*1000;
if(spend(price)){state=s;x=1200;y=1200;save();notify("Welcome to "+s+"! You arrived by airplane.");closeMenu()}
}
function buyHouse(name,price){
if(spend(price)){owned.push({name,rented:false});save();notify(name+" purchased!");openMenu("houses")}
}
function rentHouse(i){
if(owned[i].rented){notify("Already rented");return}
owned[i].rented=true;owned[i].income=100000;save();notify("House rented! Collect your rent.");openMenu("houses")
}
function invest(name,price,income){
if(spend(price)){investments.push({name,income});save();notify(name+" investment started.");openMenu("invest")}
}
function collect(i){
money+=investments[i].income;save();notify("Investment income collected!");openMenu("invest")
}
function build(price){
if(spend(price)){
let b=document.createElement("div");b.className="building";
b.style.left=(x+100)+"px";b.style.top=(y+100)+"px";
b.style.width="100px";b.style.height="200px";
for(let i=0;i<9;i++){let w=document.createElement("div");w.className="window";b.appendChild(w)}
scene.appendChild(b);notify("New city building constructed!");
}
}
save();
updateWorld();
</script>
</body>
</html>
