
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LAGOS LIFE 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial;color:white}
canvas{display:block}
#hud{position:absolute;top:12px;left:12px;background:#071b30dd;padding:13px;border-radius:12px;z-index:5}
#hud h2{margin:0 0 8px;color:#25d9ff}
#hud p{margin:5px 0;font-weight:bold}
#buttons{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:8px;z-index:5}
button{border:0;border-radius:12px;padding:12px 16px;background:#092c48;color:white;font-weight:bold;font-size:14px}
button:active{background:#087fbd}
#controls{position:absolute;bottom:20px;left:15px;display:grid;grid-template-columns:55px 55px 55px;gap:5px;z-index:5}
#controls button{height:55px;padding:0;font-size:22px;background:#092c48dd}
#actions{position:absolute;bottom:25px;right:15px;display:flex;flex-direction:column;gap:10px;z-index:5}
#actions button{background:#087a43}
#message{position:absolute;bottom:115px;left:50%;transform:translateX(-50%);background:#071b30dd;padding:10px 15px;border-radius:10px;z-index:5;text-align:center}
#help{position:absolute;top:150px;left:12px;background:#071b30bb;padding:8px;border-radius:8px;font-size:11px;z-index:5}
</style>
</head>
<body>

<div id="hud">
<h2>LAGOS LIFE 3D</h2>
<p>💰 MONEY: ₦50,000</p>
<p id="mode">MODE: WALKING</p>
<p id="speed">SPEED: 0 KM/H</p>
</div>

<div id="buttons">
<button onclick="toggleNight()">🌙 DAY / NIGHT</button>
<button onclick="resetPlayer()">📍 RESET</button>
</div>

<div id="help">Explore Lagos • Find your car • Drive around</div>

<div id="controls">
<div></div><button data-dir="up">⬆️</button><div></div>
<button data-dir="left">⬅️</button>
<button data-dir="down">⬇️</button>
<button data-dir="right">➡️</button>
</div>

<div id="actions">
<button onclick="toggleCar()">🚗 ENTER / EXIT CAR</button>
<button onclick="jump()">⬆️ JUMP</button>
</div>

<div id="message">Welcome to Lagos Life 3D!</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 100, 300);

const camera = new THREE.PerspectiveCamera(
65, innerWidth/innerHeight, 0.1, 500
);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x526044,1.4));

const sun = new THREE.DirectionalLight(0xffffff,1.5);
sun.position.set(-50,100,50);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

// Lagos picture background
new THREE.TextureLoader().load(
"images/lagos-background.jpg",
texture=>{
texture.encoding=THREE.sRGBEncoding;
scene.background=texture;
},
undefined,
()=>console.log("Add images/lagos-background.jpg to show your picture")
);

// Materials
const green = new THREE.MeshStandardMaterial({color:0x368447});
const roadMat = new THREE.MeshStandardMaterial({color:0x292d32});
const white = new THREE.MeshStandardMaterial({color:0xffffff});
const glass = new THREE.MeshStandardMaterial({
color:0x6fc5e8,metalness:0.3,roughness:0.2
});

function box(w,h,d,mat,x,y,z){
const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
m.position.set(x,y,z);
m.castShadow=true;
m.receiveShadow=true;
scene.add(m);
return m;
}

// Ground
box(500,1,500,green,0,-0.6,0);

// Main roads
box(18,0.15,450,roadMat,0,0,0);
box(450,0.15,18,roadMat,0,0,0);

// Road lines
for(let i=-210;i<220;i+=18){
box(0.35,0.03,7,white,0,0.1,i);
box(7,0.03,0.35,white,i,0.1,0);
}

// Pavements
box(23,0.4,450,new THREE.MeshStandardMaterial({color:0x999999}),0,0.1,0);
box(450,0.4,23,new THREE.MeshStandardMaterial({color:0x999999}),0,0.1,0);
box(18,0.2,450,roadMat,0,0.35,0);
box(450,0.2,18,roadMat,0,0.35,0);

// Buildings
const buildingColors=[0xd9d0c0,0xc3d1df,0xb9b6ad,0xe6e0d5,0x858f9c];

for(let i=0;i<90;i++){
let x=(Math.random()-0.5)*220;
let z=(Math.random()-0.5)*220;
if(Math.abs(x)<15 || Math.abs(z)<15) continue;

let h=10+Math.random()*35;
let w=8+Math.random()*12;
let d=8+Math.random()*12;
let mat=new THREE.MeshStandardMaterial({
color:buildingColors[Math.floor(Math.random()*buildingColors.length)]
});
box(w,h,d,mat,x,h/2,z);

// Windows
for(let y=3;y<h-2;y+=4){
for(let xx=-w/2+2;xx<w/2-1;xx+=3){
box(1.4,1.8,0.15,glass,x+xx,y,z+d/2+0.1);
}
}
}

// Palm trees
function palm(x,z){
const trunkMat=new THREE.MeshStandardMaterial({color:0x80512c});
const trunk=new THREE.Mesh(
new THREE.CylinderGeometry(0.35,0.55,7,8),trunkMat
);
trunk.position.set(x,3.5,z);
scene.add(trunk);

const leaves=new THREE.MeshStandardMaterial({color:0x16823b});
for(let i=0;i<7;i++){
const leaf=new THREE.Mesh(
new THREE.BoxGeometry(1,0.2,5),leaves
);
leaf.position.set(x,7,z);
leaf.rotation.y=i*Math.PI/3;
leaf.rotation.x=-0.2;
scene.add(leaf);
}
}
for(let i=-180;i<190;i+=22){
palm(15,i);
palm(-15,i);
}

// Street lights
for(let i=-180;i<190;i+=35){
box(0.3,7,0.3,white,11,3.5,i);
box(3,0.25,0.25,white,12.3,7,i);
}

// Player
const player=new THREE.Group();
const skin=new THREE.MeshStandardMaterial({color:0x875333});
const blue=new THREE.MeshStandardMaterial({color:0x075bd1});
const black=new THREE.MeshStandardMaterial({color:0x171717});

const body=new THREE.Mesh(
new THREE.CapsuleGeometry(0.65,1.2,4,8),blue
);
body.position.y=1.5;
player.add(body);

const head=new THREE.Mesh(
new THREE.SphereGeometry(0.48,16,16),skin
);
head.position.y=2.8;
player.add(head);

const hair=new THREE.Mesh(
new THREE.SphereGeometry(0.5,16,8,0,Math.PI*2,0,Math.PI/2),black
);
hair.position.y=3;
player.add(hair);

const legs=[];
for(let i=-1;i<=1;i+=2){
const leg=new THREE.Mesh(
new THREE.BoxGeometry(0.35,0.9,0.4),black
);
leg.position.set(i*0.3,0.45,0);
player.add(leg);
legs.push(leg);
}
scene.add(player);
player.position.set(0,0,25);

// Sports car
const car=new THREE.Group();
const carBlue=new THREE.MeshStandardMaterial({
color:0x004cff,metalness:0.7,roughness:0.2
});
const carBody=new THREE.Mesh(
new THREE.BoxGeometry(4,1,7),carBlue
);
carBody.position.y=1;
car.add(carBody);

const cabin=new THREE.Mesh(
new THREE.BoxGeometry(3,1.1,3),glass
);
cabin.position.set(0,2,0);
car.add(cabin);

const wheels=[];
for(let x of [-2,2]){
for(let z of [-2.2,2.2]){
const wheel=new THREE.Mesh(
new THREE.CylinderGeometry(0.65,0.65,0.4,16),
black
);
wheel.rotation.z=Math.PI/2;
wheel.position.set(x,0.65,z);
car.add(wheel);
wheels.push(wheel);
}
}
scene.add(car);
car.position.set(7,0,20);

// Traffic
const traffic=[];
for(let i=0;i<5;i++){
const bus=new THREE.Group();
const yellow=new THREE.MeshStandardMaterial({color:0xffc400});
const base=new THREE.Mesh(new THREE.BoxGeometry(3,2,6),yellow);
base.position.y=1.2;
bus.add(base);
scene.add(bus);
bus.position.set(4,0,-i*35-20);
traffic.push(bus);
}

// Movement
const keys={up:false,down:false,left:false,right:false};
let driving=false;
let night=false;
let speed=0;
let rotation=0;

document.querySelectorAll("[data-dir]").forEach(button=>{
const dir=button.dataset.dir;
button.addEventListener("pointerdown",e=>{
e.preventDefault();
keys[dir]=true;
});
button.addEventListener("pointerup",()=>keys[dir]=false);
button.addEventListener("pointerleave",()=>keys[dir]=false);
button.addEventListener("pointercancel",()=>keys[dir]=false);
});

window.addEventListener("keydown",e=>{
if(e.key==="ArrowUp"||e.key==="w")keys.up=true;
if(e.key==="ArrowDown"||e.key==="s")keys.down=true;
if(e.key==="ArrowLeft"||e.key==="a")keys.left=true;
if(e.key==="ArrowRight"||e.key==="d")keys.right=true;
});
window.addEventListener("keyup",e=>{
if(e.key==="ArrowUp"||e.key==="w")keys.up=false;
if(e.key==="ArrowDown"||e.key==="s")keys.down=false;
if(e.key==="ArrowLeft"||e.key==="a")keys.left=false;
if(e.key==="ArrowRight"||e.key==="d")keys.right=false;
});

function toggleCar(){
const distance=player.position.distanceTo(car.position);
if(!driving && distance<12){
driving=true;
player.visible=false;
show("You entered your sports car!");
}else if(driving){
driving=false;
player.visible=true;
player.position.copy(car.position);
player.position.x+=5;
show("You left the car!");
}else{
show("Walk closer to your car first!");
}
updateHud();
}

function toggleNight(){
night=!night;
if(night){
scene.background=new THREE.Color(0x101c38);
scene.fog.color.set(0x101c38);
sun.intensity=0.25;
show("Night time in Lagos!");
}else{
scene.background=new THREE.Color(0x87ceeb);
scene.fog.color.set(0x87ceeb);
sun.intensity=1.5;
show("Daytime in Lagos!");
}
}

function jump(){
if(!driving){
player.position.y=3;
setTimeout(()=>player.position.y=0,350);
}
}

function resetPlayer(){
driving=false;
player.visible=true;
player.position.set(0,0,25);
car.position.set(7,0,20);
show("You are back at the starting point!");
updateHud();
}

function show(msg){
document.getElementById("message").textContent=msg;
}

function updateHud(){
document.getElementById("mode").textContent=
"MODE: "+(driving?"DRIVING":"WALKING");
}

function animate(){
requestAnimationFrame(animate);

const moving=keys.up||keys.down||keys.left||keys.right;
speed=0;

if(driving){
if(keys.up)speed=0.55;
if(keys.down)speed=-0.3;
if(keys.left)car.rotation.y+=0.035;
if(keys.right)car.rotation.y-=0.035;

car.translateZ(-speed);
wheels.forEach(w=>w.rotation.x+=speed);
}else{
if(keys.left)player.rotation.y+=0.045;
if(keys.right)player.rotation.y-=0.045;
if(keys.up)player.translateZ(-0.35);
if(keys.down)player.translateZ(0.35);

legs.forEach((leg,i)=>{
leg.rotation.x=moving?Math.sin(Date.now()*0.012+i*Math.PI)*0.5:0;
});
}

traffic.forEach(bus=>{
bus.position.z+=0.22;
if(bus.position.z>100)bus.position.z=-180;
});

const target=driving?car:player;
const cameraOffset=new THREE.Vector3(0,8,14);
cameraOffset.applyAxisAngle(
new THREE.Vector3(0,1,0),target.rotation.y
);
camera.position.lerp(
target.position.clone().add(cameraOffset),0.08
);
camera.lookAt(target.position.x,target.position.y+1,target.position.z);

document.getElementById("speed").textContent=
"SPEED: "+Math.round(Math.abs(speed)*100)+" KM/H";

renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
