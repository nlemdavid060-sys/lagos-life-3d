
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LAGOS LIFE 3D FAST</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#87c9ff;font-family:Arial;color:white}
canvas{display:block}
#loading{position:fixed;inset:0;background:#101c32;z-index:10;display:grid;place-items:center;text-align:center}
#loading h1{color:#43d9ff}
#ui{position:fixed;inset:0;pointer-events:none}
.panel{background:#101827eF;border:1px solid #ffffff40;border-radius:12px;padding:9px;pointer-events:auto}
#top{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between}
#logo{font-weight:900;color:#42ddff;font-size:15px}
#stats{text-align:right;font-size:12px;line-height:1.6}
#menu{position:absolute;right:8px;top:90px;display:flex;flex-direction:column;gap:5px}
button{border:0;border-radius:9px;padding:10px;background:#087ddd;color:white;font-weight:bold;font-size:11px;pointer-events:auto}
button:active{background:#00baff}
#controls{position:absolute;bottom:17px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-end}
#pad{display:grid;grid-template-columns:44px 44px 44px;grid-template-rows:44px 44px;gap:4px}
#pad button{padding:0;font-size:20px;background:#142b48dd}
#up{grid-column:2}
#left{grid-column:1;grid-row:2}
#down{grid-column:2;grid-row:2}
#right{grid-column:3;grid-row:2}
#actions{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
#actions button{min-width:90px}
#popup{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:90%;max-width:370px;max-height:70vh;overflow:auto;text-align:center}
#popup h2{color:#4bdbff}
#popup button{margin:3px}
#hint{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);font-size:10px;text-shadow:0 1px 4px black;white-space:nowrap}
</style>
</head>
<body>
<div id="loading"><div><h1>LAGOS LIFE 3D</h1><p id="loadText">Starting your game...</p><p>FAST LOAD EDITION</p></div></div>
<div id="ui">
 <div id="top">
  <div class="panel"><div id="logo">LAGOS LIFE 3D</div><small id="place">LAGOS, NIGERIA</small></div>
  <div class="panel" id="stats">
   💰 ₦<span id="money">1000000000000</span><br>
   🚘 <span id="mode">WALKING</span><br>
   🌞 <span id="clock">DAY</span>
  </div>
 </div>
 <div id="menu">
  <button onclick="openMenu('map')">🗺️ MAP</button>
  <button onclick="openMenu('garage')">🚘 GARAGE</button>
  <button onclick="openMenu('clothes')">👕 CLOTHES</button>
  <button onclick="openMenu('bank')">🏦 BANK</button>
  <button onclick="openMenu('missions')">🎯 MISSIONS</button>
  <button onclick="toggleNight()">🌙 DAY/NIGHT</button>
 </div>
 <div id="controls">
  <div id="pad">
   <button id="up">⬆</button><button id="left">⬅</button>
   <button id="down">⬇</button><button id="right">➡</button>
  </div>
  <div id="actions">
   <button onclick="enterCar()">🚗 ENTER / EXIT</button>
   <button onclick="run=!run">🏃 RUN</button>
   <button onclick="interact()">🏡 INTERACT</button>
  </div>
 </div>
 <div id="popup" class="panel"></div>
 <div id="hint">Use the arrows to explore the city</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const loading=document.getElementById('loading');
const loadText=document.getElementById('loadText');

function showError(msg){
 loadText.innerHTML=msg;
}
if(!window.THREE){
 showError('3D engine not available.<br>Check your internet and refresh.');
 return;
}

try{
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87c9ff);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(1);
document.body.insertBefore(renderer.domElement,document.getElementById('ui'));

scene.add(new THREE.HemisphereLight(0xffffff,0x52613a,1.7));
const sun=new THREE.DirectionalLight(0xffffff,1.2);
sun.position.set(-20,40,20);
scene.add(sun);

const mat=c=>new THREE.MeshLambertMaterial({color:c});
function box(w,h,d,color,x,y,z){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));
 o.position.set(x,y,z);scene.add(o);return o;
}
box(400,1,400,0x438c42,0,-.7,0);
box(400,.12,12,0x33383f,0,0,0);
box(12,.12,400,0x33383f,0,0,0);
for(let i=-180;i<180;i+=16){
 box(4,.025,.2,0xffd12b,i,.1,0);
 box(.2,.025,4,0xffd12b,0,.1,i);
}

function building(x,z){
 const h=8+Math.random()*12;
 box(9,h,9,[0xe1c8aa,0xc2d3df,0xe7e0d3,0xb2c4cf][Math.floor(Math.random()*4)],x,h/2,z);
 box(1.3,1,.12,0x64b4dc,x,h/2,z-4.6);
}
for(let x=-65;x<=65;x+=22){
 for(let z=-65;z<=65;z+=22){
  if(Math.abs(x)<14||Math.abs(z)<14)continue;
  building(x,z);
 }
}

function palm(x,z){
 box(.5,4,.5,0x79502d,x,2,z);
 for(let i=0;i<4;i++){
  const leaf=box(.3,.15,3,0x177b35,x,4,z);
  leaf.rotation.y=i*.8;
 }
}
for(let i=-70;i<=70;i+=20){palm(i,-12);palm(i,12);}

function carModel(color){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.BoxGeometry(3,1,5),mat(color));
 body.position.y=1;g.add(body);
 const roof=new THREE.Mesh(new THREE.BoxGeometry(2.1,.8,2.2),mat(0x243849));
 roof.position.set(0,1.8,-.2);g.add(roof);
 for(const x of [-1.5,1.5])for(const z of [-1.5,1.5]){
  const w=new THREE.Mesh(new THREE.CylinderGeometry(.5,.5,.3,10),mat(0x111111));
  w.rotation.z=Math.PI/2;w.position.set(x,.5,z);g.add(w);
 }
 return g;
}
const colors=[0x075dff,0x141414,0xcc2020,0xececec];
let car=carModel(colors[0]);car.position.set(5,0,8);scene.add(car);

const player=new THREE.Group();
const body=new THREE.Mesh(new THREE.CylinderGeometry(.4,.45,1.3,8),mat(0x147bff));
body.position.y=1;player.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.35,8,8),mat(0x925b3d));
head.position.y=2;player.add(head);
player.position.set(0,0,25);scene.add(player);

function bus(x,z){
 const g=new THREE.Group();
 const b=new THREE.Mesh(new THREE.BoxGeometry(2.5,2.2,4),mat(0xffd322));
 b.position.y=1.2;g.add(b);
 g.position.set(x,0,z);scene.add(g);return g;
}
const buses=[bus(-30,0),bus(30,0)];

function landmark(x,z,w,h,d,color){
 box(w,.3,d,0x777777,x,.1,z);
 box(w*.7,h,d*.7,color,x,h/2,z);
}
landmark(-48,-48,25,9,22,0xe6d3b7);
landmark(48,-48,22,15,20,0xd8e5ef);
landmark(-48,48,30,7,18,0xcbd7e0);
box(9,.2,5,0x12bfe4,58,.3,-45);

// Simple moving airplane
const plane=new THREE.Group();
const fuselage=new THREE.Mesh(new THREE.BoxGeometry(2,1,8),mat(0xffffff));
plane.add(fuselage);
const wing=new THREE.Mesh(new THREE.BoxGeometry(12,.2,2),mat(0xffffff));
plane.add(wing);
plane.position.set(-50,7,65);scene.add(plane);

let money=1000000000000,place='LAGOS',night=false,inCar=false,run=false;
let keys={},held={},completed={};
try{
 const s=JSON.parse(localStorage.getItem('lagosFastSave')||'null');
 if(s&&s.v===1&&Number.isFinite(s.money))money=s.money;
}catch(e){}
const popup=document.getElementById('popup');

function update(){
 document.getElementById('money').textContent=money.toLocaleString('en-NG');
 document.getElementById('mode').textContent=inCar?'DRIVING':'WALKING';
 document.getElementById('clock').textContent=night?'NIGHT':'DAY';
 document.getElementById('place').textContent=place+', NIGERIA';
}
function save(){
 try{localStorage.setItem('lagosFastSave',JSON.stringify({v:1,money:money,completed:completed}))}catch(e){}
 update();
}
function show(title,html){
 popup.innerHTML='<h2>'+title+'</h2>'+html+'<p><button onclick="closeMenu()" style="background:#bd354b">CLOSE</button></p>';
 popup.style.display='block';
}
window.closeMenu=()=>popup.style.display='none';

window.openMenu=function(type){
 let html='';
 if(type==='map'){
  html='<p>Choose your destination</p>'+['Lagos','Ogun','Oyo','Rivers','Kano','Enugu','Delta','Kaduna','Abuja FCT'].map(s=>'<button onclick="travel(\\''+s+'\\')">'+s+'</button>').join('');
 }
 if(type==='garage'){
  html='<p>Select a car</p>'+['Bugatti','Lamborghini','Ferrari','Mercedes'].map((s,i)=>'<button onclick="chooseCar('+i+')">'+s+'</button>').join('');
 }
 if(type==='clothes'){
  html='<p>Choose outfit colour</p>'+[['Blue',0x147bff],['Red',0xd42c37],['White',0xffffff],['Green',0x16a45b]].map(a=>'<button onclick="changeClothes('+a[1]+')">'+a[0]+'</button>').join('');
 }
 if(type==='bank'){
  html='<p>Balance: ₦'+money.toLocaleString('en-NG')+'</p><p>Virtual investments</p>'+[['Small business',10000000,12000000],['Mall',50000000,60000000],['Hotel',100000000,125000000]].map(a=>'<p>'+a[0]+' ₦'+a[1].toLocaleString('en-NG')+' <button onclick="invest('+a[1]+','+a[2]+')">INVEST</button></p>').join('');
 }
 if(type==='missions'){
  html='<p>Explore the city landmarks.</p><p>Reward: ₦500,000</p><button onclick="reward()">CLAIM CITY REWARD</button>';
 }
 show(type.toUpperCase(),html);
};
window.travel=function(s){place=s;player.position.set(0,0,25);closeMenu();update();};
window.chooseCar=function(i){
 scene.remove(car);car=carModel(colors[i]);car.position.copy(player.position);scene.add(car);
 closeMenu();alert('Car selected!');
};
window.changeClothes=function(c){body.material=mat(c);closeMenu();};
window.invest=function(cost,ret){
 if(money<cost){alert('Not enough virtual money');return;}
 money+=ret-cost;save();alert('Virtual investment completed!');
 openMenu('bank');
};
window.reward=function(){
 money+=500000;completed.city=true;save();alert('Reward collected!');
};
window.toggleNight=function(){
 night=!night;
 scene.background.set(night?0x07142c:0x87c9ff);
 sun.intensity=night?.2:1.2;update();
};
window.enterCar=function(){
 inCar=!inCar;
 if(inCar)car.position.copy(player.position);
 update();
};
window.interact=function(){
 const x=player.position.x,z=player.position.z;
 if(Math.hypot(x+48,z+48)<18)show('YOUR MANSION','<p>Welcome home!</p><p>Living room, bedroom and garden.</p><p>This is a simple demo interior.</p>');
 else if(Math.hypot(x-48,z+48)<18)show('LUXURY HOTEL','<p>Welcome to your hotel.</p><p>Virtual room price: ₦2,000,000</p><button onclick="bookHotel()">BOOK ROOM</button>');
 else if(Math.hypot(x+48,z-48)<20)show('LAGOS AIRPORT','<p>Welcome to the airport.</p><button onclick="openMenu(\\'map\\')">CHOOSE DESTINATION</button>');
 else alert('Explore the city to find landmarks!');
};
window.bookHotel=function(){
 if(money<2000000){alert('Not enough virtual money');return;}
 money-=2000000;save();alert('Hotel booked!');
};
window.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
['up','down','left','right'].forEach(id=>{
 const b=document.getElementById(id);
 b.addEventListener('pointerdown',e=>{e.preventDefault();held[id]=true});
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>held[id]=false));
});
function move(){
 if(popup.style.display==='block')return;
 const f=keys.w||keys.arrowup||held.up;
 const b=keys.s||keys.arrowdown||held.down;
 const l=keys.a||keys.arrowleft||held.left;
 const r=keys.d||keys.arrowright||held.right;
 const step=inCar?.55:(run?.28:.13);
 const obj=inCar?car:player;
 if(f)obj.position.z-=step;
 if(b)obj.position.z+=step;
 if(l)obj.position.x-=step;
 if(r)obj.position.x+=step;
 if(inCar){player.position.x=car.position.x;player.position.z=car.position.z;}
}
function animate(){
 requestAnimationFrame(animate);
 move();
 buses.forEach((b,i)=>{b.position.x+=.07+i*.02;if(b.position.x>90)b.position.x=-90;});
 plane.position.x+=.08;if(plane.position.x>100)plane.position.x=-100;
 const target=inCar?car.position:player.position;
 camera.position.lerp(new THREE.Vector3(target.x+11,9,target.z+16),.1);
 camera.lookAt(target.x,1,target.z);
 renderer.render(scene,camera);
}
window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
save();
loading.style.display='none';
animate();
}catch(e){
 showError('Game error: '+e.message+'<br>Please send a screenshot.');
 console.error(e);
}
})();
</script>
</body>
</html>
