
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LAGOS LIFE 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial}
#title{position:absolute;top:10px;width:100%;text-align:center;color:white;font-weight:bold;font-size:23px;text-shadow:2px 2px 5px black;pointer-events:none}
#info{position:absolute;top:50px;left:10px;color:white;background:#111c;padding:10px;border-radius:10px;line-height:1.7}
button{border:2px solid white;border-radius:13px;background:#18212ddd;color:white;font-weight:bold;font-size:16px;touch-action:none}
#phone,#map,#switch{position:absolute;right:12px;width:75px;height:45px}
#phone{top:12px}
#map{top:65px}
#switch{top:118px;background:#087b35}
#controls{position:absolute;bottom:18px;width:100%;display:flex;justify-content:space-between;padding:0 12px}
.group{display:flex;gap:8px;align-items:end}
.control{width:57px;height:57px;font-size:22px}
#go{width:72px;height:72px;background:#087b35}
#nitro{background:#0758bd}
.panel{display:none;position:absolute;z-index:5;top:50%;left:50%;transform:translate(-50%,-50%);width:280px;background:#17221c;color:white;padding:20px;border:4px solid #555;border-radius:22px;text-align:center}
.panel button{width:100%;height:45px;margin-top:12px}
#mapCanvas{width:230px;height:230px;background:#397d35}
</style>
</head>
<body>

<div id="title">LAGOS LIFE 3D</div>
<div id="info">
 MODE: <span id="mode">WALKING</span><br>
 MONEY: ₦50,000<br>
 SPEED: <span id="speed">0</span> KM/H
</div>

<button id="phone" onclick="showPanel('phonePanel')">📱 PHONE</button>
<button id="map" onclick="showMap()">🗺️ MAP</button>
<button id="switch" onclick="switchVehicle()">ENTER CAR</button>

<div id="phonePanel" class="panel">
<h2>📱 MY PHONE</h2>
<h3>WALLET</h3>
<h2 style="color:#00ff85">₦50,000</h2>
<p>LAGOS LIFE MOBILE</p>
<button onclick="hidePanels()">CLOSE</button>
</div>

<div id="mapPanel" class="panel">
<h3>🗺️ LAGOS CITY MAP</h3>
<canvas id="mapCanvas" width="230" height="230"></canvas>
<button onclick="hidePanels()">CLOSE MAP</button>
</div>

<div id="controls">
 <div class="group">
  <button class="control" id="left">◀</button>
  <button class="control" id="right">▶</button>
 </div>
 <div class="group">
  <button class="control" id="back">▼</button>
  <button class="control" id="forward">▲</button>
  <button class="control" id="nitro">N₂</button>
  <button id="go">GO</button>
 </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,45,190);

const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x555555,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-20,40,20);
scene.add(sun);

const ground=new THREE.Mesh(
new THREE.PlaneGeometry(400,500),
new THREE.MeshLambertMaterial({color:0x43833b}));
ground.rotation.x=-Math.PI/2;
ground.position.y=-.15;
scene.add(ground);

// Roads
function makeRoad(x,z,w,d){
const road=new THREE.Mesh(
new THREE.PlaneGeometry(w,d),
new THREE.MeshLambertMaterial({color:0x303030}));
road.rotation.x=-Math.PI/2;
road.position.set(x,0,z);
scene.add(road);
}
makeRoad(0,0,16,500);
makeRoad(0,-65,300,12);
makeRoad(0,65,300,12);

// Road markings
for(let z=-240;z<250;z+=12){
const mark=new THREE.Mesh(
new THREE.BoxGeometry(.25,.04,5),
new THREE.MeshBasicMaterial({color:0xffffff}));
mark.position.set(0,.04,z);
scene.add(mark);
}

// City buildings
for(let i=0;i<55;i++){
const side=i%2===0?-1:1;
const h=8+Math.random()*20;
const w=5+Math.random()*5;
const building=new THREE.Mesh(
new THREE.BoxGeometry(w,h,8),
new THREE.MeshLambertMaterial({
color:[0xd6b58b,0xb5b5b5,0xe4d8bd,0x9eacb5][i%4]
}));
building.position.set(side*(15+Math.random()*14),h/2,-230+i*8);
scene.add(building);
}

// Houses
function makeHouse(x,z){
const house=new THREE.Group();
const wall=new THREE.Mesh(
new THREE.BoxGeometry(9,5,8),
new THREE.MeshLambertMaterial({color:0xe5d1ad}));
wall.position.y=2.5;
house.add(wall);

const roof=new THREE.Mesh(
new THREE.ConeGeometry(7,3,4),
new THREE.MeshLambertMaterial({color:0x9c2929}));
roof.position.y=6.5;
roof.rotation.y=Math.PI/4;
house.add(roof);

const door=new THREE.Mesh(
new THREE.BoxGeometry(1.5,2.8,.15),
new THREE.MeshLambertMaterial({color:0x55301c}));
door.position.set(0,1.4,4.05);
house.add(door);

for(const wx of [-2.5,2.5]){
const win=new THREE.Mesh(
new THREE.BoxGeometry(1.5,1.5,.15),
new THREE.MeshBasicMaterial({color:0x55bbee}));
win.position.set(wx,3,4.05);
house.add(win);
}
house.position.set(x,0,z);
scene.add(house);
}
for(let i=0;i<10;i++){
makeHouse(-30,-200+i*35);
makeHouse(30,-200+i*35);
}

// Player
const player=new THREE.Group();
const skin=new THREE.MeshStandardMaterial({color:0xb97848});
const shirt=new THREE.MeshStandardMaterial({color:0x1665d8});
const pants=new THREE.MeshStandardMaterial({color:0x222b44});

const torso=new THREE.Mesh(new THREE.BoxGeometry(.8,1.1,.45),shirt);
torso.position.y=1.35;
player.add(torso);

const head=new THREE.Mesh(new THREE.SphereGeometry(.28,16,16),skin);
head.position.y=2.1;
player.add(head);

const legs=[];
for(const x of [-.22,.22]){
const leg=new THREE.Mesh(new THREE.BoxGeometry(.28,.8,.3),pants);
leg.position.set(x,.4,0);
player.add(leg);
legs.push(leg);
}
player.position.set(2,0,0);
scene.add(player);

// Bugatti
const car=new THREE.Group();
const blue=new THREE.MeshStandardMaterial({color:0x0649ff,metalness:.65,roughness:.25});
const black=new THREE.MeshStandardMaterial({color:0x111111});
const glass=new THREE.MeshStandardMaterial({color:0x17283e});

const body=new THREE.Mesh(new THREE.BoxGeometry(2.3,.65,4.5),blue);
body.position.y=.8;
car.add(body);

const roof=new THREE.Mesh(new THREE.BoxGeometry(1.8,.65,2),glass);
roof.position.set(0,1.35,.15);
car.add(roof);

const wheels=[];
for(const x of [-1.15,1.15]){
for(const z of [-1.4,1.4]){
const wheel=new THREE.Mesh(
new THREE.CylinderGeometry(.43,.43,.3,20),black);
wheel.rotation.z=Math.PI/2;
wheel.position.set(x,.45,z);
car.add(wheel);
wheels.push(wheel);
}
}
car.position.set(0,0,0);
scene.add(car);

// Game state
let driving=false;
let speed=0;
const keys={left:false,right:false,forward:false,back:false,gas:false,nitro:false};

function bind(id,key){
const b=document.getElementById(id);
b.addEventListener("pointerdown",e=>{e.preventDefault();keys[key]=true});
const release=()=>keys[key]=false;
b.addEventListener("pointerup",release);
b.addEventListener("pointerleave",release);
b.addEventListener("pointercancel",release);
}
bind("left","left");
bind("right","right");
bind("forward","forward");
bind("back","back");
bind("go","gas");
bind("nitro","nitro");

function switchVehicle(){
if(!driving){
const distance=player.position.distanceTo(car.position);
if(distance>4){
alert("Walk closer to your Bugatti first!");
return;
}
driving=true;
player.visible=false;
car.visible=true;
}else{
driving=false;
player.visible=true;
player.position.set(car.position.x+2,0,car.position.z);
speed=0;
}
document.getElementById("mode").innerText=driving?"DRIVING":"WALKING";
document.getElementById("switch").innerText=driving?"EXIT CAR":"ENTER CAR";
}

function showPanel(id){
document.getElementById(id).style.display="block";
}
function hidePanels(){
document.querySelectorAll(".panel").forEach(p=>p.style.display="none");
}
function showMap(){
showPanel("mapPanel");
drawMap();
}
function drawMap(){
const c=document.getElementById("mapCanvas");
const ctx=c.getContext("2d");
ctx.fillStyle="#43833b";
ctx.fillRect(0,0,230,230);
ctx.fillStyle="#333";
ctx.fillRect(100,0,30,230);
ctx.fillRect(0,100,230,30);
ctx.fillStyle="#e5c18a";
for(let i=0;i<4;i++){
ctx.fillRect(35,15+i*50,20,18);
ctx.fillRect(175,15+i*50,20,18);
}
const obj=driving?car:player;
ctx.fillStyle="#ff3333";
ctx.beginPath();
ctx.arc(115+obj.position.x*2,115,7,0,Math.PI*2);
ctx.fill();
ctx.fillStyle="white";
ctx.font="11px Arial";
ctx.fillText("YOU",125,115);
}

// Keyboard controls
window.addEventListener("keydown",e=>{
if(e.key==="ArrowLeft"||e.key==="a")keys.left=true;
if(e.key==="ArrowRight"||e.key==="d")keys.right=true;
if(e.key==="ArrowUp"||e.key==="w")keys.forward=true,keys.gas=true;
if(e.key==="ArrowDown"||e.key==="s")keys.back=true;
if(e.key==="Shift")keys.nitro=true;
});
window.addEventListener("keyup",e=>{
if(e.key==="ArrowLeft"||e.key==="a")keys.left=false;
if(e.key==="ArrowRight"||e.key==="d")keys.right=false;
if(e.key==="ArrowUp"||e.key==="w")keys.forward=false,keys.gas=false;
if(e.key==="ArrowDown"||e.key==="s")keys.back=false;
if(e.key==="Shift")keys.nitro=false;
});

function animate(){
requestAnimationFrame(animate);

if(driving){
const max=keys.nitro?2:1;
if(keys.gas)speed=Math.min(speed+.025,max);
else speed=Math.max(speed-.018,0);

if(keys.left)car.rotation.y+=.025;
if(keys.right)car.rotation.y-=.025;

car.translateZ(-speed);
wheels.forEach(w=>w.rotation.x-=speed*.15);

}else{
let moving=false;
if(keys.forward){
player.translateZ(-.13);
moving=true;
}
if(keys.back){
player.translateZ(.13);
moving=true;
}
if(keys.left)player.rotation.y+=.045;
if(keys.right)player.rotation.y-=.045;
legs.forEach((leg,i)=>leg.rotation.x=moving?Math.sin(Date.now()*.012+i*Math.PI)*.45:0);
speed=0;
}

const target=driving?car:player;
const offset=driving?9:7;
const height=driving?5:4;
const behind=new THREE.Vector3(0,height,offset);
behind.applyAxisAngle(new THREE.Vector3(0,1,0),target.rotation.y);
camera.position.copy(target.position).add(behind);
camera.lookAt(target.position.x,target.position.y+1,target.position.z);

document.getElementById("speed").innerText=Math.round(speed*100);
renderer.render(scene,camera);
}

camera.position.set(0,5,10);
animate();

window.addEventListener("resize",()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
