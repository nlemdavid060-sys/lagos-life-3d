
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LAGOS LIFE 3D ULTIMATE</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#80c9ec;font-family:Arial;color:white}
canvas{display:block}
button{border:1px solid #bd9545;background:#102c46;color:white;border-radius:10px;padding:10px;font-weight:bold}
button:active{background:#bd9545;color:#071b30}
#hud{position:absolute;top:8px;left:8px;background:#071b30ed;border:1px solid #bd9545;border-radius:12px;padding:10px;z-index:5}
#hud h2{color:#f4cc70;margin:0 0 7px;font-size:16px}
#hud p{font-size:11px;margin:5px 0}
#top{position:absolute;right:8px;top:8px;display:grid;gap:5px;z-index:5}
#controls{position:absolute;bottom:14px;left:8px;display:grid;grid-template-columns:50px 50px 50px;gap:5px;z-index:5}
#controls button{height:50px;padding:0;font-size:20px}
#actions{position:absolute;bottom:18px;right:8px;display:grid;gap:6px;z-index:5}
#actions button{background:#12523f}
#message{position:absolute;bottom:110px;left:50%;transform:translateX(-50%);background:#071b30ed;border:1px solid #bd9545;border-radius:10px;padding:9px;z-index:5;font-size:12px;text-align:center;max-width:90%}
#panel{display:none;position:absolute;inset:4%;z-index:20;background:#071b30fa;border:2px solid #bd9545;border-radius:16px;padding:14px;overflow:auto;text-align:center}
#panel h2{color:#f4cc70;margin:4px}
#balance{color:#79e8a8}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.item{background:#12344f;border:1px solid #345b76;border-radius:11px;padding:10px;font-size:12px}
.item button{width:100%;margin-top:7px;background:#08764d}
#panelContent{margin-top:10px}
#close{width:100%;background:#8b2635;margin-top:12px}
.small{font-size:11px;color:#cbd8e5}
@media(max-width:370px){#hud{padding:7px}#hud h2{font-size:13px}#hud p{font-size:10px}}
</style>
</head>
<body>

<div id="hud">
<h2>👑 LAGOS LIFE 3D</h2>
<p>💰 <span id="money">₦1,000,000,000,000</span></p>
<p id="mode">🚶 WALKING</p>
<p id="speed">SPEED: 0 KM/H</p>
<p id="fuel">⛽ FUEL: 100%</p>
<p id="location">📍 LAGOS</p>
</div>

<div id="top">
<button onclick="openPanel('states')">🇳🇬 STATES</button>
<button onclick="openPanel('airport')">✈️ AIRPORT</button>
<button onclick="openPanel('hotel')">🏨 HOTEL</button>
<button onclick="openPanel('invest')">📈 INVEST</button>
<button onclick="openPanel('shop')">🛍️ SHOP</button>
<button onclick="openPanel('garage')">🚘 GARAGE</button>
<button onclick="openPanel('missions')">🎯 MISSIONS</button>
<button onclick="toggleNight()">🌙 DAY/NIGHT</button>
</div>

<div id="controls">
<div></div><button data-key="up">⬆️</button><div></div>
<button data-key="left">⬅️</button>
<button data-key="down">⬇️</button>
<button data-key="right">➡️</button>
</div>

<div id="actions">
<button onclick="toggleCar()">🚗 ENTER / EXIT</button>
<button onclick="jump()">⬆️ JUMP</button>
</div>

<div id="message">Welcome to Nigeria! Your adventure begins.</div>

<div id="panel">
<h2 id="panelTitle">ULTIMATE CITY</h2>
<h3 id="balance">₦1,000,000,000,000</h3>
<div id="panelContent"></div>
<button id="close" onclick="closePanel()">CLOSE ✖</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){

if(!window.THREE){
document.getElementById("message").textContent="Game failed to load. Check your internet connection.";
return;
}

// SAVE DATA AND FIRST-TIME UPGRADE
const SAVE_KEY="lagosLifeUltimateSave";
let saved={};
try{saved=JSON.parse(localStorage.getItem(SAVE_KEY)||"{}")||{};}catch(e){}

const oldVersion=saved.version||0;
let money=oldVersion<2?1000000000000:(saved.money??1000000000000);
let owned=saved.owned||[];
let completed=saved.completed||[];
let investments=saved.investments||[];
let hotelNights=saved.hotelNights||0;
let fuel=100;
let locationName=saved.locationName||"Lagos";
let driving=false;
let night=false;
let speed=0;
let selectedCar=saved.selectedCar||"Bugatti";

function save(){
try{
localStorage.setItem(SAVE_KEY,JSON.stringify({
version:2,money,owned,completed,investments,
hotelNights,locationName,selectedCar
}));
}catch(e){}
}

function cash(n){return "₦"+Math.floor(n).toLocaleString("en-NG");}
function say(t){document.getElementById("message").textContent=t;}

function updateHUD(){
document.getElementById("money").textContent=cash(money);
document.getElementById("balance").textContent=cash(money);
document.getElementById("fuel").textContent="⛽ FUEL: "+Math.floor(fuel)+"%";
document.getElementById("location").textContent="📍 "+locationName.toUpperCase();
}

updateHUD();
save();

// DESTINATIONS
const destinations=[
{name:"Lagos",city:"Victoria Island",cost:0,color:0x80c9ec},
{name:"Ogun",city:"Abeokuta",cost:500000,color:0x93c9a3},
{name:"Oyo",city:"Ibadan",cost:700000,color:0xe6c58e},
{name:"Rivers",city:"Port Harcourt",cost:1200000,color:0x8dc5d7},
{name:"Kano",city:"Kano City",cost:1500000,color:0xe7c18b},
{name:"Enugu",city:"Enugu City",cost:1000000,color:0x99c58e},
{name:"Delta",city:"Asaba",cost:900000,color:0x9ac6bd},
{name:"Kaduna",city:"Kaduna City",cost:1300000,color:0xd3c18c},
{name:"Abuja FCT",city:"Central Abuja",cost:1800000,color:0xa6c8e5}
];

// THREE.JS WORLD
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x80c9ec);
scene.fog=new THREE.Fog(0x80c9ec,100,320);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.outputEncoding=THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x526044,1.5));
const sun=new THREE.DirectionalLight(0xffffff,1.4);
sun.position.set(-40,80,40);
sun.castShadow=true;
scene.add(sun);

function mat(c,r=0.8){
return new THREE.MeshStandardMaterial({color:c,roughness:r});
}

function block(w,h,d,m,x,y,z){
const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
o.position.set(x,y,z);
o.castShadow=true;
o.receiveShadow=true;
scene.add(o);
return o;
}

// GROUND AND ROADS
block(500,1,500,mat(0x38844a),0,-0.7,0);
block(20,0.15,450,mat(0x292d32),0,0,0);
block(450,0.15,20,mat(0x292d32),0,0,0);

for(let z=-220;z<220;z+=16)
block(0.3,0.03,6,mat(0xffffff),0,0.1,z);
for(let x=-220;x<220;x+=16)
block(6,0.03,0.3,mat(0xffffff),x,0.1,0);

// BUILDINGS
const colors=[0xe3d8c5,0xbacbdb,0xc6b9a8,0x8b9baa,0xd9d9d9];
for(let i=0;i<75;i++){
let x=(Math.random()-0.5)*230;
let z=(Math.random()-0.5)*230;
if(Math.abs(x)<17||Math.abs(z)<17)continue;
let h=12+Math.random()*30;
let w=8+Math.random()*12;
let d=8+Math.random()*12;
block(w,h,d,mat(colors[i%5]),x,h/2,z);
}

// PALM TREES
function palm(x,z){
block(0.5,7,0.5,mat(0x79502d),x,3.5,z);
for(let i=0;i<6;i++){
let leaf=block(0.8,0.2,5,mat(0x12823b),x,7,z);
leaf.rotation.y=i*Math.PI/3;
}
}
for(let z=-200;z<210;z+=30){
palm(-16,z);palm(16,z);
}

// HOTEL
block(24,22,20,mat(0xe0d4c3),55,11,-35);
block(26,1,22,mat(0x454b58),55,22,-35);
for(let y=3;y<20;y+=4){
for(let x=47;x<=63;x+=5){
block(2,2,0.2,mat(0x6bb9d8),x,y,-24.8);
}
}
block(8,5,0.5,mat(0x5b3924),55,2.5,-24.5);

// AIRPORT
block(40,8,24,mat(0xcbd6df),-65,4,-50);
block(42,0.5,26,mat(0x59626e),-65,8,-50);
block(65,0.2,15,mat(0x30343a),-65,0.1,-90);
block(35,0.2,12,mat(0x30343a),-65,0.1,-110);
block(0.5,0.3,9,mat(0xffffff),-65,0.3,-90);

// AIRCRAFT
const plane=new THREE.Group();
const planeMat=mat(0xf1f1f1);
const fuselage=new THREE.Mesh(new THREE.BoxGeometry(2,2,15),planeMat);
plane.add(fuselage);
const wings=new THREE.Mesh(new THREE.BoxGeometry(18,0.3,3),planeMat);
plane.add(wings);
const tail=new THREE.Mesh(new THREE.BoxGeometry(7,0.3,2),planeMat);
tail.position.z=6;
plane.add(tail);
scene.add(plane);
plane.position.set(-65,5,-70);

// PLAYER
const player=new THREE.Group();
const blue=mat(0x075bd1);
const black=mat(0x171717);
const torso=new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.7,1.6,12),blue);
torso.position.y=1.5;
player.add(torso);
const head=new THREE.Mesh(new THREE.SphereGeometry(0.45,16,12),mat(0x895c3d));
head.position.y=2.65;
player.add(head);
const hair=new THREE.Mesh(new THREE.SphereGeometry(0.47,16,8,0,Math.PI*2,0,Math.PI/2),black);
hair.position.y=2.85;
player.add(hair);
const legs=[];
for(let side of [-1,1]){
const leg=new THREE.Mesh(new THREE.BoxGeometry(0.35,0.9,0.4),black);
leg.position.set(side*0.3,0.45,0);
player.add(leg);legs.push(leg);
}
scene.add(player);
player.position.set(0,0,25);

// CARS
const cars={};
function makeCar(name,color){
const g=new THREE.Group();
const paint=mat(color,0.25);
const body=new THREE.Mesh(new THREE.BoxGeometry(4,1,7),paint);
body.position.y=1;g.add(body);
const cabin=new THREE.Mesh(new THREE.BoxGeometry(3,1.1,3),mat(0x69b8d8,0.25));
cabin.position.y=2;g.add(cabin);
for(let x of [-2,2])for(let z of [-2.2,2.2]){
const wheel=new THREE.Mesh(new THREE.CylinderGeometry(0.65,0.65,0.4,16),black);
wheel.rotation.z=Math.PI/2;
wheel.position.set(x,0.65,z);g.add(wheel);
}
g.visible=false;scene.add(g);cars[name]=g;
}
makeCar("Bugatti",0x004cff);
makeCar("Mercedes",0xaaaaaa);
makeCar("Lamborghini",0xffb400);
makeCar("Ferrari",0xc90024);
let car=cars.Bugatti;
car.visible=true;
car.position.set(7,0,20);
if(cars[selectedCar]){car.visible=false;car=cars[selectedCar];car.visible=true;}

// DANFO TRAFFIC
const buses=[];
for(let i=0;i<4;i++){
const bus=new THREE.Group();
const body=new THREE.Mesh(new THREE.BoxGeometry(3,2,6),mat(0xffc400));
body.position.y=1;bus.add(body);scene.add(bus);
bus.position.set(4,0,-i*40-30);buses.push(bus);
}

// PANEL SYSTEM
function openPanel(type){
const panel=document.getElementById("panel");
panel.style.display="block";
updateHUD();
const title=document.getElementById("panelTitle");
const content=document.getElementById("panelContent");

if(type==="states"){
title.textContent="🇳🇬 EXPLORE NIGERIA";
content.innerHTML='<p class="small">Choose a destination to travel around Nigeria.</p><div class="grid">'+
destinations.map((d,i)=>'<div class="item"><b>📍 '+d.name+'</b><p>'+d.city+'</p><p>Ticket: '+cash(d.cost)+'</p><button onclick="travel('+i+')">TRAVEL</button></div>').join("")+'</div>';
}

if(type==="airport"){
title.textContent="✈️ INTERNATIONAL AIRPORT";
content.innerHTML='<div class="item"><h3>Welcome to Lagos Airport</h3><p>Flights to Nigerian destinations.</p><p>Choose STATES to see destinations and ticket prices.</p><button onclick="openPanel(\\'states\\')">VIEW FLIGHTS</button></div>';
}

if(type==="hotel"){
title.textContent="🏨 LUXURY HOTEL";
content.innerHTML='<div class="item"><h3>THE LAGOS GRAND HOTEL</h3><p>Luxury room with swimming pool access.</p><p>Room price: ₦2,000,000 per night</p><p>Nights booked: '+hotelNights+'</p><button onclick="bookHotel()">BOOK A NIGHT</button></div>';
}

if(type==="invest"){
title.textContent="📈 INVESTMENT CENTRE";
content.innerHTML='<p class="small">All investments and returns are virtual game money.</p><div class="grid">'+
'<div class="item"><b>🏢 Small Business</b><p>Cost ₦10M</p><p>Return ₦12M</p><button onclick="invest(10000000,12000000,\\'Small Business\\')">INVEST</button></div>'+
'<div class="item"><b>🏬 Shopping Mall</b><p>Cost ₦50M</p><p>Return ₦60M</p><button onclick="invest(50000000,60000000,\\'Shopping Mall\\')">INVEST</button></div>'+
'<div class="item"><b>🏨 Hotel Business</b><p>Cost ₦100M</p><p>Return ₦125M</p><button onclick="invest(100000000,125000000,\\'Hotel Business\\')">INVEST</button></div>'+
'<div class="item"><b>🏭 Factory</b><p>Cost ₦200M</p><p>Return ₦250M</p><button onclick="invest(200000000,250000000,\\'Factory\\')">INVEST</button></div>'+
'</div><div class="item"><b>YOUR INVESTMENTS</b><div id="investmentList"></div></div>';
renderInvestments();
}

if(type==="shop"){
title.textContent="🛍️ PREMIUM SHOP";
const products=[
["Designer Clothes",5000000],
["Food",50000],
["Fuel",100000],
["Luxury Furniture",8000000],
["Golden Watch",15000000]
];
content.innerHTML='<div class="grid">'+products.map((p,i)=>
'<div class="item"><b>'+p[0]+'</b><p>'+cash(p[1])+'</p><button onclick="buyShopItem('+i+')">BUY</button></div>'
).join("")+'</div>';
}

if(type==="garage"){
title.textContent="🚘 LUXURY GARAGE";
const list=[
["Bugatti",300000000],
["Mercedes",150000000],
["Lamborghini",250000000],
["Ferrari",200000000]
];
content.innerHTML='<div class="grid">'+list.map((c,i)=>
'<div class="item"><b>🚗 '+c[0]+'</b><p>'+cash(c[1])+'</p><p>'+(owned.includes(c[0])?"OWNED":"LOCKED")+'</p><button onclick="buyCar('+i+')">'+(owned.includes(c[0])?"SELECT":"BUY")+'</button></div>'
).join("")+'</div>';
}

if(type==="missions"){
title.textContent="🎯 CITY MISSIONS";
const missions=[
["Explore Nigeria",1000000],
["Visit the airport",2000000],
["Visit the hotel",3000000],
["Drive your car",5000000]
];
content.innerHTML='<div class="grid">'+missions.map((m,i)=>
'<div class="item"><b>'+m[0]+'</b><p>Reward '+cash(m[1])+'</p><button onclick="claimMission('+i+')">'+(completed.includes(i)?"COMPLETED":"CLAIM")+'</button></div>'
).join("")+'</div>';
}
}

window.openPanel=openPanel;
window.closePanel=function(){document.getElementById("panel").style.display="none";};

// TRAVEL
window.travel=function(i){
const d=destinations[i];
if(money<d.cost){say("You don't have enough money for this ticket.");return;}
money-=d.cost;
locationName=d.name;
player.position.set(0,0,25);
if(driving){driving=false;player.visible=true;}
car.position.set(7,0,20);
save();updateHUD();
closePanel();
say("Welcome to "+d.city+", "+d.name+"!");
scene.background=new THREE.Color(d.color);
scene.fog.color.copy(scene.background);
};

// HOTEL
window.bookHotel=function(){
const price=2000000;
if(money<price){say("Not enough money for the hotel.");return;}
money-=price;
hotelNights++;
save();updateHUD();
say("Hotel room booked! Enjoy your stay.");
openPanel("hotel");
};

// INVESTMENTS
window.invest=function(cost,returns,name){
if(money<cost){say("Not enough money to invest.");return;}
money-=cost;
investments.push({name,returns,claimed:false});
save();updateHUD();
say("You invested in "+name+".");
openPanel("invest");
};

function renderInvestments(){
const el=document.getElementById("investmentList");
if(!el)return;
el.innerHTML=investments.length?
investments.map((v,i)=>'<p>'+v.name+' — Return '+cash(v.returns)+' <button onclick="collectInvestment('+i+')">'+(v.claimed?"COLLECTED":"COLLECT RETURN")+'</button></p>').join("")
:"<p>No investments yet.</p>";
}

window.collectInvestment=function(i){
const v=investments[i];
if(!v||v.claimed){say("Return already collected.");return;}
v.claimed=true;
money+=v.returns;
save();updateHUD();renderInvestments();
say("Investment return collected: "+cash(v.returns));
};

// SHOP
window.buyShopItem=function(i){
const items=[
["Designer Clothes",5000000],
["Food",50000],
["Fuel",100000],
["Luxury Furniture",8000000],
["Golden Watch",15000000]
];
const p=items[i];
if(money<p[1]){say("Not enough money!");return;}
money-=p[1];
if(p[0]==="Fuel")fuel=100;
else owned.push(p[0]);
save();updateHUD();say("Purchased "+p[0]+"!");
};

window.buyCar=function(i){
const list=[
["Bugatti",300000000],
["Mercedes",150000000],
["Lamborghini",250000000],
["Ferrari",200000000]
];
const c=list[i];
if(!owned.includes(c[0])){
if(money<c[1]){say("Not enough money!");return;}
money-=c[1];owned.push(c[0]);
}
selectedCar=c[0];
Object.values(cars).forEach(v=>v.visible=false);
car=cars[c[0]];
car.visible=true;
car.position.set(7,0,20);
save();updateHUD();
say(c[0]+" is ready in your garage!");
openPanel("garage");
};

// MISSIONS
window.claimMission=function(i){
if(completed.includes(i)){say("Already completed.");return;}
const target=player.position;
if(i===0&&locationName==="Lagos"){say("Travel to another state first.");return;}
if(i===1&&target.distanceTo(new THREE.Vector3(-65,0,-50))>25){say("Visit the airport first.");return;}
if(i===2&&target.distanceTo(new THREE.Vector3(55,0,-35))>30){say("Visit the hotel first.");return;}
if(i===3&&!driving){say("Enter your car first.");return;}
const rewards=[1000000,2000000,3000000,5000000];
completed.push(i);money+=rewards[i];
save();updateHUD();say("Mission completed! You earned "+cash(rewards[i]));
openPanel("missions");
};

// MOVEMENT
const keys={up:false,down:false,left:false,right:false};
document.querySelectorAll("[data-key]").forEach(btn=>{
const dir=btn.dataset.key;
btn.addEventListener("pointerdown",e=>{e.preventDefault();keys[dir]=true;});
["pointerup","pointerleave","pointercancel"].forEach(ev=>btn.addEventListener(ev,()=>keys[dir]=false));
});
window.addEventListener("keydown",e=>{
if(e.key==="ArrowUp"||e.key==="w")keys.up=true;
if(e.key==="ArrowDown"||e.key==="s")keys.down=true;
if(e.key==="ArrowLeft"||e.key==="a")keys.left=true;
if(e.key==="ArrowRight"||e.key==="d")keys.right=true;
});
window.addEventListener("keyup",e=>{
if(e.key==="ArrowUp"||e.key==="w")keys.up=false;
if(e.key==="ArrowDown"||e.key==="s")keys.down=false;
if(e.key==="ArrowLeft"||e.key==="a")keys.left=false;
if(e.key==="ArrowRight"||e.key==="d")keys.right=false;
});

window.toggleCar=function(){
if(!driving&&player.position.distanceTo(car.position)<12){
driving=true;player.visible=false;say("You entered your "+selectedCar+"!");
}else if(driving){
driving=false;player.visible=true;
player.position.copy(car.position);player.position.x+=5;
say("You left your car!");
}else say("Walk closer to your car first.");
document.getElementById("mode").textContent=driving?"🚗 DRIVING":"🚶 WALKING";
};

window.jump=function(){
if(!driving){player.position.y=2.5;setTimeout(()=>player.position.y=0,350);}
};

window.toggleNight=function(){
night=!night;
scene.background=new THREE.Color(night?0x10172c:0x80c9ec);
scene.fog.color.copy(scene.background);
sun.intensity=night?0.25:1.4;
say(night?"Night time!":"Daytime!");
};

// GAME LOOP
function animate(){
requestAnimationFrame(animate);
if(driving){
speed=fuel>0?(keys.up?0.55:keys.down?-0.3:0):0;
if(speed!==0)fuel=Math.max(0,fuel-0.003);
if(keys.left)car.rotation.y+=0.035;
if(keys.right)car.rotation.y-=0.035;
car.translateZ(-speed);
}else{
speed=keys.up?0.35:keys.down?-0.35:0;
if(keys.left)player.rotation.y+=0.045;
if(keys.right)player.rotation.y-=0.045;
player.translateZ(-speed);
legs.forEach((leg,i)=>leg.rotation.x=speed?Math.sin(Date.now()*0.012+i*3)*0.4:0);
}

buses.forEach(bus=>{
bus.position.z+=0.2;
if(bus.position.z>100)bus.position.z=-180;
});

const target=driving?car:player;
const offset=new THREE.Vector3(0,8,14);
offset.applyAxisAngle(new THREE.Vector3(0,1,0),target.rotation.y);
camera.position.lerp(target.position.clone().add(offset),0.08);
camera.lookAt(target.position.x,target.position.y+1,target.position.z);

document.getElementById("speed").textContent="SPEED: "+Math.round(Math.abs(speed)*100)+" KM/H";
document.getElementById("fuel").textContent="⛽ FUEL: "+Math.floor(fuel)+"%";
renderer.render(scene,camera);
}

camera.position.set(0,10,40);
animate();

window.addEventListener("resize",()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});

})();
</script>
</body>
</html>
