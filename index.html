
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1,user-scalable=no">
<title>LAGOS LIFE 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#82b9d8;font-family:Arial}
canvas{display:block}
#top{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;z-index:5;pointer-events:none}
.panel{background:#101a24dd;color:white;padding:9px 12px;border-radius:12px;font-size:12px}
#money{color:#69ff9b;font-weight:bold}
#menu{display:none;position:fixed;z-index:10;top:55px;left:50%;transform:translateX(-50%);width:92%;max-width:360px;max-height:72vh;overflow:auto;background:#101a24f5;color:white;border-radius:15px;padding:14px}
#menu h2{color:#69ffac;font-size:20px}
#menu button{display:block;width:100%;padding:12px;margin:7px 0;border:0;border-radius:9px;background:#245d83;color:white;font-weight:bold}
#menu button:disabled{opacity:.5}
#close{background:#a33232!important}
#controls{position:fixed;z-index:6;bottom:12px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
.pad{display:grid;grid-template-columns:repeat(3,47px);grid-template-rows:repeat(2,43px);gap:4px;pointer-events:auto}
.ctrl{border:0;border-radius:12px;background:#101a24cc;color:white;font-size:18px;touch-action:none}
#actions{display:flex;flex-direction:column;gap:6px;pointer-events:auto}
#actions button{width:76px;height:39px;font-size:11px}
#hint{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:#101a24cc;color:white;padding:8px 12px;border-radius:10px;font-size:11px;white-space:nowrap;z-index:4}
</style>
</head>
<body>

<div id="top">
 <div class="panel">LAGOS LIFE 3D<br><span id="location">Lagos</span></div>
 <div class="panel">WALLET<br><span id="money">₦1,000,000,000,000</span></div>
</div>

<div id="menu"></div>
<div id="hint">Walk around Lagos and explore your city</div>

<div id="controls">
 <div class="pad">
  <button class="ctrl" style="grid-column:2" data-key="forward">▲</button>
  <button class="ctrl" data-key="left">◀</button>
  <button class="ctrl" data-key="back">▼</button>
  <button class="ctrl" data-key="right">▶</button>
 </div>
 <div id="actions">
  <button class="ctrl" id="enter">ENTER</button>
  <button class="ctrl" id="drive">DRIVE</button>
  <button class="ctrl" id="day">DAY/NIGHT</button>
  <button class="ctrl" id="jump">JUMP</button>
 </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){

if(!window.THREE){
 document.body.innerHTML='<div style="padding:25px;color:white">The 3D engine could not load. Check your internet connection and refresh.</div>';
 return;
}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8bc8ed);
scene.fog=new THREE.Fog(0x8bc8ed,100,260);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.3));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x52634c,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-40,80,30);
scene.add(sun);

function mat(c){return new THREE.MeshLambertMaterial({color:c})}

function cube(x,y,z,w,h,d,color,parent){
 const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));
 mesh.position.set(x,y,z);
 (parent||scene).add(mesh);
 return mesh;
}

// CITY
cube(0,-.3,0,300,.5,300,0x438a48);
for(let z=-100;z<=100;z+=50)cube(0,.01,z,300,.04,10,0x343b43);
for(let x=-100;x<=100;x+=50)cube(x,.02,0,10,.04,300,0x343b43);

function building(x,z,w,h,d,color){
 const g=new THREE.Group();
 g.position.set(x,0,z);
 scene.add(g);
 cube(0,h/2,0,w,h,d,color,g);
 for(let y=2;y<h-1;y+=3){
  for(let xx=-w/2+1;xx<w/2;xx+=3){
   cube(xx,y,d/2+.04,1.1,1.3,.08,0x8dd6ed,g);
  }
 }
 return g;
}

for(let i=0;i<28;i++){
 const x=(Math.random()-.5)*180;
 const z=(Math.random()-.5)*180;
 if(Math.abs(x)<25&&Math.abs(z)<25)continue;
 building(x,z,9,8+Math.random()*13,9,
 [0xd6b28a,0xd2d7df,0xe4c5a1,0xc8d8c8][i%4]);
}

// IMPORTANT LOCATIONS
building(-12,-18,20,17,17,0xe6d8b9); // Mansion
building(25,-25,17,25,13,0x8ab8d5); // Hotel
building(-35,25,24,13,18,0xd8dce5); // Airport
building(38,30,18,12,16,0xd9b76c); // Investment
building(-25,-45,13,9,12,0xd9a56e); // Clothes shop
building(20,45,22,10,17,0xc9a47d); // Dealership

// MANSION POOL
cube(-12,.12,-6,10,.18,5,0x16bde8);

// TREES
function tree(x,z){
 const g=new THREE.Group();
 g.position.set(x,0,z);
 scene.add(g);
 cube(0,2,0,.8,4,.8,0x754421,g);
 const crown=new THREE.Mesh(new THREE.SphereGeometry(2.5,7,6),mat(0x16843d));
 crown.position.y=5;
 g.add(crown);
}
for(let i=0;i<32;i++){
 tree((Math.random()-.5)*170,(Math.random()-.5)*170);
}

// PLAYER
const player=new THREE.Group();
scene.add(player);
const body=cube(0,1.4,0,1,1.5,.55,0x2255cc,player);
const head=new THREE.Mesh(new THREE.SphereGeometry(.42,10,8),mat(0xc88a61));
head.position.y=2.45;
player.add(head);
player.position.set(0,0,5);

// CAR CATALOGUE
const catalogue=[
 {name:"Bugatti Chiron",price:0,color:0x092b80},
 {name:"Lamborghini Aventador",price:180000000,color:0xd2c900},
 {name:"Ferrari 488",price:150000000,color:0xaa1111},
 {name:"McLaren 720S",price:170000000,color:0xff7b18},
 {name:"Porsche 911",price:95000000,color:0xffffff},
 {name:"Nissan GT-R",price:75000000,color:0x222222},
 {name:"Audi R8",price:110000000,color:0x13a5a5},
 {name:"Chevrolet Corvette",price:85000000,color:0x8c1830},
 {name:"Mercedes-AMG GT",price:125000000,color:0xaaaaaa}
];

function createCar(data,x,z){
 const g=new THREE.Group();
 g.position.set(x,0,z);
 scene.add(g);
 cube(0,.65,0,4,.8,7,data.color,g);
 cube(0,1.35,-.5,3,1.1,3.3,0x8ed3ed,g);
 cube(0,.38,3.35,2,.3,.25,0xffffff,g);
 for(const xx of [-1.8,1.8]){
  for(const zz of [-2.2,2.2]){
   const wheel=new THREE.Mesh(
    new THREE.CylinderGeometry(.65,.65,.35,10),
    mat(0x171717)
   );
   wheel.rotation.z=Math.PI/2;
   wheel.position.set(xx,.55,zz);
   g.add(wheel);
  }
 }
 return g;
}

const cars=[];
catalogue.forEach((data,i)=>{
 cars.push(createCar(data,27+(i%3)*7,37+Math.floor(i/3)*10));
});

// DANFO BUSES
const danfos=[];
for(let i=0;i<4;i++){
 danfos.push(createCar({color:0xe9b923},-30+i*12,70));
}

// AIRPLANE
const plane=new THREE.Group();
scene.add(plane);
cube(0,0,0,2,1,8,0xffffff,plane);
cube(0,0,0,18,.18,2,0xffffff,plane);
plane.position.set(-70,35,-65);

// SAVED GAME
let money=1000000000000;
let owned=[0];
let selected=0;
let completed={};
let destination="Lagos";

try{
 const old=JSON.parse(localStorage.getItem("lagosFastSave")||"{}");
 const newer=JSON.parse(localStorage.getItem("lagosSuperSave")||"{}");
 const saved=Object.keys(newer).length?newer:old;
 if(saved.money!==undefined)money=saved.money;
 if(Array.isArray(saved.owned))owned=saved.owned;
 if(saved.selected!==undefined)selected=saved.selected;
 if(saved.completed)completed=saved.completed;
}catch(e){}

if(!owned.includes(0))owned.push(0);
if(!owned.includes(selected))selected=0;

function save(){
 try{
  localStorage.setItem("lagosFastSave",JSON.stringify({
   money:money,owned:owned,selected:selected,completed:completed
  }));
 }catch(e){}
}

function wallet(){
 document.getElementById("money").textContent="₦"+money.toLocaleString("en-NG");
 save();
}
wallet();

// MENUS
const menu=document.getElementById("menu");

function closeMenu(){
 menu.style.display="none";
}

function openMenu(title,items){
 menu.innerHTML="";
 const h=document.createElement("h2");
 h.textContent=title;
 menu.appendChild(h);

 items.forEach(item=>{
  const b=document.createElement("button");
  b.textContent=item.label;
  b.disabled=!!item.disabled;
  b.onclick=item.action;
  menu.appendChild(b);
 });

 const close=document.createElement("button");
 close.id="close";
 close.textContent="CLOSE";
 close.onclick=closeMenu;
 menu.appendChild(close);
 menu.style.display="block";
}

function notice(text){
 openMenu("LAGOS LIFE 3D",[
  {label:text,action:closeMenu}
 ]);
}

// DEALERSHIP
function dealership(){
 const items=catalogue.map((car,i)=>{
  const has=owned.includes(i);
  let label=car.name+" — ";
  if(has){
   label+=selected===i?"SELECTED — USE CAR":"OWNED — SELECT";
  }else{
   label+="BUY ₦"+car.price.toLocaleString("en-NG");
  }

  return {
   label:label,
   action:function(){
    if(has){
     selected=i;
     closeMenu();
     notice(car.name+" selected! Tap DRIVE to use it.");
     save();
     return;
    }

    if(money<car.price){
     notice("You don't have enough game money.");
     return;
    }

    money-=car.price;
    owned.push(i);
    selected=i;
    wallet();
    closeMenu();
    notice("You bought the "+car.name+"!");
   }
  };
 });

 openMenu("SUPER CAR DEALERSHIP",items);
}

function invest(cost,profit){
 if(money<cost){
  notice("Not enough game money.");
  return;
 }
 money=money-cost+profit;
 wallet();
 notice("Investment completed! You earned virtual game money.");
}

function near(x,z,d){
 return Math.hypot(player.position.x-x,player.position.z-z)<(d||14);
}

// INTERACTIONS
function interact(){
 if(near(20,45,20)){
  dealership();
  return;
 }

 if(near(-12,-18)){
  notice("Welcome to your mansion! Your private Lagos home.");
  return;
 }

 if(near(25,-25)){
  openMenu("HOTEL",[
   {label:"Book room — ₦2,000,000",action:function(){
    if(money>=2000000){
     money-=2000000;
     wallet();
     notice("Hotel room booked!");
    }else notice("Not enough game money.");
   }}
  ]);
  return;
 }

 if(near(-35,25)){
  const places=["Abuja","Kano","Oyo","Ogun","Rivers","Enugu","Delta","Kaduna"];
  openMenu("LAGOS AIRPORT",places.map(place=>({
   label:"Travel to "+place,
   action:function(){
    destination=place;
    player.position.set(0,0,5);
    document.getElementById("location").textContent=place;
    completed.airport=true;
    save();
    closeMenu();
   }
  })));
  return;
 }

 if(near(38,30)){
  openMenu("INVESTMENT CENTRE",[
   {label:"Small Business ₦10M → ₦12M",action:()=>invest(10000000,12000000)},
   {label:"Shopping Mall ₦50M → ₦60M",action:()=>invest(50000000,60000000)},
   {label:"Hotel Business ₦100M → ₦125M",action:()=>invest(100000000,125000000)},
   {label:"Factory ₦200M → ₦250M",action:()=>invest(200000000,250000000)}
  ]);
  return;
 }

 if(near(-25,-45)){
  openMenu("CLOTHING SHOP",[
   {label:"Blue outfit",action:()=>{body.material=mat(0x2255cc);closeMenu();}},
   {label:"Red outfit",action:()=>{body.material=mat(0xcc2222);closeMenu();}},
   {label:"Green outfit",action:()=>{body.material=mat(0x229955);closeMenu();}},
   {label:"Purple outfit",action:()=>{body.material=mat(0x8833bb);closeMenu();}}
  ]);
  return;
 }

 openMenu("CITY MISSIONS",[
  {label:"Explore Lagos — earn ₦5M",action:function(){
   if(!completed.explore){
    money+=5000000;
    completed.explore=true;
    wallet();
   }
   notice("City mission completed!");
  }},
  {label:"Visit Airport",action:()=>{player.position.set(-35,0,25);closeMenu();}},
  {label:"Visit Hotel",action:()=>{player.position.set(25,0,-25);closeMenu();}},
  {label:"Visit Dealership",action:()=>{player.position.set(20,0,45);closeMenu();}}
 ]);
}

// MOVEMENT
const keys={};
document.querySelectorAll("[data-key]").forEach(button=>{
 const key=button.dataset.key;
 button.addEventListener("pointerdown",e=>{
  e.preventDefault();
  keys[key]=true;
 });
 ["pointerup","pointerleave","pointercancel"].forEach(event=>{
  button.addEventListener(event,()=>keys[key]=false);
 });
});

document.getElementById("enter").onclick=interact;

let carMode=false;

document.getElementById("drive").onclick=function(){
 if(!owned.includes(selected)){
  notice("Buy a car first!");
  return;
 }

 carMode=!carMode;
 if(carMode){
  cars[selected].position.copy(player.position);
  notice("Driving "+catalogue[selected].name);
 }else{
  player.position.copy(cars[selected].position);
 }
};

document.getElementById("jump").onclick=function(){
 if(!carMode){
  player.position.y=2;
  setTimeout(()=>player.position.y=0,350);
 }
};

let night=false;
document.getElementById("day").onclick=function(){
 night=!night;
 scene.background=new THREE.Color(night?0x101b3a:0x8bc8ed);
 scene.fog.color.copy(scene.background);
 sun.intensity=night?.35:2;
};

// GAME LOOP
let last=0;

function animate(time){
 requestAnimationFrame(animate);

 const dt=Math.min((time-last)/1000,.05);
 last=time;

 const target=carMode?cars[selected]:player;
 const speed=carMode?23:8;

 let dx=0,dz=0;
 if(keys.forward)dz-=1;
 if(keys.back)dz+=1;
 if(keys.left)dx-=1;
 if(keys.right)dx+=1;

 const length=Math.hypot(dx,dz)||1;
 dx=dx/length*speed*dt;
 dz=dz/length*speed*dt;

 target.position.x+=dx;
 target.position.z+=dz;

 if(dx||dz)target.rotation.y=Math.atan2(dx,dz);

 if(carMode)player.position.copy(target.position);

 plane.position.x+=.12;
 if(plane.position.x>100)plane.position.x=-100;

 danfos.forEach((bus,i)=>{
  bus.position.x+=i%2?.035:-.035;
  if(Math.abs(bus.position.x)>100)bus.position.x=-bus.position.x;
 });

 const focus=carMode?cars[selected]:player;

 camera.position.lerp(
  new THREE.Vector3(
   focus.position.x,
   focus.position.y+9,
   focus.position.z+16
  ),.09
 );

 camera.lookAt(
  focus.position.x,
  focus.position.y+1,
  focus.position.z
 );

 renderer.render(scene,camera);
}

requestAnimationFrame(animate);

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

})();
</script>
</body>
</html>
