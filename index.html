
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LAGOS LIFE 3D - Ultra Graphics</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#8ac9f5;font-family:Arial}
button{border:1px solid #ffffff88;border-radius:14px;background:#101c2de8;color:white;font-weight:bold;touch-action:none;box-shadow:0 3px 10px #0005}
#title{position:absolute;top:10px;width:100%;text-align:center;color:white;font-size:23px;font-weight:900;text-shadow:0 3px 8px #000;pointer-events:none}
#info{position:absolute;top:48px;left:10px;color:white;background:#101c2dcc;padding:10px;border-radius:12px;font-size:13px;line-height:1.7}
#phone,#map,#switch,#action{position:absolute;right:10px;width:88px;height:42px;font-size:12px}
#phone{top:10px}#map{top:58px}#switch{top:106px;background:#087b35}#action{top:154px}
#controls{position:absolute;bottom:15px;width:100%;display:flex;justify-content:space-between;padding:0 10px}
.group{display:flex;gap:7px;align-items:end}
.control{width:53px;height:55px;font-size:21px}
#go{width:66px;height:66px;background:#087b35}
#nitro{background:#0758bd}
.panel{display:none;position:absolute;z-index:10;top:50%;left:50%;transform:translate(-50%,-50%);width:290px;max-height:80vh;overflow:auto;padding:18px;border:2px solid #ffffff66;border-radius:20px;background:#111c2bed;color:white;text-align:center}
.panel button{width:100%;height:42px;margin-top:9px}
#message{display:none;position:absolute;top:215px;left:50%;transform:translateX(-50%);background:#101c2dee;color:white;padding:11px;border-radius:12px;text-align:center;width:85%}
</style>
</head>
<body>
<div id="title">LAGOS LIFE 3D</div>
<div id="info">
MODE: <span id="mode">WALKING</span><br>
MONEY: <span id="money">₦50,000</span><br>
SPEED: <span id="speed">0</span> KM/H
</div>
<button id="phone">📱 PHONE</button>
<button id="map">🗺️ MAP</button>
<button id="switch">ENTER CAR</button>
<button id="action">INTERACT</button>
<div id="message"></div>

<div id="phonePanel" class="panel">
<h2>📱 LAGOS PHONE</h2>
<button onclick="show('walletPanel')">💰 Wallet</button>
<button onclick="show('chatPanel')">💬 Messages</button>
<button onclick="show('friendsPanel')">👥 Friends</button>
<button onclick="closePanels()">CLOSE</button>
</div>
<div id="walletPanel" class="panel">
<h2>MY WALLET</h2><h1 id="wallet">₦50,000</h1>
<button onclick="show('phonePanel')">BACK</button>
</div>
<div id="chatPanel" class="panel">
<h2>MESSAGES</h2><p>Online chat will be added when multiplayer is connected.</p>
<button onclick="show('phonePanel')">BACK</button>
</div>
<div id="friendsPanel" class="panel">
<h2>FRIENDS</h2><p>Online friends will appear here after multiplayer setup.</p>
<button onclick="show('phonePanel')">BACK</button>
</div>
<div id="housePanel" class="panel">
<h2>👑 ROYAL MANSION</h2>
<p>Welcome home!</p>
<button onclick="room('Living Room')">🛋️ Living Room</button>
<button onclick="room('Bedroom')">🛏️ Bedroom</button>
<button onclick="room('Kitchen')">🍽️ Kitchen</button>
<button onclick="room('Garage')">🚘 Garage</button>
<button onclick="room('Garden and Pool')">🏊 Garden and Pool</button>
<button onclick="exitHouse()">EXIT MANSION</button>
</div>
<div id="roomPanel" class="panel">
<h2 id="roomTitle">ROOM</h2>
<p id="roomText"></p>
<button onclick="show('housePanel')">BACK TO MANSION</button>
<button onclick="exitHouse()">EXIT HOUSE</button>
</div>
<div id="mapPanel" class="panel">
<h2>CITY MAP</h2>
<canvas id="mapCanvas" width="240" height="240" style="width:240px"></canvas>
<button onclick="closePanels()">CLOSE</button>
</div>

<div id="controls">
<div class="group">
<button class="control" id="left">◀</button>
<button class="control" id="right">▶</button>
</div>
<div class="group">
<button class="control" id="back">▼</button>
<button class="control" id="forward">▲</button>
<button class="control" id="nitro">N₂</button>
<button id="go">GO</button>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// GRAPHICS ENGINE
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91cafa);
scene.fog=new THREE.FogExp2(0xa9d5ef,.0018);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1000);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);

// LIGHTING
scene.add(new THREE.HemisphereLight(0xd9edff,0x526044,1.7));
const sun=new THREE.DirectionalLight(0xffe3b5,3);
sun.position.set(-70,100,50);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-100;
sun.shadow.camera.right=100;
sun.shadow.camera.top=100;
sun.shadow.camera.bottom=-100;
sun.shadow.bias=-.0003;
scene.add(sun);

function mat(color,rough=.8,metal=0){
return new THREE.MeshStandardMaterial({
color,roughness:rough,metalness:metal
});
}
function box(w,h,d,color,x,y,z,parent=scene,rough=.8,metal=0){
const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color,rough,metal));
m.position.set(x,y,z);
m.castShadow=true;m.receiveShadow=true;
parent.add(m);return m;
}
function groundPlane(w,d,color,x,z){
const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),mat(color));
m.rotation.x=-Math.PI/2;m.position.set(x,0,z);
m.receiveShadow=true;scene.add(m);return m;
}

// SKY CLOUDS
function cloud(x,y,z){
const g=new THREE.Group();
for(let i=0;i<5;i++){
const c=new THREE.Mesh(
new THREE.SphereGeometry(2+Math.random()*1.5,12,12),
new THREE.MeshBasicMaterial({color:0xffffff}));
c.position.set(i*2,Math.random()*1.2,Math.random()*1.2);
g.add(c);
}
g.position.set(x,y,z);scene.add(g);
}
for(let i=0;i<12;i++)cloud(-100+Math.random()*200,35+Math.random()*20,-150+Math.random()*300);

// CITY GROUND AND ROADS
groundPlane(500,600,0x548a43,0,0);
groundPlane(18,600,0x292d32,0,0);
groundPlane(300,12,0x292d32,0,-70);

for(let z=-290;z<300;z+=12){
box(.18,.035,5,0xffffff,0,.04,z);
}
for(let side of [-1,1]){
for(let z=-280;z<280;z+=25){
box(4,.15,20,0xb5aa94,side*13,.08,z);
}
}

// CITY BUILDINGS
const buildingColors=[0xe6c9a0,0xbac5cb,0xd9d1c0,0xb5a08b,0x9aabb6];
for(let i=0;i<65;i++){
const side=i%2?1:-1;
const x=side*(21+Math.random()*20);
const z=-260+i*8;
const w=7+Math.random()*8,h=10+Math.random()*28;
const b=box(w,h,9,buildingColors[i%buildingColors.length],x,h/2,z);
box(w+.3,.3,9.3,0x555c65,x,h+.15,z);
for(let floor=2;floor<h-2;floor+=3){
for(let col=-1;col<=1;col++){
box(1.1,1.3,.12,0x35536c,x+col*2,floor,z+4.57);
}
}
}

// LUXURY MANSION
const mansion=new THREE.Group();
scene.add(mansion);
mansion.position.set(45,0,-20);

// Compound
box(44,.25,48,0xc9c2b4,0,.08,0,mansion);
box(11,.2,15,0x438c45,-15,.22,-12,mansion);

// Mansion walls
box(24,8,19,0xe7d9c5,0,4,-4,mansion);
box(21,7,17,0xf0e7d9,0,11,-4,mansion);
box(25,.6,20,0x353b43,0,15,-4,mansion);
box(23,.35,19,0x282d34,0,7.9,-4,mansion);

// Front columns
for(let x of [-10,-5,5,10]){
box(.65,7,.65,0xfaf2e4,x,3.5,6,mansion);
}

// Windows
for(let y of [3,11]){
for(let x of [-8,-3,3,8]){
box(2.5,2.5,.18,0x244f70,x,y,5.62,mansion,.2,.3);
box(2.7,.12,.25,0xffffff,x,y+1.3,5.6,mansion);
box(.12,2.5,.25,0xffffff,x,y,5.6,mansion);
}
}

// Main entrance
box(2.3,4,.3,0x63391e,0,2,5.7,mansion,.35);
box(2.5,.2,.5,0xc8a35d,0,4.1,5.7,mansion,.3,.7);

// Balcony
box(21,.3,3,0xddd1bd,0,8,7,mansion);
for(let x=-9;x<=9;x+=2){
box(.12,1,.12,0xb69a72,x,8.6,8,mansion,.3,.6);
}

// Garage
box(9,5,10,0xd8c8b1,15,2.5,-7,mansion);
box(8,3,.3,0x272d33,15,2,-1.9,mansion);
box(9,.25,10,0x454545,15,5,-7,mansion);

// Swimming pool
box(14,.4,10,0x1685b5,-12,.3,10,mansion);
const water=new THREE.Mesh(
new THREE.PlaneGeometry(13,9),
new THREE.MeshPhysicalMaterial({
color:0x39bce8,roughness:.12,metalness:.15,
transparent:true,opacity:.85,clearcoat:1
}));
water.rotation.x=-Math.PI/2;
water.position.set(-12,.58,10);
mansion.add(water);

// Pool tiles
for(let x=-19;x<=-5;x+=2){
box(.12,.08,10,0xffffff,x,.65,10,mansion);
}

// Garden trees
for(let i=0;i<7;i++){
const x=-20+i*6;
box(.5,3,.5,0x714526,x,1.5,-17,mansion);
const leaves=new THREE.Mesh(
new THREE.SphereGeometry(2.2,14,14),mat(0x16743b));
leaves.position.set(x,4,-17);
leaves.castShadow=true;mansion.add(leaves);
}

// Outdoor lights
for(const x of [-18,18]){
box(.25,4,.25,0x292929,x,2,15,mansion);
const lamp=new THREE.Mesh(new THREE.SphereGeometry(.4,12,12),
new THREE.MeshBasicMaterial({color:0xffe8a1}));
lamp.position.set(x,4.2,15);mansion.add(lamp);
}

// Furniture
const furniture=new THREE.Group();mansion.add(furniture);
// Living room
box(5,1,2,0x75503b,-5,1,0,furniture);
box(5,1.5,.4,0x75503b,-5,2,1,furniture);
box(3,.4,2,0xd1b17a,0,.5,0,furniture);
box(3,2,.2,0x101820,5,2,0,furniture);
box(3.5,.3,.6,0x5d3926,5,.5,0,furniture);
// Bedroom upstairs
box(5,.7,6,0xf3eee5,5,9,-6,furniture);
box(5,.4,2,0x405e9a,5,9.5,-8,furniture);
box(2,1,.6,0xffffff,4,10,-9,furniture);
// Kitchen
box(5,1,.9,0xffffff,-6,1,-7,furniture);
box(2,2,2,0xb9c4cc,5,1,-8,furniture);
box(3,.2,2,0x70462c,0,2,-8,furniture);

// FENCE
for(let x=-21;x<=21;x+=2){
box(.25,2,.25,0xc5b99f,x,1,23,mansion);
}
box(43,.3,.3,0x333333,0,2,23,mansion);

// HUMAN CHARACTER
const player=new THREE.Group();scene.add(player);
const skin=mat(0x9b613e),shirt=mat(0x1765d5),pants=mat(0x20283b);
const torso=new THREE.Mesh(new THREE.BoxGeometry(.8,1.1,.45),shirt);
torso.position.y=1.4;player.add(torso);
const head=new THREE.Mesh(new THREE.SphereGeometry(.29,20,20),skin);
head.position.y=2.2;player.add(head);
const hair=new THREE.Mesh(new THREE.SphereGeometry(.3,16,12),
mat(0x17120e));
hair.scale.set(1,.45,1);
hair.position.y=2.38;player.add(hair);
const arms=[],legs=[];
for(const x of [-.55,.55]){
const arm=new THREE.Mesh(new THREE.BoxGeometry(.23,.85,.25),shirt);
arm.position.set(x,1.4,0);player.add(arm);arms.push(arm);
}
for(const x of [-.22,.22]){
const leg=new THREE.Mesh(new THREE.BoxGeometry(.3,.85,.32),pants);
leg.position.set(x,.45,0);player.add(leg);legs.push(leg);
}
player.position.set(45,0,10);

// BUGATTI
const car=new THREE.Group();scene.add(car);
const blue=mat(0x0649ff,.2,.7);
const black=mat(0x080a0e,.35);
const glass=mat(0x132c42,.15,.3);
box(2.3,.65,4.6,0x0649ff,0,.8,0,car,.2,.7);
box(1.8,.7,2.1,0x132c42,0,1.4,.1,car,.15,.5);
box(2,.15,1,0x0649ff,0,1.1,-2.2,car,.2,.7);
const wheels=[];
for(const x of [-1.2,1.2])for(const z of [-1.5,1.5]){
const w=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.3,24),black);
w.rotation.z=Math.PI/2;w.position.set(x,.45,z);
w.castShadow=true;car.add(w);wheels.push(w);
}
car.position.set(0,0,0);

// DANFO BUSES
const buses=[];
for(let i=0;i<6;i++){
const bus=new THREE.Group();
box(2.5,2.5,5,0xffd400,0,1.4,0,bus);
box(2.3,.8,.1,0x243d50,0,2.1,-2.55,bus);
bus.position.set(i%2?5:-5,0,-180+i*60);
scene.add(bus);buses.push(bus);
}

// GAME STATE
let money=50000,driving=false,inside=false,speed=0,walkTime=0;
const keys={left:false,right:false,forward:false,back:false,gas:false,nitro:false};

function updateMoney(){
const v="₦"+money.toLocaleString("en-NG");
document.getElementById("money").innerText=v;
document.getElementById("wallet").innerText=v;
}
function message(t){
const el=document.getElementById("message");
el.innerText=t;el.style.display="block";
clearTimeout(window.msgTimer);
window.msgTimer=setTimeout(()=>el.style.display="none",3000);
}
function closePanels(){
document.querySelectorAll(".panel").forEach(p=>p.style.display="none");
}
function show(id){closePanels();document.getElementById(id).style.display="block";}
document.getElementById("phone").onclick=()=>show("phonePanel");
document.getElementById("map").onclick=()=>{
show("mapPanel");drawMap();
};
function drawMap(){
const c=document.getElementById("mapCanvas"),ctx=c.getContext("2d");
ctx.fillStyle="#4b8543";ctx.fillRect(0,0,240,240);
ctx.fillStyle="#303030";ctx.fillRect(100,0,35,240);
ctx.fillRect(0,105,240,30);
ctx.fillStyle="#1685b5";ctx.fillRect(155,20,55,45);
ctx.fillStyle="white";ctx.fillText("MANSION",155,15);
const t=driving?car:player;
ctx.fillStyle="red";ctx.beginPath();
ctx.arc(120+(t.position.x-20)*2,120,6,0,7);ctx.fill();
}

// MANSION
function interact(){
if(driving){message("Exit the car first!");return;}
const d=Math.hypot(player.position.x-45,player.position.z-5);
if(!inside&&d<35){
inside=true;
show("housePanel");
message("Welcome to your Royal Mansion!");
}else if(inside){
show("housePanel");
}else{
message("Find your Royal Mansion!");
}
}
document.getElementById("action").onclick=interact;

function room(name){
show("roomPanel");
document.getElementById("roomTitle").innerText=name.toUpperCase();
document.getElementById("roomText").innerText=
"Welcome to your luxury "+name+". Explore your Royal Mansion!";
}
function exitHouse(){
inside=false;closePanels();
player.position.set(45,0,14);
message("You are outside your mansion.");
}

// CAR SWITCH
function switchCar(){
if(!driving){
if(player.position.distanceTo(car.position)>6){
message("Walk closer to your Bugatti!");return;
}
driving=true;player.visible=false;
}else{
driving=false;player.visible=true;
player.position.set(car.position.x+3,0,car.position.z);
speed=0;
}
document.getElementById("mode").innerText=driving?"DRIVING":"WALKING";
document.getElementById("switch").innerText=driving?"EXIT CAR":"ENTER CAR";
}
document.getElementById("switch").onclick=switchCar;

// BUTTONS
function bind(id,key){
const b=document.getElementById(id);
b.addEventListener("pointerdown",e=>{e.preventDefault();keys[key]=true;});
["pointerup","pointerleave","pointercancel"].forEach(evt=>
b.addEventListener(evt,()=>keys[key]=false));
}
bind("left","left");bind("right","right");
bind("forward","forward");bind("back","back");
bind("go","gas");bind("nitro","nitro");

window.addEventListener("keydown",e=>{
if(e.key==="ArrowLeft"||e.key==="a")keys.left=true;
if(e.key==="ArrowRight"||e.key==="d")keys.right=true;
if(e.key==="ArrowUp"||e.key==="w"){keys.forward=true;keys.gas=true;}
if(e.key==="ArrowDown"||e.key==="s")keys.back=true;
if(e.key==="Shift")keys.nitro=true;
});
window.addEventListener("keyup",e=>{
if(e.key==="ArrowLeft"||e.key==="a")keys.left=false;
if(e.key==="ArrowRight"||e.key==="d")keys.right=false;
if(e.key==="ArrowUp"||e.key==="w"){keys.forward=false;keys.gas=false;}
if(e.key==="ArrowDown"||e.key==="s")keys.back=false;
if(e.key==="Shift")keys.nitro=false;
});

// DAY AND NIGHT GRAPHICS
let day=true;
function toggleDay(){
day=!day;
scene.background.set(day?0x91cafa:0x101b38);
scene.fog.color.set(day?0xa9d5ef:0x17213b);
sun.intensity=day?3:.35;
}

// ANIMATION
function animate(){
requestAnimationFrame(animate);
const target=driving?car:player;

if(driving){
const max=keys.nitro?2:1;
if(keys.gas)speed=Math.min(speed+.025,max);
else speed=Math.max(0,speed-.018);
if(keys.left)car.rotation.y+=.025;
if(keys.right)car.rotation.y-=.025;
car.translateZ(-speed);
wheels.forEach(w=>w.rotation.x-=speed*.15);
}else if(!inside){
if(keys.forward){player.translateZ(-.14);walkTime+=.15;}
if(keys.back){player.translateZ(.14);walkTime+=.15;}
if(keys.left)player.rotation.y+=.045;
if(keys.right)player.rotation.y-=.045;
legs[0].rotation.x=Math.sin(walkTime)*.5;
legs[1].rotation.x=-Math.sin(walkTime)*.5;
arms[0].rotation.x=-Math.sin(walkTime)*.4;
arms[1].rotation.x=Math.sin(walkTime)*.4;
}else{
if(keys.forward)player.translateZ(-.1);
if(keys.back)player.translateZ(.1);
if(keys.left)player.rotation.y+=.04;
if(keys.right)player.rotation.y-=.04;
}

// Moving traffic
buses.forEach(b=>{
b.position.z+=.07;
if(b.position.z>120)b.position.z=-250;
});

// Camera follow
const follow=inside?player:target;
const offset=new THREE.Vector3(0,driving?5:4,driving?10:7);
offset.applyAxisAngle(new THREE.Vector3(0,1,0),follow.rotation.y);
camera.position.lerp(follow.position.clone().add(offset),.09);
camera.lookAt(follow.position.x,follow.position.y+1,follow.position.z);

document.getElementById("speed").innerText=Math.round(speed*100);
renderer.render(scene,camera);
}

camera.position.set(0,5,10);
updateMoney();
animate();

window.addEventListener("resize",()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
