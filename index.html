
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lagos Life 3D</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#8cc9e8;font-family:Arial,sans-serif;color:white}
#game{position:fixed;inset:0}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:6px;z-index:5;pointer-events:none}
.pill{background:#142c38e8;border:1px solid #ffffff35;border-radius:14px;padding:9px 12px;font-size:13px;font-weight:bold;box-shadow:0 3px 10px #0003}
#topRight{display:flex;gap:6px}
#bottom{position:fixed;bottom:12px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:end;z-index:5}
.controls{display:grid;grid-template-columns:46px 46px 46px;grid-template-rows:46px 46px;gap:4px}
.ctrl{border:0;border-radius:13px;background:#142c38df;color:white;font-size:22px;touch-action:none}
#up{grid-column:2}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}
.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:end}
.action{border:0;border-radius:13px;background:#142c38eF;color:white;padding:13px 15px;font-weight:bold}
#shop{position:fixed;inset:0;background:#07141dcc;z-index:10;display:none;align-items:center;justify-content:center;padding:15px}
.panel{background:#f4f5f1;color:#172a31;border-radius:20px;width:min(520px,100%);max-height:85vh;overflow:auto;padding:16px}
.panelHead{display:flex;justify-content:space-between;align-items:center}
.panel h2{margin:5px 0 12px}
#items{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.item{background:white;border-radius:14px;padding:12px;border:1px solid #dce3df}
.item .emoji{font-size:32px}.item button{width:100%;padding:10px;border:0;border-radius:9px;background:#168b60;color:white;font-weight:bold;margin-top:7px}
.close{border:0;border-radius:10px;padding:9px 13px;background:#253d47;color:white}
#notice{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:#142c38eF;padding:10px 15px;border-radius:12px;z-index:8;display:none;text-align:center;font-size:13px}
#help{position:fixed;bottom:110px;left:10px;background:#142c38cf;padding:8px 10px;border-radius:10px;font-size:11px;z-index:4}
@media(min-width:700px){.controls{transform:scale(1.15);transform-origin:bottom left}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <div class="pill">🏠 LAGOS LIFE</div>
  <div id="topRight">
    <div class="pill" id="money">₦ 500,000</div>
    <div class="pill" id="energy">⚡ 100</div>
  </div>
</div>
<div id="notice"></div>
<div id="help">Move with arrows or WASD • Buy furniture and tap the floor to place it</div>
<div id="bottom">
  <div class="controls">
    <button class="ctrl" id="up">▲</button>
    <button class="ctrl" id="left">◀</button>
    <button class="ctrl" id="down">▼</button>
    <button class="ctrl" id="right">▶</button>
  </div>
  <div class="actions">
    <button class="action" id="shopBtn">🛒 BUY</button>
    <button class="action" id="homeBtn">🏠 HOME</button>
    <button class="action" id="outsideBtn">🌴 YARD</button>
  </div>
</div>
<div id="shop">
  <div class="panel">
    <div class="panelHead"><h2>🛍️ Furniture Shop</h2><button class="close" id="closeShop">✕</button></div>
    <p>Buy something for your new home. After buying, tap a spot on the house floor to place it.</p>
    <div id="items"></div>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const mount=document.getElementById('game');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91cce8);
scene.fog=new THREE.Fog(0x91cce8,24,65);

const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,150);
camera.position.set(12,15,19);
camera.lookAt(0,0,0);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
mount.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x647b60,2));
const sun=new THREE.DirectionalLight(0xffffff,2.2);
sun.position.set(-8,18,10);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

const mat=(color,roughness=.85)=>new THREE.MeshStandardMaterial({color,roughness});
const materials={
 grass:mat(0x5caa58),floor:mat(0xe6d8b8),wall:mat(0xf0e9d9),
 trim:mat(0x9b6946),road:mat(0x454b50),white:mat(0xffffff),
 wood:mat(0x95613a),dark:mat(0x303c43),glass:new THREE.MeshStandardMaterial({color:0x83cce8,transparent:true,opacity:.48}),
 green:mat(0x25804c)
};
function box(w,h,d,x,y,z,material,shadow=true){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 m.position.set(x,y,z);m.castShadow=shadow;m.receiveShadow=true;scene.add(m);return m;
}
function cylinder(r1,r2,h,x,y,z,material){
 const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,12),material);
 m.position.set(x,y,z);m.castShadow=true;scene.add(m);return m;
}

// Lagos yard and road
box(100,.2,100,0,-.22,0,materials.grass,false);
box(100,.12,8,0,-.08,13,materials.road,false);
for(let x=-45;x<48;x+=8)box(4,.03,.12,x,.0,13,mat(0xe7d99b),false);

// House floors: open-front layout
box(14,.25,12,0,0,0,materials.floor);
box(14,.35,.25,0,.17,-6,materials.trim);
box(.25,3,12,-7,1.5,0,materials.wall);
box(.25,3,12,7,1.5,0,materials.wall);
box(14,3,.25,0,1.5,-6,materials.wall);
// Interior partitions with door gaps
box(.18,2.7,3,-2,1.35,-4.5,materials.wall);
box(.18,2.7,3,-2,1.35,-.0,materials.wall);
box(4,2.7,.18,4,1.35,-2,materials.wall);
box(2,2.7,.18,5,1.35,2,materials.wall);

// Windows
for(const x of [-5,0,5]){
 box(1.7,1.1,.08,x,1.9,-5.83,materials.glass);
 box(1.85,.09,.12,x,1.9,-5.78,materials.trim);
 box(.09,1.2,.12,x,1.9,-5.78,materials.trim);
}
// Door frame
box(1.25,2.2,.18,0,1.1,-5.82,materials.trim);
box(1.05,2,.08,0,1,-5.72,mat(0x795036));

// Room labels
function label(text,x,z){
 const c=document.createElement('canvas');c.width=256;c.height=64;
 const ctx=c.getContext('2d');ctx.fillStyle='#183b32';ctx.font='bold 30px Arial';ctx.textAlign='center';ctx.fillText(text,128,42);
 const tex=new THREE.CanvasTexture(c);
 const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true}));
 sprite.position.set(x,2.9,z);sprite.scale.set(2.5,.62,1);scene.add(sprite);
}
label('LIVING ROOM',-4,-3);
label('BEDROOM',4,-4);
label('KITCHEN',4,1);
label('DINING',-4,2);

// Yard decorations, trees and fence
for(let x=-12;x<=12;x+=2){
 box(.12,1.1,.12,x,.55,8,materials.trim);
}
for(let x=-12;x<=12;x+=2)box(1.9,.12,.12,x,1.05,8,materials.trim);
function tree(x,z){
 cylinder(.18,.25,1.8,x,.9,z,materials.trim);
 const crown=new THREE.Mesh(new THREE.SphereGeometry(1.05,12,10),materials.green);
 crown.position.set(x,2.25,z);crown.castShadow=true;scene.add(crown);
}
tree(-10,-2);tree(10,-3);tree(-10,6);tree(10,6);

// Simple neighbouring Lagos buildings
for(const b of [{x:-14,z:-8,c:0xe2a66d},{x:14,z:-8,c:0xd7d5c8},{x:-15,z:2,c:0xb9c6ce}]){
 box(4,5,5,b.x,2.5,b.z,mat(b.c));
 box(4.2,.25,5.2,b.x,5.1,b.z,materials.trim);
}

// Player
const player=new THREE.Group();scene.add(player);
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.32,.75,4,8),mat(0x2467ce));
body.position.y=.75;body.castShadow=true;player.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.25,16,12),mat(0x8c5737));
head.position.y=1.42;head.castShadow=true;player.add(head);
player.position.set(0,0,4);

let money=500000,energy=100,placing=null,inside=true;
const owned=[];
const furnitureTypes=[
 {id:'sofa',name:'Living Room Sofa',emoji:'🛋️',price:85000,color:0x3976a8,w:2.5,h:.8,d:1},
 {id:'bed',name:'Double Bed',emoji:'🛏️',price:120000,color:0x9a6b9c,w:2.2,h:.65,d:2.6},
 {id:'table',name:'Dining Table',emoji:'🍽️',price:45000,color:0x98613b,w:1.8,h:.8,d:1.2},
 {id:'chair',name:'Chair',emoji:'🪑',price:18000,color:0x9a6035,w:.7,h:.9,d:.7},
 {id:'tv',name:'Television',emoji:'📺',price:65000,color:0x202a32,w:1.6,h:1,d:.25},
 {id:'fridge',name:'Refrigerator',emoji:'🧊',price:95000,color:0xd9e0e5,w:.9,h:1.8,d:.8},
 {id:'wardrobe',name:'Wardrobe',emoji:'🚪',price:70000,color:0x865b3e,w:1.4,h:2,d:.7},
 {id:'plant',name:'Indoor Plant',emoji:'🪴',price:12000,color:0x287d43,w:.65,h:1,d:.65}
];
const furnitureGroup=new THREE.Group();scene.add(furnitureGroup);

function makeFurniture(item,x,z){
 const group=new THREE.Group();
 const base=new THREE.Mesh(new THREE.BoxGeometry(item.w,item.h,item.d),mat(item.color));
 base.position.y=item.h/2;base.castShadow=true;base.receiveShadow=true;group.add(base);
 if(item.id==='bed'){
   const mattress=new THREE.Mesh(new THREE.BoxGeometry(item.w*.95,.18,item.d*.8),mat(0xf0e9df));
   mattress.position.set(0,item.h+.08,.12);group.add(mattress);
   const pillow=new THREE.Mesh(new THREE.BoxGeometry(.65,.15,.45),mat(0xffffff));
   pillow.position.set(-.45,item.h+.2,-.7);group.add(pillow);
 }
 if(item.id==='sofa'){
   const back=new THREE.Mesh(new THREE.BoxGeometry(item.w,.65,.22),mat(item.color));
   back.position.set(0,item.h+.25,-item.d*.38);group.add(back);
 }
 if(item.id==='table'){
   for(const dx of [-.7,.7])for(const dz of [-.4,.4]){
    const leg=new THREE.Mesh(new THREE.BoxGeometry(.12,.65,.12),materials.wood);
    leg.position.set(dx,.35,dz);group.add(leg);
   }
 }
 if(item.id==='plant'){
   const leaves=new THREE.Mesh(new THREE.SphereGeometry(.42,10,8),materials.green);
   leaves.position.y=item.h+.3;group.add(leaves);
 }
 group.position.set(x,0,z);group.userData={furniture:true};
 furnitureGroup.add(group);owned.push(group);return group;
}

const shop=document.getElementById('shop'),items=document.getElementById('items');
function updateHud(){
 document.getElementById('money').textContent='₦ '+money.toLocaleString('en-NG');
 document.getElementById('energy').textContent='⚡ '+energy;
}
function say(msg){
 const n=document.getElementById('notice');n.textContent=msg;n.style.display='block';
 clearTimeout(say.timer);say.timer=setTimeout(()=>n.style.display='none',2400);
}
function showShop(){
 items.innerHTML='';
 furnitureTypes.forEach(item=>{
  const div=document.createElement('div');div.className='item';
  div.innerHTML=`<div class="emoji">${item.emoji}</div><b>${item.name}</b><p>₦ ${item.price.toLocaleString('en-NG')}</p><button>BUY</button>`;
  div.querySelector('button').onclick=()=>{
   if(money<item.price){say('Not enough money!');return;}
   money-=item.price;updateHud();placing=item;
   shop.style.display='none';
   say('Bought '+item.name+'. Tap inside the house to place it.');
  };
  items.appendChild(div);
 });
 shop.style.display='flex';
}
document.getElementById('shopBtn').onclick=showShop;
document.getElementById('closeShop').onclick=()=>shop.style.display='none';
document.getElementById('homeBtn').onclick=()=>{
 inside=true;player.position.set(0,0,4);say('Welcome home!');
};
document.getElementById('outsideBtn').onclick=()=>{
 inside=false;player.position.set(0,0,10);say('You are outside in the yard.');
};

// Touch and keyboard movement
const keys={};
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
function bindButton(id,key){
 const el=document.getElementById(id);
 el.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;});
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,()=>keys[key]=false));
}
bindButton('up','w');bindButton('down','s');bindButton('left','a');bindButton('right','d');

const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();
const floorMeshes=[];
scene.traverse(o=>{if(o.isMesh && o.geometry.type==='BoxGeometry' && o.position.y===0)floorMeshes.push(o);});
renderer.domElement.addEventListener('pointerdown',e=>{
 if(!placing)return;
 const rect=renderer.domElement.getBoundingClientRect();
 pointer.x=((e.clientX-rect.left)/rect.width)*2-1;
 pointer.y=-((e.clientY-rect.top)/rect.height)*2+1;
 raycaster.setFromCamera(pointer,camera);
 const floor=raycaster.intersectObject(scene.children.find(o=>o.geometry?.type==='BoxGeometry'&&o.position.x===0&&o.position.z===0&&o.geometry.parameters.width===14),false)[0];
 if(!floor){say('Tap the house floor to place furniture.');return;}
 const p=floor.point;
 if(Math.abs(p.x)>6.5||p.z>5.5||p.z< -5.5){say('Place it inside the house.');return;}
 makeFurniture(placing,p.x,p.z);say(placing.name+' placed!');placing=null;
});

let last=performance.now();
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-last)/1000,.04);last=now;
 let dx=0,dz=0;
 if(keys.w||keys.arrowup)dz-=1;
 if(keys.s||keys.arrowdown)dz+=1;
 if(keys.a||keys.arrowleft)dx-=1;
 if(keys.d||keys.arrowright)dx+=1;
 if(dx||dz){
  const len=Math.hypot(dx,dz);dx/=len;dz/=len;
  player.position.x+=dx*4*dt;player.position.z+=dz*4*dt;
  player.position.x=THREE.MathUtils.clamp(player.position.x,-11,11);
  player.position.z=THREE.MathUtils.clamp(player.position.z,-10,12);
  player.rotation.y=Math.atan2(dx,dz);
 }
 camera.lookAt(0,0,0);
 renderer.render(scene,camera);
}
requestAnimationFrame(animate);

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
updateHud();
</script>
</body>
</html>
