
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LAGOS LIFE 3D V3</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial;background:#82c8ee}
canvas{display:block}
button{cursor:pointer}
#hud{position:fixed;top:10px;left:10px;background:#101b2ddd;color:white;padding:12px;border-radius:12px;z-index:5;font-size:13px;line-height:1.7}
#phoneBtn,#nightBtn{position:fixed;right:10px;z-index:8;padding:12px;background:#101827;color:white;border:1px solid white;border-radius:13px}
#phoneBtn{top:10px}#nightBtn{top:62px}
#phone{display:none;position:fixed;z-index:20;right:8px;top:110px;bottom:10px;width:min(350px,95vw);overflow:auto;background:#111c2c;color:white;border:2px solid #789;border-radius:22px;padding:13px}
#phone button{background:#263d5b;color:white;border:1px solid #627b9b;border-radius:10px;padding:12px;margin:3px}
#close{float:right;background:#9c3030!important}
#apps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;clear:both}
.app{min-height:70px;font-size:13px}
#page{background:#1b2a3e;border-radius:13px;padding:10px;margin-top:12px;min-height:140px}
#page button{width:100%;text-align:left;margin:4px 0}
#controls{position:fixed;bottom:12px;left:10px;z-index:9;display:grid;grid-template-columns:repeat(3,52px);gap:5px}
#controls button,#drive,#horn{height:48px;border:1px solid white;border-radius:12px;background:#101b2ddd;color:white;font-size:20px}
#drive,#horn{position:fixed;right:12px;bottom:15px;z-index:9;padding:12px;font-size:15px}
#horn{bottom:75px}
#toast{display:none;position:fixed;top:120px;left:50%;transform:translateX(-50%);z-index:40;background:#101827;color:white;padding:12px;border-radius:12px;max-width:90%;text-align:center}
</style>
</head>
<body>
<div id="hud"><b>🌆 LAGOS LIFE 3D V3</b><br>Bank: ₦<span id="money">0</span><br><span id="mode">Walking</span></div>
<button id="phoneBtn">📱 PHONE</button>
<button id="nightBtn">🌙 NIGHT</button>
<div id="phone">
<button id="close">CLOSE ✕</button>
<h2>📱 LAGOS PHONE</h2>
<div id="apps">
<button class="app" onclick="app('bank')">🏦<br>Bank</button>
<button class="app" onclick="app('invest')">📈<br>Invest</button>
<button class="app" onclick="app('garage')">🚘<br>Cars</button>
<button class="app" onclick="app('map')">🗺️<br>Map</button>
<button class="app" onclick="app('shop')">🛍️<br>Shop</button>
<button class="app" onclick="app('house')">🏠<br>Houses</button>
<button class="app" onclick="app('missions')">🎯<br>Missions</button>
<button class="app" onclick="app('profile')">👤<br>Profile</button>
<button class="app" onclick="app('settings')">⚙️<br>Settings</button>
</div>
<div id="page">Welcome to Lagos! Select an app.</div>
</div>
<div id="controls">
<div></div><button data-k="f">▲</button><div></div>
<button data-k="l">◀</button><button data-k="b">▼</button><button data-k="r">▶</button>
</div>
<button id="horn">📣 HORN</button>
<button id="drive">🚗 ENTER CAR</button>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const defaults={money:50000000,cars:["Bugatti Chiron"],selected:"Bugatti Chiron",houses:[],items:[],missions:[]};
let save;
try{save=JSON.parse(localStorage.getItem("lagosLifeV3"))||defaults}catch(e){save=defaults}
let money=save.money??defaults.money,owned=save.cars||defaults.cars,selected=save.selected||defaults.selected;
let houses=save.houses||[],items=save.items||[],done=save.missions||[];
let scene,camera,renderer,player,car,traffic=[],clock=new THREE.Clock();
let driving=false,night=false,speed=0,carAngle=0;
let keys={f:false,b:false,l:false,r:false};
const catalog=[
["Bugatti Chiron",0,0x153bff],["Lamborghini Aventador",180000000,0xffcc00],
["Ferrari 488",150000000,0xd90000],["McLaren 720S",170000000,0xff6600],
["Porsche 911",95000000,0xffffff],["Nissan GT-R",75000000,0x222222],
["Mercedes AMG GT",125000000,0x00aaff],["BMW M4",85000000,0x226644],
["Range Rover Sport",110000000,0x444444]
];
const destinations={"Victoria Island":[45,0,0],"Lekki":[75,0,-55],"Ikeja":[-65,0,-50],"Airport":[-85,0,65],"Marina":[0,0,80],"Stadium":[65,0,75]};
function persist(){localStorage.setItem("lagosLifeV3",JSON.stringify({money,cars:owned,selected,houses,items,missions:done}))}
function cash(){ $("money").textContent=money.toLocaleString("en-NG");persist()}
function say(s){$("toast").textContent=s;$("toast").style.display="block";clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$("toast").style.display="none",2200)}
function spend(n){if(money<n){say("Not enough game money!");return false}money-=n;cash();return true}
function earn(n){money+=n;cash()}
function app(name){
let p=$("page"),h="";
if(name==="bank")h=`<h3>🏦 LAGOS BANK</h3><p>Balance: ₦${money.toLocaleString()}</p><button onclick="earn(1000000);app('bank')">Collect daily game reward ₦1,000,000</button><p>Virtual game currency only.</p>`;
if(name==="invest"){
h="<h3>📈 INVESTMENT CENTRE</h3><p>Fictional game investments:</p>";
[["Small business",5000000,7500000],["Property fund",15000000,22000000],["Tech company",10000000,14500000]].forEach((x,i)=>h+=`<button onclick="invest(${i})">${x[0]} · Invest ₦${x[1].toLocaleString()} · Game reward ₦${x[2].toLocaleString()}</button>`);
}
if(name==="garage"){
h="<h3>🚘 PREMIUM CAR DEALERSHIP</h3>";
catalog.forEach((c,i)=>h+=`<button onclick="buyCar(${i})">${c[0]} — ${c[1]?"₦"+c[1].toLocaleString():"FREE"} ${owned.includes(c[0])?"✓ OWNED":""}</button>`);
h+=`<p>Selected: ${selected}</p><button onclick="spawnCar()">Bring car to me</button>`;
}
if(name==="map"){
h="<h3>🗺️ LAGOS MAP</h3>";
Object.keys(destinations).forEach(n=>h+=`<button onclick="travel('${n}')">📍 Travel to ${n}</button>`);
}
if(name==="shop"){
h="<h3>🛍️ CITY SHOP</h3>";
[["Fashion outfit",250000],["Luxury watch",1200000],["Smartphone",900000],["Designer shoes",400000],["Gaming laptop",2500000],["Food",50000]].forEach((x,i)=>h+=`<button onclick="buyItem(${i})">${x[0]} — ₦${x[1].toLocaleString()}</button>`);
h+=`<p>Owned: ${items.join(", ")||"Nothing yet"}</p>`;
}
if(name==="house"){
h="<h3>🏠 PROPERTY MARKET</h3>";
[["Lekki apartment",25000000],["VI luxury house",80000000],["Ikeja mansion",120000000]].forEach((x,i)=>h+=`<button onclick="buyHouse(${i})">${x[0]} — ₦${x[1].toLocaleString()}</button>`);
h+=`<p>Your properties: ${houses.join(", ")||"None"}</p>`;
}
if(name==="missions"){
h="<h3>🎯 CITY MISSIONS</h3>";
[["Explore Lagos",500000],["Drive your car",750000],["Visit another district",1000000]].forEach((x,i)=>h+=`<button onclick="mission(${i})">${x[0]} — reward ₦${x[1].toLocaleString()} ${done.includes(i)?"✓ COMPLETE":""}</button>`);
}
if(name==="profile")h=`<h3>👤 PLAYER PROFILE</h3><p>Money: ₦${money.toLocaleString()}</p><p>Cars: ${owned.length}</p><p>Properties: ${houses.length}</p><p>Items: ${items.length}</p>`;
if(name==="settings")h="<h3>⚙️ SETTINGS</h3><button onclick='toggleNight()'>Switch day/night</button><button onclick='resetSave()'>Reset saved game</button><p>Reset permanently clears your local game progress.</p>";
p.innerHTML=h;
}
function invest(i){
let a=[["Small business",5000000,7500000],["Property fund",15000000,22000000],["Tech company",10000000,14500000]][i];
if(spend(a[1])){earn(a[2]);say("Investment complete! Game reward collected.");app("invest")}
}
function buyCar(i){let c=catalog[i];if(owned.includes(c[0])){selected=c[0];say("Car selected!");persist();app("garage");return}if(spend(c[1])){owned.push(c[0]);selected=c[0];say("New car purchased!");persist();app("garage")}}
function buyItem(i){let a=[["Fashion outfit",250000],["Luxury watch",1200000],["Smartphone",900000],["Designer shoes",400000],["Gaming laptop",2500000],["Food",50000]][i];if(spend(a[1])){items.push(a[0]);say("Item purchased!");app("shop")}}
function buyHouse(i){let a=[["Lekki apartment",25000000],["VI luxury house",80000000],["Ikeja mansion",120000000]][i];if(houses.includes(a[0])){say("You already own this property");return}if(spend(a[1])){houses.push(a[0]);say("Property purchased!");app("house")}}
function mission(i){
if(done.includes(i)){say("Mission already completed!");return}
if(i===1&&!driving){say("Enter your car first!");return}
if(i===2&&player.position.length()<15){say("Travel farther across the city first!");return}
done.push(i);earn([500000,750000,1000000][i]);say("Mission complete!");app("missions")
}
function travel(n){let a=destinations[n];player.position.set(a[0],0,a[2]);if(car)car.position.set(a[0]+4,0,a[2]);driving=false;speed=0;$("mode").textContent="Walking";$("phone").style.display="none";say("You arrived at "+n);persist()}
function building(x,z,w,h,d,color){
let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color}));m.position.set(x,h/2,z);scene.add(m);
for(let y=3;y<h-1;y+=3)for(let xx=-w/2+1;xx<w/2-1;xx+=3){
let win=new THREE.Mesh(new THREE.BoxGeometry(1.1,1.2,.08),new THREE.MeshBasicMaterial({color:0x9ee7ff}));
win.position.set(x+xx,y,z-d/2-.06);scene.add(win)}
}
function makeCar(color){
let g=new THREE.Group();
let b=new THREE.Mesh(new THREE.BoxGeometry(2.7,.8,5),new THREE.MeshLambertMaterial({color}));b.position.y=.8;g.add(b);
let roof=new THREE.Mesh(new THREE.BoxGeometry(2,.8,2.4),new THREE.MeshLambertMaterial({color:0x182c46}));roof.position.set(0,1.5,-.25);g.add(roof);
for(let x of [-1.4,1.4])for(let z of [-1.6,1.6]){
let w=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.28,12),new THREE.MeshLambertMaterial({color:0x111111}));w.rotation.z=Math.PI/2;w.position.set(x,.45,z);g.add(w)}
scene.add(g);return g;
}
function spawnCar(){let c=catalog.find(x=>x[0]===selected)||catalog[0];scene.remove(car);car=makeCar(c[2]);car.position.set(player.position.x+4,0,player.position.z);say(selected+" ready!");$("phone").style.display="none"}
function addTraffic(x,z,color,dir){
let g=makeCar(color);g.position.set(x,0,z);g.rotation.y=dir;traffic.push({g,dir});
}
function init(){
if(!window.THREE){document.body.innerHTML="Game could not load. Check your internet and refresh.";return}
scene=new THREE.Scene();scene.background=new THREE.Color(0x8bc9ed);scene.fog=new THREE.Fog(0x8bc9ed,100,260);
camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
renderer=new THREE.WebGLRenderer({antialias:false});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x53634a,2));
let sun=new THREE.DirectionalLight(0xffffff,1.2);sun.position.set(40,80,30);scene.add(sun);
let ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),new THREE.MeshLambertMaterial({color:0x4b9850}));ground.rotation.x=-Math.PI/2;scene.add(ground);
let roadmat=new THREE.MeshLambertMaterial({color:0x30343a});
function road(x,z,w,d){let o=new THREE.Mesh(new THREE.BoxGeometry(w,.08,d),roadmat);o.position.set(x,.05,z);scene.add(o)}
road(0,0,500,18);road(0,0,18,500);road(55,0,12,500);road(-55,0,12,500);road(0,55,500,12);road(0,-55,500,12);
let white=new THREE.MeshBasicMaterial({color:0xffffff});
for(let i=-240;i<240;i+=14){let a=new THREE.Mesh(new THREE.BoxGeometry(5,.1,.2),white);a.position.set(i,.12,0);scene.add(a)}
for(let x=-110;x<=110;x+=27)for(let z=-110;z<=110;z+=27){
if(Math.abs(x)<18||Math.abs(z)<18)continue;
building(x,z,13,10+Math.random()*34,13,[0xb9a38f,0x9baab5,0xc5c5bf,0x718b9b][Math.floor(Math.random()*4)]);
}
player=new THREE.Group();
let torso=new THREE.Mesh(new THREE.BoxGeometry(.8,1.4,.5),new THREE.MeshLambertMaterial({color:0x1747bb}));torso.position.y=1;player.add(torso);
let head=new THREE.Mesh(new THREE.SphereGeometry(.35,12,12),new THREE.MeshLambertMaterial({color:0xb8794d}));head.position.y=2;player.add(head);scene.add(player);player.position.set(0,0,8);
car=makeCar(catalog.find(x=>x[0]===selected)?.[2]||0x153bff);car.position.set(5,0,5);
addTraffic(-40,0,0xffcc00,Math.PI/2);addTraffic(40,0,0xffffff,-Math.PI/2);addTraffic(0,-40,0x00aa99,0);addTraffic(0,40,0xff2222,Math.PI);
}
function toggleNight(){
night=!night;scene.background=new THREE.Color(night?0x07152d:0x8bc9ed);scene.fog.color.copy(scene.background);
$("nightBtn").textContent=night?"☀️ DAY":"🌙 NIGHT";say(night?"Night mode activated":"Day mode activated")
}
function resetSave(){if(confirm("Reset all saved game progress?")){localStorage.removeItem("lagosLifeV3");location.reload()}}
function animate(){
requestAnimationFrame(animate);
if(!scene)return;
let target=driving?car:player;
let m=keys.f?1:keys.b?-1:0,t=keys.l?1:keys.r?-1:0;
if(driving){speed=(speed+m*.012)*.97;carAngle+=t*.035;car.rotation.y=carAngle;car.translateZ(-speed*2.5);player.position.copy(car.position)}
else{if(m||t){player.rotation.y+=t*.055;player.translateZ(-m*.19)}}
traffic.forEach(v=>{v.g.translateZ(-.13);if(v.g.position.length()>180)v.g.position.set(-v.g.position.x,0,-v.g.position.z)});
let offset=new THREE.Vector3(0,5,10).applyAxisAngle(new THREE.Vector3(0,1,0),target.rotation.y);
camera.position.lerp(new THREE.Vector3(target.position.x+offset.x,target.position.y+offset.y,target.position.z+offset.z),.12);
camera.lookAt(target.position.x,target.position.y+1,target.position.z);
renderer.render(scene,camera)
}
$("phoneBtn").onclick=()=>$("phone").style.display="block";
$("close").onclick=()=>$("phone").style.display="none";
$("nightBtn").onclick=()=>toggleNight();
$("drive").onclick=()=>{
if(!driving){if(player.position.distanceTo(car.position)>10){say("Walk closer to your car first!");return}driving=true;carAngle=car.rotation.y;$("mode").textContent="Driving";say("You entered your car")}
else{driving=false;speed=0;player.position.x+=3;$("mode").textContent="Walking";say("You left your car")}
};
$("horn").onclick=()=>{say("📣 BEEEEEP!");};
document.querySelectorAll("[data-k]").forEach(b=>{
let k=b.dataset.k;b.addEventListener("pointerdown",e=>{e.preventDefault();keys[k]=true});
["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))
});
addEventListener("keydown",e=>{let map={ArrowUp:"f",w:"f",ArrowDown:"b",s:"b",ArrowLeft:"l",a:"l",ArrowRight:"r",d:"r"};if(map[e.key])keys[map[e.key]]=true});
addEventListener("keyup",e=>{let map={ArrowUp:"f",w:"f",ArrowDown:"b",s:"b",ArrowLeft:"l",a:"l",ArrowRight:"r",d:"r"};if(map[e.key])keys[map[e.key]]=false});
addEventListener("resize",()=>{if(camera){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}});
try{init();cash();animate()}catch(e){document.body.innerHTML="Game error: "+e.message}
</script>
</body>
</html>
