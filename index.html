
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAGOS LIFE 3D</title>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  overflow: hidden;
  background: #111;
  font-family: Arial, sans-serif;
}
#title {
  position: absolute;
  top: 12px;
  left: 0;
  width: 100%;
  text-align: center;
  color: white;
  font-size: 25px;
  font-weight: bold;
  text-shadow: 2px 2px 5px black;
  pointer-events: none;
}
#speed {
  position: absolute;
  top: 55px;
  left: 15px;
  color: white;
  background: #111b;
  padding: 12px;
  border-radius: 10px;
  font-size: 18px;
}
.controls {
  position: absolute;
  bottom: 25px;
  width: 100%;
  display: flex;
  justify-content: space-between;
  padding: 0 20px;
}
.group {
  display: flex;
  gap: 12px;
  align-items: end;
}
button {
  width: 65px;
  height: 65px;
  border: 2px solid white;
  border-radius: 18px;
  background: #111b;
  color: white;
  font-size: 23px;
  font-weight: bold;
  touch-action: none;
}
#gas {
  width: 80px;
  height: 80px;
  background: #087b35;
}
#nitro {
  background: #0758bd;
}
</style>
</head>

<body>

<div id="title">LAGOS LIFE 3D</div>
<div id="speed">SPEED: 0 KM/H</div>
<div id="speed">SPEED: 0 KM/H</div>

<div class="controls">
  <div class="group">
    <button id="left">◀</button>
    <button id="right">▶</button>
  </div>
  <div class="group">
    <button id="nitro">N₂</button>
    <button id="gas">GO</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 40, 180);

const camera = new THREE.PerspectiveCamera(
  70, window.innerWidth / window.innerHeight, 0.1, 500
);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x555555, 2));

const sunlight = new THREE.DirectionalLight(0xffffff, 2);
sunlight.position.set(-20, 40, 20);
scene.add(sunlight);

// Ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(300, 500),
  new THREE.MeshLambertMaterial({color:0x397d35})
);
ground.rotation.x = -Math.PI/2;
ground.position.y = -0.1;
scene.add(ground);

// Road
const road = new THREE.Mesh(
  new THREE.PlaneGeometry(14, 500),
  new THREE.MeshLambertMaterial({color:0x292929})
);
road.rotation.x = -Math.PI/2;
road.position.y = 0;
scene.add(road);

// Road lines
for(let z=-240; z<250; z+=12) {
  const line = new THREE.Mesh(
    new THREE.BoxGeometry(0.25, 0.04, 5),
    new THREE.MeshBasicMaterial({color:0xffffff})
  );
  line.position.set(0, 0.04, z);
  scene.add(line);
}

// Buildings
for(let i=0; i<55; i++) {
  const side = i%2===0 ? -1 : 1;
  const height = 8 + Math.random()*22;
  const width = 5 + Math.random()*5;

  const building = new THREE.Mesh(
    new THREE.BoxGeometry(width,height,7),
    new THREE.MeshLambertMaterial({
      color:[0xd6b58b,0xb5b5b5,0xd4d4d4,0x9eacb5][i%4]
    })
  );

  building.position.set(
    side*(12+Math.random()*9),
    height/2,
    -240+i*9
  );
  scene.add(building);

  // Windows
  for(let y=2; y<height-1; y+=3) {
    const windowMesh = new THREE.Mesh(
      new THREE.BoxGeometry(0.8,1.2,0.08),
      new THREE.MeshBasicMaterial({color:0x6ab8dc})
    );
    windowMesh.position.set(
      building.position.x,
      y,
      building.position.z+3.54
    );
    scene.add(windowMesh);
  }
}

// Bugatti car
const car = new THREE.Group();
scene.add(car);

const blue = new THREE.MeshStandardMaterial({
  color:0x0649ff,
  metalness:0.7,
  roughness:0.25
});

const black = new THREE.MeshStandardMaterial({color:0x111111});
const glass = new THREE.MeshStandardMaterial({
  color:0x111e35,
  metalness:0.5,
  roughness:0.2
});

// Body
const body = new THREE.Mesh(
  new THREE.BoxGeometry(2.3,0.65,4.5), blue
);
body.position.y=0.8;
car.add(body);

// Roof
const roof = new THREE.Mesh(
  new THREE.BoxGeometry(1.8,0.65,2), glass
);
roof.position.set(0,1.35,0.15);
car.add(roof);

// Front hood
const hood = new THREE.Mesh(
  new THREE.BoxGeometry(2.1,0.25,1.3), blue
);
hood.position.set(0,1.05,-1.5);
car.add(hood);

// Wheels
const wheels=[];
for(const x of [-1.15,1.15]) {
  for(const z of [-1.4,1.4]) {
    const wheel = new THREE.Mesh(
      new THREE.CylinderGeometry(0.43,0.43,0.3,24),
      black
    );
    wheel.rotation.z=Math.PI/2;
    wheel.position.set(x,0.45,z);
    car.add(wheel);
    wheels.push(wheel);
  }
}

// Headlights
for(const x of [-0.75,0.75]) {
  const light = new THREE.Mesh(
    new THREE.BoxGeometry(0.4,0.18,0.08),
    new THREE.MeshBasicMaterial({color:0xffffff})
  );
  light.position.set(x,1.02,-2.27);
  car.add(light);
}

// Exhaust
const exhaust = new THREE.Mesh(
  new THREE.BoxGeometry(0.7,0.2,0.1),
  black
);
exhaust.position.set(0,0.55,2.28);
car.add(exhaust);

car.position.set(0,0,0);

// Controls
const keys = {
  left:false,
  right:false,
  gas:false,
  nitro:false
};

function holdButton(id,key) {
  const button=document.getElementById(id);

  button.addEventListener("pointerdown",e=>{
    e.preventDefault();
    keys[key]=true;
  });

  button.addEventListener("pointerup",()=>{
    keys[key]=false;
  });

  button.addEventListener("pointerleave",()=>{
    keys[key]=false;
  });

  button.addEventListener("pointercancel",()=>{
    keys[key]=false;
  });
}

holdButton("left","left");
holdButton("right","right");
holdButton("gas","gas");
holdButton("nitro","nitro");

window.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft") keys.left=true;
  if(e.key==="ArrowRight") keys.right=true;
  if(e.key==="ArrowUp") keys.gas=true;
  if(e.key==="Shift") keys.nitro=true;
});

window.addEventListener("keyup",e=>{
  if(e.key==="ArrowLeft") keys.left=false;
  if(e.key==="ArrowRight") keys.right=false;
  if(e.key==="ArrowUp") keys.gas=false;
  if(e.key==="Shift") keys.nitro=false;
});

let speed=0;

function animate() {
  requestAnimationFrame(animate);

  const maximum=keys.nitro ? 2.2 : 1.1;

  if(keys.gas) {
    speed=Math.min(speed+0.025,maximum);
  } else {
    speed=Math.max(speed-0.015,0);
  }

  if(keys.left) car.position.x-=0.08;
  if(keys.right) car.position.x+=0.08;

  car.position.x=Math.max(-5,Math.min(5,car.position.x));

  car.position.z-=speed;

  // Keep the road and city around the car
  if(car.position.z < -100) {
    car.position.z=0;
  }

  wheels.forEach(w=>{
    w.rotation.x-=speed*0.15;
  });

  camera.position.set(
    car.position.x,
    5.5,
    car.position.z+10
  );

  camera.lookAt(
    car.position.x,
    1,
    car.position.z-5
  );

  document.getElementById("speed").innerText =
    "SPEED: "+Math.round(speed*100)+" KM/H";

  renderer.render(scene,camera);
}

camera.position.set(0,5,10);
animate();

window.addEventListener("resize",()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>

</body>
</html>
