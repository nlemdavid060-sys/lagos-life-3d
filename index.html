
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAGOS LIFE 3D</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;overflow:hidden;
 background:#111;
 font-family:Arial,sans-serif;
}
#title{
 position:absolute;top:12px;width:100%;
 text-align:center;color:white;
 font-size:25px;font-weight:bold;
 text-shadow:2px 2px 5px black;
 pointer-events:none;
}
#speed,#money{
 position:absolute;left:12px;
 color:white;background:#111c;
 padding:10px;border-radius:10px;
 font-weight:bold;
}
#speed{top:55px}
#money{top:105px;color:#00ff85;font-size:19px}
.controls{
 position:absolute;bottom:20px;width:100%;
 display:flex;justify-content:space-between;
 padding:0 15px;
}
.group{display:flex;gap:10px;align-items:end}
button{
 width:62px;height:62px;
 border:2px solid white;border-radius:16px;
 background:#111d;color:white;
 font-size:22px;font-weight:bold;
 touch-action:none;
}
#gas{width:75px;height:75px;background:#087b35}
#nitro{background:#0758bd}
#phoneButton{
 position:absolute;right:15px;top:15px;
 width:55px;height:55px;background:#222;
}
#phoneScreen{
 display:none;position:absolute;z-index:10;
 top:50%;left:50%;transform:translate(-50%,-50%);
 width:270px;padding:25px;
 border:6px solid #444;border-radius:30px;
 background:#111;color:white;text-align:center;
 box-shadow:0 0 25px black;
}
#phoneScreen h1{color:#00ff85}
#phoneScreen button{
 width:100%;height:45px;margin-top:10px;
 background:#0758bd;font-size:16px;
}
</style>
</head>

<body>

<div id="title">LAGOS LIFE 3D</div>
<div id="speed">SPEED: 0 KM/H</div>
<div id="money">MONEY: ₦50,000</div>

<button id="phoneButton" onclick="openPhone()">📱</button>

<div id="phoneScreen">
 <h2>📱 MY PHONE</h2>
 <p>LAGOS LIFE MOBILE</p>
 <hr>
 <h3>🏦 MY WALLET</h3>
 <h1 id="wallet">₦50,000</h1>
 <p>Welcome to Lagos!</p>
 <button onclick="closePhone()">CLOSE PHONE</button>
</div>

<div class="controls">
 <div class="group">
  <button id="left">◀</button>
  <button id="right">▶</button>
 </div>
 <div class="group">
  <button id="nitro">N₂</button>
  <button id="gas">GO</button>
 </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,40,180);

const camera=new THREE.PerspectiveCamera(
 70,window.innerWidth/window.innerHeight,0.1,500
);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x555555,2));

const sunlight=new THREE.DirectionalLight(0xffffff,2);
sunlight.position.set(-20,40,20);
scene.add(sunlight);

// GROUND
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(300,500),
 new THREE.MeshLambertMaterial({color:0x397d35})
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-0.1;
scene.add(ground);

// ROAD
const road=new THREE.Mesh(
 new THREE.PlaneGeometry(14,500),
 new THREE.MeshLambertMaterial({color:0x292929})
);
road.rotation.x=-Math.PI/2;
scene.add(road);

// ROAD MARKINGS
for(let z=-240;z<250;z+=12){
 const line=new THREE.Mesh(
  new THREE.BoxGeometry(0.25,0.04,5),
  new THREE.MeshBasicMaterial({color:0xffffff})
 );
 line.position.set(0,0.04,z);
 scene.add(line);
}

// CITY BUILDINGS
for(let i=0;i<55;i++){
 const side=i%2===0?-1:1;
 const height=8+Math.random()*22;
 const width=5+Math.random()*5;

 const building=new THREE.Mesh(
  new THREE.BoxGeometry(width,height,7),
  new THREE.MeshLambertMaterial({
   color:[0xd6b58b,0xb5b5b5,0xd4d4d4,0x9eacb5][i%4]
  })
 );
 building.position.set(side*(12+Math.random()*9),height/2,-240+i*9);
 scene.add(building);
}

// LAGOS HOUSES
function createHouse(x,z){
 const house=new THREE.Group();

 const wall=new THREE.Mesh(
  new THREE.BoxGeometry(9,5,8),
  new THREE.MeshLambertMaterial({color:0xe5d1ad})
 );
 wall.position.y=2.5;
 house.add(wall);

 const roof=new THREE.Mesh(
  new THREE.ConeGeometry(7,3,4),
  new THREE.MeshLambertMaterial({color:0x9c2929})
 );
 roof.rotation.y=Math.PI/4;
 roof.position.y=6.5;
 house.add(roof);

 const door=new THREE.Mesh(
  new THREE.BoxGeometry(1.5,2.8,0.15),
  new THREE.MeshLambertMaterial({color:0x55301c})
 );
 door.position.set(0,1.4,4.05);
 house.add(door);

 for(const wx of [-2.7,2.7]){
  const win=new THREE.Mesh(
   new THREE.BoxGeometry(1.5,1.5,0.15),
   new THREE.MeshBasicMaterial({color:0x55bbee})
  );
  win.position.set(wx,3.1,4.05);
  house.add(win);
 }

 house.position.set(x,0,z);
 scene.add(house);
}

for(let i=0;i<12;i++){
 createHouse(-30,-220+i*18);
 createHouse(30,-220+i*18);
}

// BUGATTI
const car=new THREE.Group();
scene.add(car);

const blue=new THREE.MeshStandardMaterial({
 color:0x0649ff,metalness:0.7,roughness:0.25
});
const black=new THREE.MeshStandardMaterial({color:0x111111});
const glass=new THREE.MeshStandardMaterial({
 color:0x111e35,metalness:0.5,roughness:0.2
});

const body=new THREE.Mesh(
 new THREE.BoxGeometry(2.3,0.65,4.5),blue
);
body.position.y=0.8;
car.add(body);

const roofCar=new THREE.Mesh(
 new THREE.BoxGeometry(1.8,0.65,2),glass
);
roofCar.position.set(0,1.35,0.15);
car.add(roofCar);

const hood=new THREE.Mesh(
 new THREE.BoxGeometry(2.1,0.25,1.3),blue
);
hood.position.set(0,1.05,-1.5);
car.add(hood);

const wheels=[];
for(const x of [-1.15,1.15]){
 for(const z of [-1.4,1.4]){
  const wheel=new THREE.Mesh(
   new THREE.CylinderGeometry(0.43,0.43,0.3,24),black
  );
  wheel.rotation.z=Math.PI/2;
  wheel.position.set(x,0.45,z);
  car.add(wheel);
  wheels.push(wheel);
 }
}

for(const x of [-0.75,0.75]){
 const light=new THREE.Mesh(
  new THREE.BoxGeometry(0.4,0.18,0.08),
  new THREE.MeshBasicMaterial({color:0xffffff})
 );
 light.position.set(x,1.02,-2.27);
 car.add(light);
}

car.position.set(0,0,0);

// GAME MONEY AND PHONE
let gameMoney=50000;

function updateMoney(){
 const amount="₦"+gameMoney.toLocaleString("en-NG");
 document.getElementById("money").innerText="MONEY: "+amount;
 document.getElementById("wallet").innerText=amount;
}

function openPhone(){
 document.getElementById("phoneScreen").style.display="block";
}
function closePhone(){
 document.getElementById("phoneScreen").style.display="none";
}

// CONTROLS
const keys={left:false,right:false,gas:false,nitro:false};

function holdButton(id,key){
 const button=document.getElementById(id);
 button.addEventListener("pointerdown",e=>{
  e.preventDefault();
  keys[key]=true;
 });
 const release=()=>keys[key]=false;
 button.addEventListener("pointerup",release);
 button.addEventListener("pointerleave",release);
 button.addEventListener("pointercancel",release);
}

holdButton("left","left");
holdButton("right","right");
holdButton("gas","gas");
holdButton("nitro","nitro");

window.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft")keys.left=true;
 if(e.key==="ArrowRight")keys.right=true;
 if(e.key==="ArrowUp")keys.gas=true;
 if(e.key==="Shift")keys.nitro=true;
});
window.addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft")keys.left=false;
 if(e.key==="ArrowRight")keys.right=false;
 if(e.key==="ArrowUp")keys.gas=false;
 if(e.key==="Shift")keys.nitro=false;
});

let speed=0;

function animate(){
 requestAnimationFrame(animate);

 const maximum=keys.nitro?2.2:1.1;

 if(keys.gas)speed=Math.min(speed+0.025,maximum);
 else speed=Math.max(speed-0.015,0);

 if(keys.left)car.position.x-=0.08;
 if(keys.right)car.position.x+=0.08;

 car.position.x=Math.max(-5,Math.min(5,car.position.x));
 car.position.z-=speed;

 if(car.position.z < -100)car.position.z=0;

 wheels.forEach(w=>w.rotation.x-=speed*0.15);

 camera.position.set(car.position.x,5.5,car.position.z+10);
 camera.lookAt(car.position.x,1,car.position.z-5);

 document.getElementById("speed").innerText=
  "SPEED: "+Math.round(speed*100)+" KM/H";

 renderer.render(scene,camera);
}

camera.position.set(0,5,10);
updateMoney();
animate();

window.addEventListener("resize",()=>{
 camera.aspect=window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>

</body>
</html>
